function ncAgeDays(nc) { return Math.max(0, Math.floor((Date.now() - new Date(nc.date).getTime()) / 86400000)); }
function ageBadge(nc) {
  const d = ncAgeDays(nc);
  const col = d > 30 ? 'var(--red)' : d > 15 ? 'var(--amber)' : 'var(--text3)';
  return `<span style="color:var(--amber)">En cours</span><span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${col};background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin-left:6px" title="Âge de la fiche : ${d} jour(s)">${d}j</span>`;
}

function fmtDate(s) {
  if (!s) return '—';
  const [d,t] = s.split('T');
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}${t?' <span style="color:var(--text3);font-size:11px">'+t.slice(0,5)+'</span>':''}`;
}
function fmtDatePlain(s) {
  if (!s) return '—';
  const [d,t] = s.split('T');
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}${t?' '+t.slice(0,5):''}`;
}

      <input type="text" id="rcedit-${field}" value="${esc(nc[field]||'')}" class="form-input" style="height:26px; font-size:12px; padding:2px 6px; width:150px;" onkeydown="if(event.key==='Enter'){saveRCField('${ncId}','${field}')}if(event.key==='Escape'){openNCDetail('${ncId}')}">
      <button type="button" class="erp-btn erp-btn-ghost" style="padding:2px 6px; box-shadow:none;" onclick="saveRCField('${ncId}','${field}')" title="Enregistrer">
        <svg class="lucide" viewBox="0 0 24 24" style="width:14px;height:14px; color:var(--accent);"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </span>
  `;
  const inp = document.getElementById(`rcedit-${field}`);
  inp.focus();
  inp.select();
}

async function saveRCField(ncId, field) {
  const nc = ncs.find(n => n.id === ncId);
  const input = document.getElementById(`rcedit-${field}`);
  const prevValue = nc[field];
  nc[field] = input.value;
  try {
    const success = await updateNCDataFile(nc);
    if (success) {
      render();
      openNCDetail(ncId);
      notify('Champ mis à jour');
    } else {
      nc[field] = prevValue;
      notify("Erreur lors de la mise à jour !", true);
    }
  } catch(err) {
    nc[field] = prevValue;
    console.error(err);
    notify("Erreur lors de la mise à jour !", true);
  }
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function updateTopbar(txt) { $('topbar-count').textContent = txt; }

function detailCard(label, val) {
  return `<div class="detail-card"><div class="detail-label">${label}</div><div class="detail-value">${val}</div></div>`;
}

// SORT
function th(label, key, sortable=true) {
  const active = sortConfig.key === key;
  const arrow = active ? (sortConfig.dir === 'asc' ? '↑' : '↓') : '';
  if (!sortable) return `<th>${label}</th>`;
  return `<th class="${active?'sorted':''}" onclick="setSort('${key}')">${label} ${arrow?`<span style="font-size:10px;color:var(--accent)">${arrow}</span>`:''}</th>`;
}
function setSort(key) {
  if (sortConfig.key === key) sortConfig.dir = sortConfig.dir === 'asc' ? 'desc' : 'asc';
  else { sortConfig.key = key; sortConfig.dir = 'asc'; }
  render();
}
function doSort(a, b) {
  let va = a[sortConfig.key] ?? '', vb = b[sortConfig.key] ?? '';
  if (typeof va === 'number' && typeof vb === 'number') return sortConfig.dir==='asc' ? va-vb : vb-va;
  va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
  if (va < vb) return sortConfig.dir==='asc' ? -1 : 1;
  if (va > vb) return sortConfig.dir==='asc' ? 1 : -1;
  return 0;
}

// ══════════════════════════════════════════
// RACCOURCIS CLAVIER
// Échap : fermer · ←/→ : navigation lightbox · / ou Ctrl+K : recherche · N : nouvelle fiche
// ══════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  // Lightbox prioritaire
  if ($('lightbox')?.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); lbNav(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); lbNav(1); }
    return;
  }
  const modalOpen = $('modal-overlay')?.classList.contains('open');
  if (e.key === 'Escape' && modalOpen) { closeModal(); return; }
  if (!workingDirHandle || modalOpen) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) { e.preventDefault(); $('search-input')?.focus(); }
  else if (e.key.toLowerCase() === 'n') {
    e.preventDefault();
    if (currentView === 'mer') { openCreateModal(true); }
    else { navigate('qualite'); openCreateModal(); }
  }
});

// NOTIFY
function notify(txt, isError = false) {
  const el = $('notif');
  $('notif-text').textContent = txt;
  el.className = isError ? 'show error' : 'show';
  setTimeout(() => el.classList.remove('show', 'error'), 2800);
}

</script>
