<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheminement de câbles — Éditeur & Doc opérateur</title>
<!--
  ============================================================================
  CHEMINEMENT DE CABLES
  Application 100% locale, un seul fichier, aucune dépendance réseau.
  Fonctionne en double-cliquant le fichier (protocole file://).
  ============================================================================
-->
<style id="app-css">
/* ------------------------------------------------------------------ base */
:root{
  /* clair — le chrome se fait discret, l'accent ne sert qu'à l'action */
  --bg:#f3f5f9;
  --bg-2:#ffffff;
  --bg-3:#f7f9fc;
  --line:#e4e8ef;
  --line-2:#c9d2e0;
  --tx:#0f1b2d;
  --tx-2:#4a5b73;
  --tx-3:#8494a9;
  --acc:#2563eb;
  --acc-2:#1d4ed8;
  --ok:#0f8a52;
  --warn:#a86a12;
  --danger:#c8354a;
  --hov:#eef3fc;
  --head:#fbfcfe;
  --top-grad:#ffffff;
  --stage-top:#e8ecf3;
  --pop:rgba(255,255,255,.97);
  --mask:rgba(15,27,45,.38);
  --sw-bd:rgba(15,27,45,.22);
  --note-bg:#fdf7ea;
  --note-bd:#ecd39a;
  --note-tx:#7a5310;
  --done-bg:#e8f6ee;
  --done-bd:#a8dcbf;
  --done-tx:#0b6e40;
  --dgr-bg:#fdeef0;
  --dgr-bd:#eeb3bd;
  --dgr-tx:#a32338;
  --r:8px;
  --sh:0 1px 2px rgba(15,23,42,.06),0 10px 28px rgba(15,23,42,.10);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.theme-dark{
  --bg:#0a1120;
  --bg-2:#101a2c;
  --bg-3:#16213a;
  --line:#21304a;
  --line-2:#33466a;
  --tx:#e7edf8;
  --tx-2:#9fb1ca;
  --tx-3:#6b7d99;
  --acc:#4d8dfd;
  --acc-2:#2f6fe0;
  --ok:#2fbd77;
  --warn:#e9a33f;
  --danger:#ef5f6b;
  --hov:#182643;
  --head:#0d1626;
  --top-grad:#0d1626;
  --stage-top:#101a2d;
  --pop:rgba(16,26,44,.97);
  --mask:rgba(4,9,20,.72);
  --sw-bd:rgba(255,255,255,.28);
  --note-bg:rgba(233,163,63,.11);
  --note-bd:rgba(233,163,63,.34);
  --note-tx:#f2d5a4;
  --done-bg:rgba(47,189,119,.13);
  --done-bd:rgba(47,189,119,.36);
  --done-tx:#7fdcaa;
  --dgr-bg:rgba(239,95,107,.13);
  --dgr-bd:rgba(239,95,107,.38);
  --dgr-tx:#ffc2c9;
  --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- layout */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 14px;height:52px;flex:0 0 52px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-2) 60%,var(--top-grad));
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(135deg,var(--acc),#7b5cff);
  display:grid;place-items:center;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 40%,transparent)
}
.logo svg{width:16px;height:16px}
.brand-txt{min-width:0}
.brand-title{font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}

/* quatre colonnes : étapes · plan · photo · fils */
.body{display:flex;flex:1;min-height:0}
.col{background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
.col-steps{width:246px;flex:0 0 246px;border-right:1px solid var(--line)}
.col-photo{width:258px;flex:0 0 258px;border-left:1px solid var(--line)}
.col-cables{width:296px;flex:0 0 296px;border-left:1px solid var(--line)}
.col-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-2)}
.stage{
  flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage-top)
}
.panel-head{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;flex:0 0 36px;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx-3);
  border-bottom:1px solid var(--line);font-weight:700;background:var(--head)
}
.panel-head .count{margin-left:auto;color:var(--tx-3);font-size:11px;letter-spacing:0;text-transform:none}
.panel-head .btn{margin-left:auto}
.scroll{overflow:auto;flex:1;min-height:0}

@media (max-width:1500px){
  .col-photo{width:206px;flex-basis:206px}
  .col-cables{width:262px;flex-basis:262px}
  .col-steps{width:212px;flex-basis:212px}
}

/* ---------------------------------------------------------------- boutons */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx);cursor:pointer;
  white-space:nowrap;transition:background .12s,border-color .12s,transform .06s
}
.btn:hover{background:var(--hov);border-color:var(--acc)}

.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:550}
.btn.primary:hover{background:var(--acc-2);border-color:var(--acc-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--tx)}
.btn.danger:hover{background:var(--dgr-bg);border-color:var(--dgr-bd);color:var(--dgr-tx)}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px;border-radius:7px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.icon.sm{width:26px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 15px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{
  height:28px;padding:0 11px;background:transparent;border:0;color:var(--tx-2);cursor:pointer;
  border-right:1px solid var(--line);font-size:12.5px;font-weight:500
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.seg button:hover:not(.on){background:var(--hov);color:var(--tx)}

/* --------------------------------------------------------------- étapes */
.grp{border-bottom:1px solid var(--line)}
.grp-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  background:var(--head);color:var(--tx-2);font-size:11.5px;font-weight:650;letter-spacing:.5px;
  position:sticky;top:0;z-index:2
}
.grp-head:hover{color:var(--tx)}
.grp-head .chev{transition:transform .15s;flex:0 0 auto;opacity:.7}
.grp.collapsed .chev{transform:rotate(-90deg)}
.grp.collapsed .grp-body{display:none}
.grp-head .n{margin-left:auto;font-weight:500;color:var(--tx-3)}

.step{
  display:flex;align-items:center;gap:9px;padding:7px 12px 7px 9px;cursor:pointer;
  border-left:3px solid transparent;position:relative
}
.step:hover{background:var(--hov)}
.step.on{background:var(--hov);border-left-color:var(--acc)}
.step.done .idx{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.step .idx{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;
  background:var(--bg-3);border:1px solid var(--line);font-size:11px;font-family:var(--mono);color:var(--tx-2)
}
.step.on .idx{background:var(--acc-2);border-color:var(--acc);color:#fff;font-weight:600}
.step .txt{min-width:0;flex:1}
.step .t1{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .t2{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.step.on .t2{color:var(--tx-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;border:1px solid var(--sw-bd);box-shadow:0 0 0 2px rgba(0,0,0,.25) inset}
.step .grab{opacity:0;color:var(--tx-3);cursor:grab;flex:0 0 auto}
.step:hover .grab{opacity:.8}
.step.dragging{opacity:.45}
.step.drop-before{box-shadow:inset 0 2px 0 var(--acc)}
.step.drop-after{box-shadow:inset 0 -2px 0 var(--acc)}
.empty{padding:22px 16px;color:var(--tx-3);text-align:center;font-size:12.5px;line-height:1.6}

/* ---------------------------------------------------------------- stage */
.stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;background:transparent}
#svg.pan{cursor:grab}
#svg.panning{cursor:grabbing}
#svg.draw{cursor:crosshair}
.stage-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;
  border-top:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap
}
.stage-bar .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:700;white-space:nowrap}
.stage-bar{flex-wrap:nowrap;overflow-x:auto}
.stage-bar::-webkit-scrollbar{height:0}
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
  background:var(--pop);border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;backdrop-filter:blur(3px);
  font-size:12.5px;color:var(--tx-2);box-shadow:var(--sh);pointer-events:none;max-width:90%;text-align:center
}
.hint b{color:var(--tx)}
.hint kbd{
  font-family:var(--mono);font-size:11px;background:var(--bg-3);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--tx);margin:0 1px
}
.stepper{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--pop);border:1px solid var(--line-2);border-radius:11px;padding:6px 8px;box-shadow:var(--sh);backdrop-filter:blur(3px)
}
.stepper .pos{font-family:var(--mono);font-size:12.5px;color:var(--tx-2);min-width:74px;text-align:center}
.stepper .pos b{color:var(--tx);font-size:14px}

/* --------------------------------------------------------------- fiche */
.fiche{padding:14px}
.fiche h2{margin:0 0 3px;font-size:17px;font-weight:650;letter-spacing:.2px}
.fiche .sub{color:var(--tx-3);font-size:12px;margin-bottom:14px;font-family:var(--mono)}
.wire-head{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);margin-bottom:12px
}
.wire-swatch{
  width:42px;height:42px;border-radius:11px;flex:0 0 42px;border:1px solid var(--sw-bd);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)
}
.wire-head .wn{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.5px}
.wire-head .wc{font-size:12px;color:var(--tx-2)}
.route{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.node{
  display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:var(--bg-3);
  border:1px solid var(--line);border-radius:var(--r)
}
.node .pin{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#04101f
}
.node.from .pin{background:var(--ok)}
.node.to .pin{background:var(--acc)}
.node .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.node .v{font-size:19px;font-weight:650;font-family:var(--mono);word-break:break-word;letter-spacing:.4px}
.route .arrow{height:14px;margin-left:25px;border-left:2px dashed var(--line-2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cell{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.cell .v{font-size:15px;font-weight:600;font-family:var(--mono)}
.cell .v small{font-size:11px;color:var(--tx-3);font-weight:400;font-family:var(--sans)}
.note{
  background:var(--note-bg);border:1px solid var(--note-bd);border-left-width:3px;
  border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--note-tx);white-space:pre-wrap
}
.note .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--warn);font-weight:650;margin-bottom:2px}
.check{
  display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);cursor:pointer;user-select:none
}
.check:hover{border-color:var(--line-2)}
.check input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.check.on{background:var(--done-bg);border-color:var(--done-bd)}

/* --------------------------------------------------------- zone de travail */
.wk-head{
  display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
  background:var(--bg-2)
}
.wk-head h2{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-sub{font-size:11.5px;color:var(--tx-3);font-family:var(--mono);white-space:nowrap;flex:0 0 auto;margin-left:auto}

/* pied de la colonne des étapes */
.foot{border-top:1px solid var(--line);padding:9px}
.foot-row{display:flex;gap:6px}
.prop{margin-top:8px}
.prop label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650;margin-bottom:3px}
.inp.sm{height:28px;font-size:12.5px}

/* ------------------------------------------------- remarque & check-liste */
.rq{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg-2);max-height:34vh;overflow:auto}
.rq-in{padding:10px 14px}
.rq-box{
  background:var(--note-bg);border:1px solid var(--note-bd);border-left-width:3px;
  border-radius:var(--r);padding:9px 12px;color:var(--note-tx);font-size:13px;white-space:pre-wrap
}
.rq-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;font-weight:650;color:var(--warn);margin-bottom:3px}
.chk-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chk{
  display:flex;align-items:center;gap:8px;padding:6px 11px 6px 8px;border-radius:20px;
  background:var(--bg-3);border:1px solid var(--line-2);font-size:12.5px;cursor:pointer;user-select:none
}
.chk:hover{border-color:var(--acc)}
.chk.on{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.chk .b{
  width:17px;height:17px;flex:0 0 17px;border-radius:5px;border:1.5px solid var(--line-2);
  background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:800
}
.chk.on .b{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .x{margin-left:2px;color:var(--tx-3);font-size:14px;line-height:1;opacity:0}
.chk:hover .x{opacity:.8}
.chk input{
  font:inherit;font-size:12.5px;color:inherit;background:none;border:0;outline:none;
  width:130px;min-width:60px
}
.rq-empty{
  font-size:12.5px;color:var(--tx-3);padding:9px 12px;border:1px dashed var(--line-2);
  border-radius:var(--r);text-align:center
}

/* --------------------------------------------------------- album de photos */
.album{padding:9px;display:flex;flex-direction:column;gap:9px}
.ph{margin:0;position:relative;cursor:zoom-in}
.ph img{
  width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);
  background:var(--bg-3);transition:border-color .12s
}
.ph:hover img{border-color:var(--acc)}
.ph figcaption{
  font-size:11px;color:var(--tx-3);margin-top:4px;text-align:center;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.ph-x{
  position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;border:0;
  background:rgba(10,20,36,.66);color:#fff;cursor:pointer;font-size:15px;line-height:1;opacity:0;
  transition:opacity .12s
}
.ph:hover .ph-x{opacity:1}
.ph-x:hover{background:var(--danger)}

/* ------------------------------------------------------------ visionneuse */
.viewer{position:fixed;inset:0;z-index:95;background:rgba(6,11,20,.985);display:flex;flex-direction:column}
.vw-bar{
  display:flex;align-items:center;gap:8px;padding:9px 12px;color:#e9effc;
  background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.12);flex:0 0 auto
}
.vw-nm{font-size:13px;font-family:var(--mono);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-sp{flex:1}
.vw-z{font-family:var(--mono);font-size:12.5px;min-width:56px;text-align:center;opacity:.85}
.vw-b{
  height:28px;min-width:28px;padding:0 10px;border-radius:7px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:13px
}
.vw-b:hover{background:rgba(255,255,255,.18)}
.vw-stage{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;cursor:grab;padding:18px}
.vw-stage.grab{cursor:grabbing}
.vw-img{max-width:96%;max-height:96%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.vw-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:9px;
  background:rgba(255,255,255,.1);color:#fff;font-size:28px;line-height:1;cursor:pointer;z-index:2
}
.vw-nav:hover{background:rgba(255,255,255,.2)}
.vw-nav.prev{left:14px} .vw-nav.next{right:14px}
.vw-count{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-family:var(--mono);
  font-size:12.5px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:20px
}

/* -------------------------------------------------------------- les fonds */
.bg-list{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--bg)}
.bg-row{display:flex;align-items:center;gap:7px;padding:5px 7px;cursor:pointer;border-bottom:1px solid var(--line)}
.bg-row:last-child{border-bottom:0}
.bg-row:hover{background:var(--hov)}
.bg-row.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.bg-row img{width:34px;height:24px;flex:0 0 34px;object-fit:cover;border-radius:4px;border:1px solid var(--line-2)}
.bg-nm{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-nm span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
.bg-x{
  width:20px;height:20px;flex:0 0 20px;border:0;border-radius:5px;background:none;color:var(--tx-3);
  cursor:pointer;font-size:15px;line-height:1;opacity:0
}
.bg-row:hover .bg-x{opacity:1}
.bg-x:hover{background:var(--dgr-bg);color:var(--dgr-tx)}
.bg-empty{padding:9px;text-align:center;font-size:12px;color:var(--tx-3)}
.lbl-n{
  margin-left:6px;font-family:var(--mono);background:var(--bg-3);border:1px solid var(--line);
  border-radius:20px;padding:0 6px;letter-spacing:0
}

/* ---------------------------------------------------------- avancement */
.prog{padding:11px 13px;border-top:1px solid var(--line)}
.prog-t{display:flex;align-items:baseline;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx-3);font-weight:650}
.prog-t b{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--tx);letter-spacing:0}
.prog-bar{height:6px;margin-top:7px;border-radius:20px;background:var(--bg-3);border:1px solid var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok);border-radius:20px;transition:width .25s}

/* ------------------------------------------------------- note et divers */
.note-in{
  width:100%;padding:8px 10px;margin-bottom:4px;background:var(--note-bg);
  border:1px solid var(--note-bd);border-left-width:3px;border-radius:var(--r);
  color:var(--note-tx);font:inherit;font-size:12.5px;resize:none;outline:none;overflow:hidden
}
.note-in::placeholder{color:var(--tx-3);opacity:.9}
.note-in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.tip{font-size:11.5px;color:var(--tx-3);margin:2px 2px 0;line-height:1.5}
.rename{
  width:100%;height:24px;padding:0 6px;font:inherit;font-size:13px;font-weight:550;
  background:var(--bg);border:1px solid var(--acc);border-radius:6px;outline:none
}

/* ------------------------------------------------------------ ligne fil */
.cabs{padding:6px}
.cab{
  display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;
  border:1px solid transparent;cursor:pointer;line-height:1.3
}
.cab+.cab{margin-top:1px}
.cab:hover{background:var(--hov)}
.cab.on{background:color-mix(in srgb,var(--acc) 12%,transparent);border-color:var(--acc)}
.cab.done{background:var(--done-bg)}
.cab.done .cab-num,.cab.done .cab-route b{color:var(--done-tx)}
.cab-tick{
  width:17px;height:17px;flex:0 0 17px;border-radius:5px;display:grid;place-items:center;
  border:1.5px solid var(--line-2);background:var(--bg);font-size:11px;font-weight:800;color:#fff
}
.cab.done .cab-tick{background:var(--ok);border-color:var(--ok)}
.cab-sw{
  width:14px;height:14px;flex:0 0 14px;border-radius:4px;border:1px solid var(--sw-bd);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)
}
.cab-num{
  font-family:var(--mono);font-size:13px;font-weight:700;flex:0 0 auto;min-width:34px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px
}
.cab-route{
  display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;
  color:var(--tx-2);flex:1;min-width:0
}
.cab-route b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.cab-route i{font-style:normal;color:var(--acc);flex:0 0 auto}
.cab-n{
  font-family:var(--mono);font-size:10.5px;color:var(--tx-3);flex:0 0 auto;
  border:1px solid var(--line);border-radius:20px;padding:0 6px
}
.cab-n.vide{color:var(--warn);border-color:var(--note-bd);background:var(--note-bg)}
.cab-more{
  width:20px;height:20px;flex:0 0 20px;border:0;border-radius:5px;
  background:none;color:var(--tx-3);cursor:pointer;opacity:0;transition:opacity .12s,background .12s
}
.cab:hover .cab-more,.cab.on .cab-more{opacity:1}
.cab-more:hover{background:var(--line);color:var(--tx)}
.cab-more svg{width:14px;height:14px;display:block;margin:0 auto}

/* le fil ouvert : ses champs, juste en dessous de sa ligne */
.cab-edit{
  margin:2px 0 6px;padding:9px;border:1px solid var(--acc);border-radius:8px;
  background:var(--bg-3)
}
.cab-edit .row{gap:6px}
.cab-edit .field{margin-bottom:6px}
.cab-edit .inp{height:29px}
.cab-edit .acts{display:flex;gap:6px;align-items:center;margin-top:2px}
.cab-edit .acts .sp{flex:1}

/* ------------------------------------------------------------ menu contextuel *//* ------------------------------------------------------------ menu contextuel */
.ctx{
  position:fixed;z-index:90;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:var(--sh);padding:4px;min-width:170px
}
.ctx button{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:none;border:0;
  border-radius:6px;text-align:left;cursor:pointer;font-size:13px;color:var(--tx)
}
.ctx button:hover{background:var(--hov)}
.ctx button.danger:hover{background:var(--dgr-bg);color:var(--dgr-tx)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ------------------------------------------------------------ accordéon */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-3);margin-bottom:9px;overflow:hidden}
.acc>summary{
  list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx-2);font-weight:650;user-select:none
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{color:var(--tx)}
.acc>summary::after{
  content:'';width:7px;height:7px;flex:0 0 7px;margin-left:auto;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .16s
}
.acc[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.acc>summary .peek{
  margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--tx-3);
  text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.acc>summary .peek~::after{margin-left:8px}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc[open]>summary .peek{display:none}
.accb{padding:12px}
.accb .kv,.accb .field:last-child{margin-bottom:0}

/* ------------------------------------------------------- liste des plans */
.imglist{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.imgrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.imgrow:last-child{border-bottom:0}
.imgrow img{
  width:56px;height:40px;flex:0 0 56px;object-fit:cover;border-radius:6px;
  border:1px solid var(--line-2);background:var(--bg-3)
}
.imgrow .txt{flex:1;min-width:0}
.imgrow .nm{height:28px}
.imgrow .mt{font-size:11px;color:var(--tx-3);font-family:var(--mono);margin-top:2px}

/* --------------------------------------------------------------- formes */
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650;margin-bottom:4px}
.inp{
  width:100%;height:30px;padding:0 9px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:6px;outline:none;font-size:13px;transition:border-color .12s,box-shadow .12s
}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;min-height:60px;font-family:inherit}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.inp{cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.sw-row{display:flex;align-items:center;gap:8px}
.sw-prev{width:32px;height:32px;border-radius:8px;flex:0 0 32px;border:1px solid var(--line-2)}

/* --------------------------------------------------------------- modale */
.mask{position:fixed;inset:0;background:var(--mask);z-index:60;display:grid;place-items:center;padding:20px}
.modal{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh);
  width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column
}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center;gap:8px}
.modal .mbody{padding:16px;overflow:auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:none}
.toast{
  position:relative;
  background:var(--bg-3);border:1px solid var(--line-2);border-left:3px solid var(--ok);
  padding:10px 16px;border-radius:10px;box-shadow:var(--sh);font-size:13px;
  animation:pop .18s ease-out
}
.toast.err{border-left-color:var(--danger)}
.toast.work{border-left-color:var(--acc);display:flex;align-items:center;gap:9px}
.spin{
  width:13px;height:13px;flex:0 0 13px;border-radius:50%;
  border:2px solid var(--line-2);border-top-color:var(--acc);animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{
  display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-2)
}
.tag.warn{background:var(--note-bg);border-color:var(--note-bd);color:var(--note-tx)}
.tag.ok{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}

/* -------------------------------------------------------------- viewer */
body.viewer .editor-only{display:none !important}


/* ------------------------------------------------------------ impression */
#print-head{display:none}
@media print{
  #print-head{display:block;margin:0 0 10px;border-bottom:2px solid #000;padding-bottom:6px}
  #print-head h1{margin:0;font-size:17px}
  #print-head div{font-size:11.5px;color:#333;font-family:var(--mono)}
  body{overflow:visible;background:#fff;color:#000}
  .topbar,.stage-bar,.col-steps,.hint,.stepper,.editor-only,#left-foot{display:none !important}
  .app,.body{display:block;height:auto}
  .col,.col-main{width:auto;flex:none;border:0;background:#fff;display:block}
  .panel-head{background:#fff;border-color:#bbb}
  .cab,.rq-box{background:#fff;border-color:#bbb;break-inside:avoid}
  .stage-wrap{height:52vh;page-break-inside:avoid}
  .col-photo img{max-height:38vh}
}
</style>

<body>
<div id="root"></div>

<!-- =====================================================================
     MOTEUR + VUE OPERATEUR
     Ce bloc est relu tel quel au moment de l'export : il constitue à lui
     seul le fichier autonome remis à l'opérateur. Ne pas y mettre de code
     d'édition.
     ================================================================== -->
<script id="viewer-js">
/* ----------------------------------------------------------- constantes */
var WIRE_COLORS = [
  {id:'noir',    name:'Noir',       hex:'#20262e'},
  {id:'marron',  name:'Marron',     hex:'#7b4b26'},
  {id:'rouge',   name:'Rouge',      hex:'#e03040'},
  {id:'orange',  name:'Orange',     hex:'#f2811d'},
  {id:'jaune',   name:'Jaune',      hex:'#f2c832'},
  {id:'vert',    name:'Vert',       hex:'#31b45e'},
  {id:'bleu',    name:'Bleu',       hex:'#2f86e8'},
  {id:'violet',  name:'Violet',     hex:'#9163d8'},
  {id:'gris',    name:'Gris',       hex:'#9aa4b2'},
  {id:'blanc',   name:'Blanc',      hex:'#eef2f7'},
  {id:'rose',    name:'Rose',       hex:'#ee7fb0'},
  {id:'turq',    name:'Turquoise',  hex:'#2ec7c0'},
  {id:'vj',      name:'Vert/Jaune', hex:'#31b45e', hex2:'#f2c832'},
  {id:'bb',      name:'Bleu clair', hex:'#79c0ff'}
];
function colorOf(id){
  for(var i=0;i<WIRE_COLORS.length;i++){ if(WIRE_COLORS[i].id===id) return WIRE_COLORS[i]; }
  return WIRE_COLORS[0];
}
var DEF_W = 1600, DEF_H = 1000;

/* Épaisseur du tracé, en unités du schéma. */
function wireWidth(P){ return P.settings.thickness||6; }
/* Unité de dessin liée au schéma, jamais au zoom : repères et étiquettes
   conservent donc leur taille par rapport au plan quand on zoome. */
function docUnit(b){ return Math.max(10,((b&&b.w)||DEF_W)/100); }
/* ------------------------------------------------- collection de plans ---
   Un projet porte plusieurs plans ; chaque étape désigne celui sur lequel
   son fil est tracé. Les repères appartiennent eux aussi à un plan. */
function imageById(P,id){
  var L=P.images||[];
  for(var i=0;i<L.length;i++){ if(L[i].id===id) return L[i]; }
  return null;
}
/* --------------------------------------------------------- fonds de plan ---
   Une étape peut poser plusieurs images de fond, chacune avec sa position et
   sa taille dans le repère du dessin. Les tracés vivent dans ce repère. */
function stepBgs(P,st){
  if(!st) return [];
  return (st.bgs||[]).filter(function(b){ return imageById(P,b.img); });
}
function curBgs(S){ return stepBgs(S.project, S.project.steps[S.current]); }
/* Le repère de travail : l'emprise de tous les fonds de l'étape. */
function stepBounds(P,st){
  var L=stepBgs(P,st);
  if(!L.length) return { x:0, y:0, w:DEF_W, h:DEF_H };
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  L.forEach(function(b){
    x0=Math.min(x0,b.x); y0=Math.min(y0,b.y);
    x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h);
  });
  return { x:x0, y:y0, w:Math.max(1,x1-x0), h:Math.max(1,y1-y0) };
}
function curBounds(S){ return stepBounds(S.project, S.project.steps[S.current]); }
/* Signature des fonds : sert au cache d'affichage et au regroupement. */
function bgKeyOf(P,st){
  return stepBgs(P,st).map(function(b){
    return b.img+':'+Math.round(b.x)+','+Math.round(b.y)+','+Math.round(b.w)+','+Math.round(b.h);
  }).join('|');
}
/* Le fond principal : celui qui identifie le plan de l'étape. */
function mainBg(P,st){ var L=stepBgs(P,st); return L.length?imageById(P,L[0].img):null; }
function curMainBg(S){ return mainBg(S.project, S.project.steps[S.current]); }
/* Couleurs du dessin selon le thème. */
function ink(P){
  return (P.settings.theme==='sombre')
   ? {grid:'#1b2f57',frame:'#1d3159',vd:'#0a1730',vdTx:'#3d5480',
      lblBg:'#081020',lblTx:'#e9effc',halo:'#03080f',haloOp:'.75',markBg:'#0d1a33'}
   : {grid:'#ccd9ec',frame:'#b3c6e0',vd:'#eef3fa',vdTx:'#9fb0c8',
      lblBg:'#ffffff',lblTx:'#10203a',halo:'#ffffff',haloOp:'.85',markBg:'#ffffff'};
}

/* --------------------------------------------------------------- utils */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function q(sel,ctx){ return (ctx||document).querySelector(sel); }
function qa(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function uid(){ return 's'+Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(n,d){ var f=Math.pow(10,d==null?1:d); return Math.round(n*f)/f; }

function emptyProject(){
  return {
    version:1, kind:'cheminement-cables',
    title:'Cheminement de câbles', ref:'', revision:'', author:'', date:'',
    images:[],               /* collection de plans réutilisables */
    release:{ trigram:'', hard:'', date:'' },   /* cartouche de la version remise */
    steps:[], marks:[],
    settings:{ ghost:'prev', labels:true, thickness:6, thickAuto:true, theme:'clair' }
  };
}
/* Un câble : son repère, sa couleur, son origine, son extrémité, son tracé. */
function emptyCable(){
  return { id:uid(), num:'', color:'noir', from:'', to:'', path:[] };
}
/* Une étape rassemble les câbles à brancher d'un même tenant, typiquement
   un connecteur. */
function emptyStep(n){
  return { id:uid(), group:'', name:'Étape '+n, note:'', checks:[],
           bgs:[], photos:[], cables:[emptyCable()] };
}
function curStep(S){ return S.project.steps[S.current]||null; }
function curCable(S){
  var st=curStep(S); if(!st||!st.cables.length) return null;
  var i=(S.cable>=0)?S.cable:0;
  return st.cables[clamp(i,0,st.cables.length-1)];
}
function cableLabel(c,i){ return c && c.num ? 'Câble '+c.num : 'Câble '+(i+1); }

/* ------------------------------------------------- géométrie orthogonale */
/* Chaque point porte un coude (elbow) : 'h' = on part à l'horizontale,
   'v' = on part à la verticale. Le tracé rendu est donc toujours composé
   de segments strictement horizontaux ou verticaux. */
function routePoints(path){
  var out=[];
  if(!path || !path.length) return out;
  out.push({x:path[0].x,y:path[0].y});
  for(var i=1;i<path.length;i++){
    var a=path[i-1], b=path[i];
    if(a.x!==b.x && a.y!==b.y){
      if((b.elbow||'h')==='h') out.push({x:b.x,y:a.y});
      else out.push({x:a.x,y:b.y});
    }
    out.push({x:b.x,y:b.y});
  }
  return out;
}
function pathD(path){
  var p=routePoints(path); if(!p.length) return '';
  var d='M '+fmt(p[0].x,2)+' '+fmt(p[0].y,2);
  for(var i=1;i<p.length;i++) d+=' L '+fmt(p[i].x,2)+' '+fmt(p[i].y,2);
  return d;
}
function pathLen(path){
  var p=routePoints(path), L=0;
  for(var i=1;i<p.length;i++) L+=Math.abs(p[i].x-p[i-1].x)+Math.abs(p[i].y-p[i-1].y);
  return L;
}

/* ------------------------------------------------------------- squelette */
function buildLayout(root){
  root.innerHTML =
  '<div class="app">'+
    '<header class="topbar">'+
      '<div class="brand">'+
        '<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M4 4v9a3 3 0 0 0 3 3h6"/><circle cx="4" cy="4" r="1.6" fill="#fff"/><circle cx="19" cy="16" r="2.4"/>'+
        '</svg></div>'+
        '<div class="brand-txt"><div class="brand-title" id="hd-title">—</div><div class="brand-sub" id="hd-sub"></div></div>'+
      '</div>'+
      '<div class="spacer"></div>'+
      '<div class="top-actions" id="top-actions"></div>'+
    '</header>'+
    '<div id="print-head"></div>'+
    '<div class="body">'+

      '<aside class="col col-steps">'+
        '<div class="panel-head"><span>Étapes</span><span class="count" id="step-count"></span></div>'+
        '<div class="scroll" id="step-list"></div>'+
        '<div id="left-foot"></div>'+
      '</aside>'+

      '<section class="col-main">'+
        '<div id="rq"></div>'+
        '<div class="stage">'+
          '<div class="stage-wrap" id="stage-wrap">'+
            '<svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>'+
            '<div class="stepper">'+
              '<button class="btn icon sm" id="nav-prev" title="Étape précédente (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
              '<div class="pos" id="nav-pos">—</div>'+
              '<button class="btn icon sm" id="nav-next" title="Étape suivante (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'+
            '</div>'+
            '<div class="hint" id="hint" style="display:none"></div>'+
          '</div>'+
          '<div class="stage-bar" id="stage-bar"></div>'+
        '</div>'+
      '</section>'+

      '<aside class="col col-photo">'+
        '<div class="panel-head"><span>Photo du réel</span><span class="count" id="photo-act"></span></div>'+
        '<div class="scroll" id="photo"></div>'+
      '</aside>'+

      '<aside class="col col-cables">'+
        '<div class="panel-head"><span>Fils</span><span class="count" id="cab-count"></span></div>'+
        '<div class="scroll" id="fiche"></div>'+
        '<div id="right-foot"></div>'+
      '</aside>'+

    '</div>'+
  '</div>';
}

/* ---------------------------------------------------------------- rendu ---
   Le dessin est réparti en trois couches indépendantes :
     #g-bg    le plan, reconstruit seulement quand on change de plan ;
     #g-wires les fils, les marqueurs et les repères ;
     #g-over  le calque d'édition (poignées, segment en cours).
   Un plan en 8K pèse plusieurs dizaines de mégaoctets : reconstruire sa
   balise <image> à chaque mouvement de souris obligeait le navigateur à la
   redécoder, ce qui saccadait tout. Le fond reste donc en place, et comme
   plus aucune cote ne dépend du zoom, déplacer ou zoomer ne touche même
   que l'attribut viewBox. */
/* Le plan doit rester attrapable : on borne le cadrage pour qu'au moins un
   tiers de la vue reste sur l'image, quel que soit le déplacement. */
function clampView(S){
  var d=curBounds(S), v=S.view; if(!v) return;
  var mx=v.w*.34, my=v.h*.34;
  var lox=d.x-mx, hix=d.x+d.w-v.w+mx;
  var loy=d.y-my, hiy=d.y+d.h-v.h+my;
  v.x = (lox>hix) ? d.x+(d.w-v.w)/2 : clamp(v.x,lox,hix);
  v.y = (loy>hiy) ? d.y+(d.h-v.h)/2 : clamp(v.y,loy,hiy);
}
function applyView(S){
  var svg=q('#svg'), v=S.view; if(!svg||!v) return;
  clampView(S);
  svg.setAttribute('viewBox', fmt(v.x,2)+' '+fmt(v.y,2)+' '+fmt(v.w,2)+' '+fmt(v.h,2));
}
/* Les plans déjà affichés restent en place, simplement masqués : revenir sur
   l'un d'eux est alors immédiat, là où reconstruire sa balise <image> impose
   au navigateur de redécoder plusieurs dizaines de mégaoctets. On en garde
   trois, un 8K décodé occupant beaucoup de mémoire. */
var BG_CACHE = 4;
function setBackgrounds(S,bgs){
  var g=q('#g-bg'); if(!g) return;
  var P=S.project;
  qa('image',g).forEach(function(n){ n.style.display='none'; });
  bgs.forEach(function(b){
    var im=imageById(P,b.img); if(!im) return;
    var node=null, nodes=qa('image',g);
    for(var i=0;i<nodes.length;i++){ if(nodes[i].getAttribute('data-img')===im.id) node=nodes[i]; }
    if(!node){
      node=document.createElementNS('http://www.w3.org/2000/svg','image');
      node.setAttribute('data-img',im.id);
      node.setAttribute('href',im.data);
      node.setAttributeNS('http://www.w3.org/1999/xlink','href',im.data);
      node.setAttribute('preserveAspectRatio','none');
      g.appendChild(node);
      while(qa('image',g).length>BG_CACHE){
        var first=qa('image',g)[0];
        if(first===node) break;
        g.removeChild(first);
      }
    }else{
      g.appendChild(node);          /* le plus récemment vu passe en queue */
    }
    node.setAttribute('x',b.x); node.setAttribute('y',b.y);
    node.setAttribute('width',b.w); node.setAttribute('height',b.h);
    node.style.display='';
  });
}
function renderOverlay(S){
  var g=q('#g-over'); if(g) g.innerHTML = S.overlay ? S.overlay(S) : '';
}
function renderCanvas(S){
  var P=S.project, svg=q('#svg'), st0=P.steps[S.current];
  var bnd=curBounds(S), W=bnd.w, H=bnd.h;
  var sig=(st0?st0.id:'')+'#'+bgKeyOf(P,st0);
  /* changement d'étape ou de fonds : on recadre, l'ancien zoom n'a plus de sens */
  if(!S.view || S.viewSig!==sig){
    S.viewSig=sig;
    var m=Math.max(W,H)*.02;
    S.view={x:bnd.x-m,y:bnd.y-m,w:W+m*2,h:H+m*2};
  }
  if(!q('#g-bg')){
    svg.innerHTML='<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">'+
      '<path d="M40 0H0V40" fill="none" stroke="#8899bb" stroke-opacity=".35" stroke-width="1"/></pattern></defs>'+
      '<g id="g-bg"></g><g id="g-frame"></g><g id="g-wires"></g><g id="g-over"></g>';
    S.bgKey=null;
  }
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  applyView(S);

  var C = ink(P), u = docUnit(bnd);

  /* ------------------------------------------------------------ les fonds */
  var bgs=stepBgs(P,st0);
  setBackgrounds(S,bgs);
  var frameKey=sig+'|'+P.settings.theme;
  if(S.frameKey!==frameKey){
    S.frameKey=frameKey;
    var fr='';
    if(!bgs.length){
      fr+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+C.vd+'"/>'+
          '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#grid)"/>'+
          '<text x="'+(W/2)+'" y="'+(H/2)+'" fill="'+C.vdTx+'" font-size="'+(u*2)+'" text-anchor="middle" font-family="system-ui">Aucun fond de plan</text>';
    }else{
      bgs.forEach(function(b){
        fr+='<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="none" stroke="'+C.frame+'" stroke-width="'+(u*.07)+'"/>';
      });
    }
    q('#g-frame').innerHTML=fr;
  }

  /* ------------------------------------------------------------- les fils */
  var s='';
  var cur=S.current, steps=P.steps, ghost=P.settings.ghost;
  var W2=wireWidth(P);

  function drawCable(c,fade){
    if(!c.path || c.path.length<2) return '';
    var col=colorOf(c.color), d=pathD(c.path), o='';
    var op = fade ? ' stroke-opacity=".45"' : '';
    o+='<path d="'+d+'" fill="none" stroke="'+C.halo+'" stroke-opacity="'+(fade?'.45':C.haloOp)+'" stroke-width="'+(W2+u*(fade?.12:.22))+'" stroke-linecap="round" stroke-linejoin="round"/>';
    o+='<path d="'+d+'" fill="none" stroke="'+col.hex+'"'+op+' stroke-width="'+W2+'" stroke-linecap="round" stroke-linejoin="round"/>';
    if(col.hex2) o+='<path d="'+d+'" fill="none" stroke="'+col.hex2+'"'+op+' stroke-width="'+W2+'" stroke-dasharray="'+(W2*2.2)+' '+(W2*2.2)+'" stroke-linecap="butt"/>';
    return o;
  }

  /* étapes précédentes, en transparence */
  var lo = ghost==='all' ? 0 : (ghost==='prev' ? Math.max(0,cur-1) : cur);
  if(ghost!=='none'){
    for(var i=lo;i<cur;i++){
      var st=steps[i]; if(!st) continue;
      if(bgKeyOf(P,st)!==bgKeyOf(P,st0)) continue;   /* autres fonds : sans objet ici */
      st.cables.forEach(function(c){ s+=drawCable(c,true); });
    }
  }

  /* l'étape courante : tous ses câbles */
  var st2 = steps[cur];
  if(st2){
    /* Le tracé se suffit à lui-même : ni pastille d'extrémité, ni marque de
       coude. Seul le repère du câble est porté, au milieu du parcours. */
    st2.cables.forEach(function(c){
      s+=drawCable(c,false);
      if(P.settings.labels && c.num && c.path.length>1){
        var col=colorOf(c.color);
        var rp=routePoints(c.path), mid=rp[Math.floor(rp.length/2)];
        var fs=Math.max(W2*2.2,u*.9), tw=String(c.num).length*fs*.66+fs;
        var dy=W2*.9+fs*1.2;
        s+='<g><rect x="'+(mid.x-tw/2)+'" y="'+(mid.y-dy)+'" rx="'+(fs*.42)+'" width="'+tw+'" height="'+(fs*1.45)+'" fill="'+C.lblBg+'" fill-opacity=".94" stroke="'+col.hex+'" stroke-width="'+(fs*.11)+'"/>'+
           '<text x="'+mid.x+'" y="'+(mid.y-dy+fs*1.08)+'" fill="'+C.lblTx+'" font-size="'+fs+'" font-family="ui-monospace,monospace" text-anchor="middle">'+esc(c.num)+'</text></g>';
      }
    });
  }

  var mainId=(curMainBg(S)||{}).id;
  (P.marks||[]).filter(function(m){ return !mainId || !m.img || m.img===mainId; }).forEach(function(m){
    var mf=u*1.15, w=String(m.text||'').length*mf*.62+mf*1.3, h=mf*1.85;
    s+='<g class="mark" data-mark="'+m.id+'">'+
       '<rect x="'+(m.x-w/2)+'" y="'+(m.y-h/2)+'" rx="'+(mf*.42)+'" width="'+w+'" height="'+h+'" fill="'+C.markBg+'" fill-opacity=".94" stroke="#1a63d6" stroke-width="'+(mf*.1)+'"/>'+
       '<text x="'+m.x+'" y="'+(m.y+mf*.36)+'" fill="'+C.lblTx+'" font-size="'+mf+'" font-weight="600" font-family="system-ui" text-anchor="middle">'+esc(m.text)+'</text>'+
       '</g>';
  });
  q('#g-wires').innerHTML=s;
  renderOverlay(S);
}
/* ------------------------------------------------------- liste de gauche */
function renderSteps(S){
  var P=S.project, host=q('#step-list');
  q('#step-count').textContent = P.steps.length ? (S.current+1)+' / '+P.steps.length : '0';
  if(!P.steps.length){
    host.innerHTML='<div class="empty">Aucune étape.<br>'+(S.edit?'Cliquez sur <b>+ Étape</b> pour commencer.':'')+'</div>';
    return;
  }
  /* regroupement par connecteur, ordre d'apparition conservé */
  var groups=[], map={};
  P.steps.forEach(function(st,i){
    var g=(st.group||'').trim() || '—';
    if(!map[g]){ map[g]={name:g,items:[]}; groups.push(map[g]); }
    map[g].items.push({st:st,i:i});
  });
  var html='';
  groups.forEach(function(g){
    var collapsed = S.collapsed[g.name] ? ' collapsed':'';
    var single = groups.length===1 && g.name==='—';
    html+='<div class="grp'+collapsed+'" data-grp="'+esc(g.name)+'">';
    if(!single){
      html+='<div class="grp-head"><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
            '<span>'+esc(g.name)+'</span><span class="n">'+g.items.length+'</span></div>';
    }
    html+='<div class="grp-body">';
    g.items.forEach(function(o){
      var st=o.st, i=o.i;
      var done = st.cables.length>0 && st.cables.every(function(c){ return S.done[c.id]; });
      var dots = st.cables.slice(0,4).map(function(c){
        var k=colorOf(c.color);
        return '<span class="dot" style="'+(k.hex2?'background:linear-gradient(135deg,'+k.hex+' 50%,'+k.hex2+' 50%)':'background:'+k.hex)+'"></span>';
      }).join('');
      var nums = st.cables.map(function(c,ci){ return c.num||'—'; }).join(' · ');
      html+='<div class="step'+(i===S.current?' on':'')+(done?' done':'')+'" data-i="'+i+'"'+(S.edit?' draggable="true"':'')+'>'+
        '<div class="idx">'+(done?'✓':(i+1))+'</div>'+
        '<div class="dots">'+dots+'</div>'+
        '<div class="txt"><div class="t1">'+esc(st.name||('Étape '+(i+1)))+'</div>'+
          '<div class="t2">'+st.cables.length+' câble'+(st.cables.length>1?'s':'')+' · '+esc(nums)+'</div></div>'+
        (S.edit?'<span class="grab" title="Glisser pour réordonner">⠿</span>':'')+
      '</div>';
    });
    html+='</div></div>';
  });
  host.innerHTML=html;

  qa('.step',host).forEach(function(elm){
    elm.addEventListener('click',function(){ S.go(parseInt(elm.dataset.i,10)); });
  });
  qa('.grp-head',host).forEach(function(h){
    h.addEventListener('click',function(e){
      e.stopPropagation();
      var name=h.parentNode.dataset.grp;
      S.collapsed[name]=!S.collapsed[name];
      renderSteps(S);
    });
  });
  if(S.onStepsRendered) S.onStepsRendered(S);
  var on=q('.step.on',host); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}

/* ------------------------------------------------------- fiche de droite */
/* ------------------------------------------------ bandeau haut : remarque
   et points à vérifier, cochables au poste. */
function stepTitle(S){
  var P=S.project, st=P.steps[S.current];
  if(!st) return '';
  var bits=[];
  if(st.group) bits.push(esc(st.group));
  var nb=stepBgs(P,st).length;
  if(nb===1) bits.push('plan '+esc((mainBg(P,st)||{}).name||'—'));
  else if(nb>1) bits.push(nb+' fonds');
  return '<div class="wk-head"><h2>'+esc(st.name||('Étape '+(S.current+1)))+'</h2>'+
    '<span class="wk-sub">Étape '+(S.current+1)+' / '+P.steps.length+
    (bits.length?' · '+bits.join(' · '):'')+'</span></div>';
}
function renderRq(S){
  if(S.edit && window.editorRq) return window.editorRq(S);

  if(!st){ host.innerHTML=''; return; }

  host.innerHTML=stepTitle(S)+'<div class="rq-in">'+
    (st.note?'<div class="rq-box"><div class="rq-k">Remarque</div>'+esc(st.note)+'</div>':'')+

        '<span class="b">'+(S.done[k.id]?'✓':'')+'</span>'+esc(k.text)+'</span>';

/* ------------------------------------------------------ photos du réel ---
   Une étape porte un album ; la colonne en montre les vignettes et la
   visionneuse permet d'y regarder de près. */

        .filter(function(x){ return !!x; });

      ? 'Aucune photo.<br>Bouton <b>Ajouter</b> ci-dessus.'

  host.innerHTML='<div class="album">'+L.map(function(im,i){
