/* Visionneuse : l'image est cadrée à l'ouverture, la molette zoome autour du
   pointeur, le glisser fait défiler, les flèches passent d'une photo à
   l'autre. */
function viewer(list,index){
  var i=index, z=1, ox=0, oy=0, drag=null;
  var b=document.createElement('div');
  b.className='viewer';
  b.innerHTML=
    '<div class="vw-bar">'+
      '<span class="vw-nm"></span>'+
      '<span class="vw-sp"></span>'+
      '<button class="vw-b" data-z="out" title="Dézoomer">−</button>'+
      '<span class="vw-z">100 %</span>'+
      '<button class="vw-b" data-z="in" title="Zoomer">+</button>'+
      '<button class="vw-b" data-z="fit" title="Cadrer">Cadrer</button>'+
      '<button class="vw-b" data-x title="Fermer (Échap)">✕</button>'+
    '</div>'+
    '<button class="vw-nav prev" title="Précédente (←)">‹</button>'+
    '<div class="vw-stage"><img class="vw-img" alt=""></div>'+
    '<button class="vw-nav next" title="Suivante (→)">›</button>'+
    '<div class="vw-count"></div>';
  document.body.appendChild(b);
  var img=q('.vw-img',b), stage=q('.vw-stage',b);

  function show(){
    var im=list[i];
    img.src=im.data;
    q('.vw-nm',b).textContent=im.name+'  ·  '+im.w+' × '+im.h+' px';
    q('.vw-count',b).textContent=(i+1)+' / '+list.length;
    qa('.vw-nav',b).forEach(function(n){ n.style.display=list.length>1?'':'none'; });
    fit();
  }
  function fit(){ z=1; ox=0; oy=0; apply(); }
  function apply(){
    img.style.transform='translate('+ox+'px,'+oy+'px) scale('+z+')';
    q('.vw-z',b).textContent=Math.round(z*100)+' %';
  }
  function zoomAt(f,cx,cy){
    var r=stage.getBoundingClientRect();
    var px=cx-r.left-r.width/2, py=cy-r.top-r.height/2;
    var nz=clamp(z*f,.2,12);
    var k=nz/z;
    ox=px-(px-ox)*k; oy=py-(py-oy)*k;
    z=nz; apply();
  }
  function close(){ b.remove(); window.removeEventListener('keydown',key); }
  function key(e){
    if(e.key==='Escape'){ e.stopPropagation(); close(); }
    if(e.key==='ArrowLeft'){ e.stopPropagation(); i=(i-1+list.length)%list.length; show(); }
    if(e.key==='ArrowRight'){ e.stopPropagation(); i=(i+1)%list.length; show(); }
    if(e.key==='+'||e.key==='='){ zoomAt(1.25,innerWidth/2,innerHeight/2); }
    if(e.key==='-'){ zoomAt(1/1.25,innerWidth/2,innerHeight/2); }
    if(e.key==='0'){ fit(); }
  }
  stage.addEventListener('wheel',function(e){
    e.preventDefault(); zoomAt(e.deltaY>0?1/1.15:1.15, e.clientX, e.clientY);
  },{passive:false});
  stage.addEventListener('mousedown',function(e){
    e.preventDefault(); drag={x:e.clientX-ox,y:e.clientY-oy}; stage.classList.add('grab');
  });
  window.addEventListener('mousemove',function(e){
    if(!drag) return; ox=e.clientX-drag.x; oy=e.clientY-drag.y; apply();
  });
  window.addEventListener('mouseup',function(){ drag=null; stage.classList.remove('grab'); });
  stage.addEventListener('dblclick',function(e){ zoomAt(z>1.5?1/z:2, e.clientX, e.clientY); });
  q('[data-x]',b).addEventListener('click',close);
  b.addEventListener('click',function(e){ if(e.target===b) close(); });
  q('.prev',b).addEventListener('click',function(){ i=(i-1+list.length)%list.length; show(); });
  q('.next',b).addEventListener('click',function(){ i=(i+1)%list.length; show(); });
  qa('[data-z]',b).forEach(function(n){
    n.addEventListener('click',function(){
      var m=n.dataset.z;
      if(m==='fit') fit();
      else zoomAt(m==='in'?1.3:1/1.3, innerWidth/2, innerHeight/2);
    });
  });
  window.addEventListener('keydown',key);
  show();
}

/* ------------------------------------------------------ liste des fils */
function renderFiche(S){
  if(S.edit && window.editorFiche) return window.editorFiche(S);
  var P=S.project, st=P.steps[S.current], host=q('#fiche');
  var cnt=q('#cab-count');
  if(!st){ host.innerHTML='<div class="empty">Sélectionnez une étape.</div>'; if(cnt) cnt.textContent=''; return; }
  var fait=st.cables.filter(function(c){ return S.done[c.id]; }).length;
  if(cnt) cnt.textContent=fait+' / '+st.cables.length;
  host.innerHTML='<div class="cabs">'+
    st.cables.map(function(c,i){ return cableRow(c,i,{done:!!S.done[c.id],check:true}); }).join('')+
  '</div>';
  qa('.cab',host).forEach(function(el){
    el.addEventListener('click',function(){
      var c=st.cables[parseInt(el.dataset.ci,10)];
      S.done[c.id]=!S.done[c.id];
      renderSteps(S); renderFiche(S); renderProgress(S);
    });
  });
}
/* Une ligne par fil, d'une seule hauteur de texte : une étape peut en
   compter beaucoup, et chaque ligne gagnée est une ligne visible sans
   défiler. */
function cableRow(c,i,o){
  o=o||{};
  var k=colorOf(c.color);
  var sw = k.hex2 ? 'background:linear-gradient(135deg,'+k.hex+' 50%,'+k.hex2+' 50%)' : 'background:'+k.hex;
  return '<div class="cab'+(o.done?' done':'')+(o.sel?' on':'')+'" data-ci="'+i+'" title="'+
      esc((c.num?c.num+' · ':'')+(c.from||'—')+' → '+(c.to||'—'))+'">'+
    (o.check?'<span class="cab-tick">'+(o.done?'✓':'')+'</span>':'')+
    '<span class="cab-sw" style="'+sw+'" title="'+esc(k.name)+'"></span>'+
    '<span class="cab-num">'+esc(c.num||'—')+'</span>'+
    '<span class="cab-route"><b>'+esc(c.from||'—')+'</b><i>→</i><b>'+esc(c.to||'—')+'</b></span>'+
    (o.right||'')+
  '</div>';
}
/* Mémorise l'état déplié d'un bloc, dès le clic. */
function bindAcc(det,key,S){
  var sum=det.querySelector('summary'); if(!sum) return;
  sum.addEventListener('click',function(){ S.open[key]=!det.open; });
}
/* --------------------------------------------------- navigation / clavier */
function makeState(project, edit){
  var S={ project:project, current:0, cable:0, openCable:false, edit:!!edit,
          collapsed:{}, done:{}, open:{det:false,etp:false}, view:null, overlay:null };
  S.go=function(i){
    if(!S.project.steps.length){ S.current=0; }
    else S.current=clamp(i,0,S.project.steps.length-1);
    S.cable=0; S.openCable=false; S.sel=-1;
    S.render();
  };
  S.render=function(){
    renderSteps(S); renderRq(S); renderPhoto(S); renderFiche(S);
    renderCanvas(S); renderNav(S); renderProgress(S);
    if(S.afterRender) S.afterRender(S);
  };
  return S;
}
function renderProgress(S){
  var host=q('#right-foot'); if(!host||S.edit) return;
  var tot=0, fait=0;
  S.project.steps.forEach(function(st){
    st.cables.forEach(function(c){ tot++; if(S.done[c.id]) fait++; });
  });
  var pc = tot ? Math.round(fait/tot*100) : 0;
  host.innerHTML=
    '<div class="prog">'+
      '<div class="prog-t"><span>Avancement</span><b>'+fait+' / '+tot+'</b></div>'+
      '<div class="prog-bar"><i style="width:'+pc+'%"></i></div>'+
    '</div>';
}
function renderNav(S){
  var n=S.project.steps.length;
  q('#nav-pos').innerHTML = n? '<b>'+(S.current+1)+'</b> / '+n : '—';
  q('#nav-prev').disabled = S.current<=0;
  q('#nav-next').disabled = S.current>=n-1;
  var t=S.project.title||'Cheminement de câbles';
  q('#hd-title').textContent=t;
  var P=S.project, r=P.release||{};
  var bits=[]; if(P.ref) bits.push(P.ref);
  if(P.revision) bits.push('Ind. '+P.revision);
  if(r.hard) bits.push('Version Hard '+r.hard);
  if(r.trigram) bits.push(r.trigram);
  if(r.date||P.date) bits.push(r.date||P.date);
  if(P.author) bits.push(P.author);
  q('#hd-sub').textContent=bits.join('  ·  ');
  var ph=q('#print-head');
  if(ph) ph.innerHTML='<h1>'+esc(t)+'</h1><div>'+esc(bits.join('  ·  '))+'</div>';
  document.title = t + (S.project.ref? ' — '+S.project.ref : '');
}
function fitView(S){
  var d=curBounds(S), m=Math.max(d.w,d.h)*.02;
  S.view={x:d.x-m,y:d.y-m,w:d.w+m*2,h:d.h+m*2};
  applyView(S);
}
function bindViewport(S){
  var svg=q('#svg'), wrap=q('#stage-wrap');
  function toImg(ev){
    var r=svg.getBoundingClientRect();
    var vb=S.view, sc=Math.min(r.width/vb.w, r.height/vb.h);
    var ox=(r.width - vb.w*sc)/2, oy=(r.height - vb.h*sc)/2;
    return { x: (ev.clientX-r.left-ox)/sc + vb.x, y: (ev.clientY-r.top-oy)/sc + vb.y };
  }
  S.toImg=toImg;
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var p=toImg(e), f=e.deltaY>0?1.15:1/1.15;
    var nw=clamp(S.view.w*f, 40, curBounds(S).w*2.4);
    var ratio=nw/S.view.w;
    S.view={ x:p.x-(p.x-S.view.x)*ratio, y:p.y-(p.y-S.view.y)*ratio, w:nw, h:S.view.h*ratio };
    applyView(S);
  },{passive:false});
  var pan=null;
  svg.addEventListener('mousedown',function(e){
    var wantPan = e.button===1 || (e.button===0 && (e.shiftKey||S.spaceDown||S.tool==='pan'));
    if(!wantPan) return;
    e.preventDefault(); svg.classList.add('panning');
    pan={sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};
  });
  window.addEventListener('mousemove',function(e){
    if(!pan) return;
    var r=svg.getBoundingClientRect(), sc=Math.min(r.width/S.view.w,r.height/S.view.h);
    S.view.x=pan.vx-(e.clientX-pan.sx)/sc; S.view.y=pan.vy-(e.clientY-pan.sy)/sc;
    applyView(S);
  });
  window.addEventListener('mouseup',function(){ pan=null; svg.classList.remove('panning'); });
  window.addEventListener('resize',function(){ applyView(S); });
  q('#nav-prev').addEventListener('click',function(){ S.go(S.current-1); });
  q('#nav-next').addEventListener('click',function(){ S.go(S.current+1); });
  window.addEventListener('keydown',function(e){
    var t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
    if(e.code==='Space'){ S.spaceDown=true; svg.classList.add('pan'); }
    if(e.key==='ArrowLeft'){ S.go(S.current-1); }
    if(e.key==='ArrowRight'){ S.go(S.current+1); }
    if(e.key==='0'){ fitView(S); }
    if(e.key==='+'||e.key==='='){ zoomBy(S,1/1.25); }
    if(e.key==='-'){ zoomBy(S,1.25); }
    if(e.key==='g'||e.key==='G'){ cycleGhost(S); }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space'){ S.spaceDown=false; svg.classList.remove('pan'); }
  });
}
function zoomBy(S,f){
  var cx=S.view.x+S.view.w/2, cy=S.view.y+S.view.h/2;
  var nw=clamp(S.view.w*f,40,curBounds(S).w*2.4), r=nw/S.view.w;
  S.view={x:cx-S.view.w*r/2, y:cy-S.view.h*r/2, w:nw, h:S.view.h*r};
  applyView(S);
}
function cycleGhost(S){
  var o=['none','prev','all'], i=o.indexOf(S.project.settings.ghost);
  S.project.settings.ghost=o[(i+1)%3];
  qa('#ghost-seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.g===S.project.settings.ghost); });
  renderCanvas(S);
}
function ghostSeg(S){
  var g=S.project.settings.ghost;
  return '<span class="lbl">Fils déjà posés</span>'+
    '<span class="seg" id="ghost-seg">'+
      '<button data-g="none"'+(g==='none'?' class="on"':'')+' title="Ne montrer que l\'étape courante">Aucun</button>'+
      '<button data-g="prev"'+(g==='prev'?' class="on"':'')+' title="Montrer l\'étape précédente">Préc.</button>'+
      '<button data-g="all"'+(g==='all'?' class="on"':'')+' title="Montrer toutes les étapes précédentes">Tous</button>'+
    '</span>';
}
function bindGhostSeg(S){
  qa('#ghost-seg button').forEach(function(b){
    b.addEventListener('click',function(){
      S.project.settings.ghost=b.dataset.g;
      qa('#ghost-seg button').forEach(function(x){ x.classList.toggle('on',x===b); });
      renderCanvas(S);
    });
  });
}
function zoomBtns(){
  return '<button class="btn sm" id="z-fit" title="Ajuster la vue (0)">Ajuster</button>';
}
function bindZoomBtns(S){
  var b=q('#z-fit');
  if(b) b.addEventListener('click',function(){ fitView(S); });
}
function applyTheme(P){
  document.body.classList.toggle('theme-dark', P.settings.theme==='sombre');
}
function themeBtn(){
  return '<button class="btn icon" id="t-theme" title="Fond clair / fond sombre">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>';
}
function bindThemeBtn(S,after){
  var b=q('#t-theme'); if(!b) return;
  b.addEventListener('click',function(){
    S.project.settings.theme = S.project.settings.theme==='sombre' ? 'clair' : 'sombre';
    applyTheme(S.project); renderCanvas(S); if(after) after();
  });
}
/* Bandeau d'attente : lire et décoder un plan en 8K prend plusieurs secondes,
   il faut le dire. Renvoie la fonction qui le retire. */
function toastHost(){
  var h=q('.toasts');
  if(!h){ h=document.createElement('div'); h.className='toasts'; document.body.appendChild(h); }
  return h;
}
function working(msg){
  var t=document.createElement('div');
  t.className='toast work';
  t.innerHTML='<span class="spin"></span>'+esc(msg);
  toastHost().appendChild(t);
  return function(){ t.remove(); };
}
function toast(msg,err){
  var t=document.createElement('div');
  t.className='toast'+(err?' err':''); t.textContent=msg;
  toastHost().appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); },320); },2200);
}

/* ------------------------------------------------------- boot opérateur */
function bootViewer(project){
  document.body.classList.add('viewer');
  var S=makeState(project,false);
  window.S=S;
  buildLayout(q('#root'));
  applyTheme(project);
  q('#top-actions').innerHTML= themeBtn()+
    '<button class="btn" id="op-print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg> Imprimer</button>'+
    '<button class="btn" id="op-reset" title="Décocher toutes les étapes">Réinitialiser le suivi</button>';
  q('#stage-bar').innerHTML = '<div style="flex:1"></div>'+ghostSeg(S)+
    '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+zoomBtns();
  bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindThemeBtn(S);

  /* Le suivi de câblage ne vit que le temps de la session : rien n'est
     écrit sur le poste. La fermeture est donc confirmée si des cases
     ont été cochées. */
  S.done={};
  S.saveDone=function(){};
  window.addEventListener('beforeunload',function(e){
    for(var k in S.done){ if(S.done[k]){ e.preventDefault(); e.returnValue=''; return ''; } }
  });
  q('#op-print').addEventListener('click',function(){ window.print(); });
  q('#op-reset').addEventListener('click',function(){
    if(confirm('Décocher tous les câbles ?')){ S.done={}; S.render(); }
  });
  fitView(S); S.go(0);
}
</script>

<!-- =====================================================================
     EDITEUR (jamais exporté)
     ================================================================== -->
<script id="editor-js">
(function(){
  var S=null;
  var dirty=false;          /* modifications non enregistrées */

  /* ------------------------------------------------------------- démarrage */
  function boot(){
    var p=emptyProject();
    S=makeState(p,true);
    window.S=S;
    S.tool='view'; S.sel=-1; S.cable=0; S.openCable=false; S.bg=-1;
    S.elbow='h'; S.snap=10; S.magnet=true;   /* aimantation et grille toujours actives */
    applyTheme(S.project);
    buildLayout(q('#root'));
    topbar(); stagebar(); leftfoot();
    var head=q('.col-cables .panel-head');
    head.innerHTML='<span>Fils</span><span class="count" id="cab-count"></span>'+
      '<button class="btn sm" id="c-add" style="margin-left:8px">+ Fil</button>';
    q('#c-add').addEventListener('click',addCable);
    bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindStage();
    S.overlay=overlay;
    S.onStepsRendered=bindDnd;
    S.afterRender=function(){ hint(); stepProps(); };
    fitView(S);
    if(!S.project.steps.length) addStep();
    else S.render();
  }
  function migrate(o){
    var d=emptyProject();
    o.settings=Object.assign({},d.settings,o.settings||{});
    o.marks=o.marks||[]; o.steps=o.steps||[]; o.images=o.images||[];
    o.release=Object.assign({trigram:'',hard:'',date:''},o.release||{});
    /* projets antérieurs à la collection de plans : un seul schéma */
    if(o.image){
      o.images=[{id:uid(),name:'Schéma',data:o.image,w:o.imgW||DEF_W,h:o.imgH||DEF_H}];
      delete o.image; delete o.imgW; delete o.imgH;
    }
    var first=o.images[0]||null;
    o.steps.forEach(function(st){
      st.id=st.id||uid(); st.group=st.group||''; st.note=st.note||'';
      st.checks=st.checks||[];
      st.checks.forEach(function(k){ k.id=k.id||uid(); k.text=k.text||''; });
      /* album : un champ unique auparavant */
      if(!st.photos) st.photos = st.photo ? [st.photo] : [];
      delete st.photo;
      st.photos=st.photos.filter(function(id){ return imageById(o,id); });
      /* fonds : une seule image de plan auparavant */
      if(!st.bgs){
        var bim=imageById(o,st.img);
        st.bgs = bim ? [{ id:uid(), img:bim.id, x:0, y:0, w:bim.w, h:bim.h }] : [];
      }
      delete st.img;
      st.bgs=st.bgs.filter(function(b){ return imageById(o,b.img); });
      st.bgs.forEach(function(b){
        var bi=imageById(o,b.img);
        b.id=b.id||uid();
        b.x=+b.x||0; b.y=+b.y||0;
        b.w=+b.w||bi.w; b.h=+b.h||bi.h;
      });
      /* projets antérieurs : une étape portait un seul fil */
      if(!st.cables){
        var w=st.wire||{};
        st.cables=[{ id:uid(), num:w.num||'', color:w.color||'noir',
                     from:w.from||'', to:w.to||'', path:st.path||[] }];
      }
      delete st.wire; delete st.path;
      st.cables.forEach(function(c){
        c.id=c.id||uid(); c.path=c.path||[]; c.color=c.color||'noir';
        delete c.section; delete c.length; delete c.comment;
      });
      if(!st.cables.length) st.cables=[emptyCable()];
      if(!st.bgs.length && first) st.bgs=[{ id:uid(), img:first.id, x:0, y:0, w:first.w, h:first.h }];
    });
    o.marks.forEach(function(m){ if(!imageById(o,m.img)) m.img=first?first.id:''; });
    return Object.assign(d,o);
  }

  /* ------------------------------------------------------------------------
     Rien n'est écrit sur le poste : l'enregistrement du projet est un geste
     explicite. On se contente de signaler l'état et de confirmer la sortie. */
  function touch(){
    if(!dirty){ dirty=true; flagDirty(); }
  }
  function clean(){ dirty=false; flagDirty(); }
  function flagDirty(){
    var f=q('#dirty'); if(!f) return;
    f.style.display = dirty ? 'inline-flex' : 'none';
    var b=q('#t-save'); if(b) b.classList.toggle('primary', dirty);
  }
  window.addEventListener('beforeunload',function(e){
    if(dirty){ e.preventDefault(); e.returnValue=''; return ''; }
  });

  /* ---------------------------------------------------------- barre haute */
  var ICO='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';

  function topbar(){
    q('#top-actions').innerHTML=
      '<span id="dirty" class="tag warn" style="display:none">● non enregistré</span>'+themeBtn()+
      '<button class="btn icon" id="t-doc" title="Plans et réglages du tracé"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg></button>'+
      '<button class="btn" id="t-open">Ouvrir</button>'+
      '<button class="btn" id="t-save">Enregistrer</button>'+
      '<button class="btn primary" id="t-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 20h16"/></svg> Exporter pour l\'opérateur</button>'+
      '<input type="file" id="f-img" accept="image/*" multiple hidden><input type="file" id="f-json" accept=".json,application/json" hidden>';
    bindThemeBtn(S,touch);
    flagDirty();
    q('#f-img').addEventListener('change',onImage);
    q('#f-json').addEventListener('change',onOpen);
    q('#t-doc').addEventListener('click',dlgDoc);
    q('#t-open').addEventListener('click',function(){ q('#f-json').click(); });
    q('#t-save').addEventListener('click',saveJson);
    q('#t-export').addEventListener('click',dlgExport);
  }

  /* ---------------------------------------------------------- barre basse */
  function stagebar(){
    q('#stage-bar').innerHTML=
      '<span class="seg" id="tool-seg">'+
        '<button data-t="view" title="Voir le tracé seul (Échap)">Vue</button>'+
        '<button data-t="draw" title="Tracer le câble sélectionné (D)">Tracer</button>'+
        '<button data-t="edit" title="Déplacer les points (V)">Modifier</button>'+
        '<button data-t="mark" title="Poser une étiquette sur le plan">Repère</button>'+
        '<button data-t="bg" title="Déplacer et redimensionner les fonds">Fond</button>'+
      '</span>'+
      '<div style="flex:1"></div>'+
      ghostSeg(S)+
      '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+
      '<button class="btn sm" id="z-fit">Ajuster</button>';
    qa('#tool-seg button').forEach(function(b){
      b.addEventListener('click',function(){ setTool(b.dataset.t); });
    });
    syncSeg();
  }

  function syncSeg(){
    qa('#tool-seg button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===S.tool); });
  }
  function setTool(t){
    S.tool=t; S.sel=-1; syncSeg();
    var svg=q('#svg');
    svg.classList.toggle('draw', t==='draw'||t==='mark');
    hint(); renderCanvas(S);
  }
  function hint(){
    var h=q('#hint');
    var txt='';
    if(S.tool==='draw'){
      var c0=curCable(S);
      txt='Tracé de <b>'+esc(c0?cableLabel(c0,S.cable):'—')+'</b> · <b>Clic</b> = poser un point · '+
          '<kbd>Tab</kbd> inverser le coude · <kbd>Retour arr.</kbd> annuler le dernier · <kbd>Échap</kbd> terminer';
    }else if(S.tool==='mark'){
      txt='<b>Clic</b> = poser un repère (X1, Wago A, Flexisoft…) · <kbd>Échap</kbd> terminer';
    }else if(S.tool==='bg'){
      txt='<b>Glisser</b> un fond pour le déplacer · <b>poignées d\'angle</b> pour le redimensionner · <kbd>Échap</kbd> terminer';
    }else if(S.tool==='edit'){
      var c1=curCable(S);
      txt=(c1 && c1.path.length)
        ? '<b>Glisser</b> un point pour le déplacer · <b>Clic droit</b> sur un point = le retirer · <b>Double-clic</b> sur un coude = inverser · <kbd>Échap</kbd> terminer'
        : 'Ce câble n\'a pas encore de tracé.';
    }
    h.innerHTML=txt; h.style.display= txt?'block':'none';
  }

  /* --------------------------------------------------------- bas de liste */
  function leftfoot(){
    q('#left-foot').innerHTML=
      '<div class="foot">'+
        '<div class="foot-row">'+
          '<button class="btn primary sm" id="s-add" style="flex:1">+ Étape</button>'+
          '<button class="btn sm icon" id="s-dup" title="Dupliquer l\'étape">'+
            '<svg '+ICO+'><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>'+
          '<button class="btn sm icon danger" id="s-del" title="Supprimer l\'étape">'+
            '<svg '+ICO+'><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>'+
        '</div>'+
        '<div id="step-props"></div>'+
      '</div>';
    q('#s-add').addEventListener('click',function(){ addStep(); });
    q('#s-dup').addEventListener('click',dupStep);
    q('#s-del').addEventListener('click',delStep);
    stepProps();
  }

  /* Propriétés de l'étape : son groupe et ses fonds de plan. */
  function stepProps(){
    var host=q('#step-props'); if(!host) return;
    var P=S.project, st=curStep(S);
    if(!st){ host.innerHTML=''; return; }
    var bgs=stepBgs(P,st);
    host.innerHTML=
      '<div class="prop"><label>Connecteur / groupe</label>'+
        '<input class="inp sm" id="e-group" list="grp-list" value="'+esc(st.group)+'" placeholder="X1 — Flexisoft">'+
        '<datalist id="grp-list">'+groupOpts()+'</datalist></div>'+
      '<div class="prop"><label>Fonds de plan<span class="lbl-n">'+bgs.length+'</span></label>'+
        '<div class="bg-list">'+
          (bgs.length?bgs.map(function(b,i){
            var im=imageById(P,b.img);
            return '<div class="bg-row'+(i===S.bg?' on':'')+'" data-bg="'+i+'">'+
              '<img src="'+im.data+'" alt="">'+
              '<div class="bg-nm">'+esc(im.name)+'<span>'+Math.round(b.w)+' × '+Math.round(b.h)+'</span></div>'+
              '<button class="bg-x" data-bgx="'+i+'" title="Retirer ce fond">×</button>'+
            '</div>';
          }).join(''):'<div class="bg-empty">Aucun fond</div>')+
        '</div>'+
        '<button class="btn sm" id="e-img-add" style="width:100%;margin-top:6px;justify-content:center">+ Ajouter un fond</button>'+
        ((P.images||[]).length?'<select class="inp sm" id="e-img-lib" style="margin-top:5px">'+
          '<option value="">Reprendre un plan déjà chargé…</option>'+
          (P.images||[]).map(function(im){ return '<option value="'+im.id+'">'+esc(im.name)+'</option>'; }).join('')+
        '</select>':'')+
        (bgs.length?'<div class="tip" style="margin-top:5px">Outil <b>Fond</b> pour déplacer et redimensionner.</div>':'')+
      '</div>';

    q('#e-group').addEventListener('input',function(){ st.group=this.value; touch(); renderSteps(S); });
    q('#e-img-add').addEventListener('click',function(){ pickImage({assign:true}); });
    var lib=q('#e-img-lib');
    if(lib) lib.addEventListener('change',function(){
      var im=imageById(P,this.value); this.value='';
      if(!im) return;
      addBg(st,im); touch(); S.viewSig=null; S.render();
    });
    qa('[data-bg]',host).forEach(function(el){
      el.addEventListener('click',function(e){
        if(e.target.hasAttribute('data-bgx')) return;
        S.bg=parseInt(el.dataset.bg,10); setTool('bg');
      });
    });
    qa('[data-bgx]',host).forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var i=parseInt(b.dataset.bgx,10);
        if(!confirm('Retirer ce fond de l\'étape ?')) return;
        st.bgs.splice(i,1); S.bg=-1; touch(); S.viewSig=null; S.render();
      });
    });
  }

  function addStep(){
    var P=S.project, prev=P.steps[P.steps.length-1];
    var st=emptyStep(P.steps.length+1);
    if(prev && prev.cables.length){ st.group=prev.group; st.cables[0].color=prev.cables[prev.cables.length-1].color; }
    P.steps.push(st); touch(); S.go(P.steps.length-1); setTool('draw');
  }
  function dupStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    var c=JSON.parse(JSON.stringify(st)); c.id=uid(); c.name=st.name+' (copie)';
    P.steps.splice(S.current+1,0,c); touch(); S.go(S.current+1);
  }
  function delStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    if(!confirm('Supprimer « '+(st.name||'cette étape')+' » ?')) return;
    P.steps.splice(S.current,1); touch(); S.go(Math.min(S.current,P.steps.length-1));
  }

  /* ------------------------------------------------ réordonnancement (DnD) */
  /* Renommage sur place dans la liste de gauche. */
  function renameStep(i){
    var el=q('#step-list .step[data-i="'+i+'"]'); if(!el) return;
    var t1=q('.t1',el), st=S.project.steps[i], old=st.name||'';
    var inp=document.createElement('input');
    inp.className='rename'; inp.value=old;
    t1.replaceWith(inp); inp.focus(); inp.select();
    var done=false;
    function finish(keep){
      if(done) return; done=true;
      if(keep){ st.name=inp.value.trim()||old; touch(); }
      renderSteps(S); renderRq(S);   /* le titre au-dessus du plan suit */
    }
    inp.addEventListener('keydown',function(e){
      e.stopPropagation();
      if(e.key==='Enter') finish(true);
      if(e.key==='Escape') finish(false);
    });
    inp.addEventListener('blur',function(){ finish(true); });
    inp.addEventListener('click',function(e){ e.stopPropagation(); });
  }
  function stepMenu(x,y,i){
    var P=S.project;
    menu(x,y,[
      { t:'Renommer', f:function(){ S.go(i); setTimeout(function(){ renameStep(i); },0); } },
      { t:'Dupliquer', f:function(){ S.go(i); dupStep(); } },
      null,
      { t:'Supprimer l\'étape', danger:true, f:function(){ S.go(i); delStep(); } }
    ]);
  }

  function bindDnd(){
    var dragI=-1;
    qa('#step-list .step').forEach(function(elm){
      var idx=parseInt(elm.dataset.i,10);
      elm.addEventListener('dblclick',function(e){ e.stopPropagation(); renameStep(idx); });
      elm.addEventListener('contextmenu',function(e){
        e.preventDefault(); e.stopPropagation(); stepMenu(e.clientX,e.clientY,idx);
      });
      elm.addEventListener('dragstart',function(e){
        dragI=parseInt(elm.dataset.i,10); elm.classList.add('dragging');
        e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(dragI)); }catch(x){}
      });
      elm.addEventListener('dragend',function(){
        elm.classList.remove('dragging');
        qa('#step-list .step').forEach(function(x){ x.classList.remove('drop-before','drop-after'); });
      });
      elm.addEventListener('dragover',function(e){
        e.preventDefault();
        var r=elm.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
        elm.classList.toggle('drop-after',after); elm.classList.toggle('drop-before',!after);
      });
      elm.addEventListener('dragleave',function(){ elm.classList.remove('drop-before','drop-after'); });
      elm.addEventListener('drop',function(e){
        e.preventDefault();
        var to=parseInt(elm.dataset.i,10);
        var r=elm.getBoundingClientRect(); if((e.clientY-r.top)>r.height/2) to++;
        if(dragI<0||dragI===to) return;
        var P=S.project, moved=P.steps[dragI];
        P.steps.splice(dragI,1);
        if(dragI<to) to--;
        P.steps.splice(to,0,moved); touch();
        S.go(P.steps.indexOf(moved));
      });
    });
  }

  /* ----------------------------------------------------- fiche éditable */
  window.editorFiche=function(S){
    var P=S.project, st=P.steps[S.current], host=q('#fiche');
    var cnt=q('#cab-count');
    if(!st){ host.innerHTML='<div class="empty">Aucune étape.</div>'; if(cnt) cnt.textContent=''; return; }
    if(!(S.cable>=0)) S.cable=0;
    S.cable=clamp(S.cable,0,Math.max(0,st.cables.length-1));
    var tracés=st.cables.filter(function(c){ return c.path.length>1; }).length;
    if(cnt) cnt.textContent=tracés+' / '+st.cables.length+' tracés';

    host.innerHTML='<div class="cabs">'+
      st.cables.map(function(c,i){
        return cableRow(c,i,{ sel:i===S.cable,
          right:'<span class="cab-n'+(c.path.length<2?' vide':'')+'">'+
                (c.path.length<2?'à tracer':c.path.length+' pts')+'</span>'+
                '<button class="cab-more" data-more="'+i+'" title="Autres actions">'+
                '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/>'+
                '<circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>' })
             + (i===S.cable && S.openCable ? cableForm(c,i) : '');
      }).join('')+
    '</div>';

    /* clic sur la ligne : ouvrir ses champs ; re-clic : refermer */
    qa('.cab',host).forEach(function(el){
      var i=parseInt(el.dataset.ci,10);
      el.addEventListener('click',function(){
        if(i===S.cable) S.openCable=!S.openCable;
        else { S.cable=i; S.openCable=true; }
        renderFiche(S); renderCanvas(S);
      });
    });
    qa('[data-more]',host).forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var i=parseInt(b.dataset.more,10), r=b.getBoundingClientRect();
        S.cable=i; renderFiche(S); renderCanvas(S);
        cableMenu(r.right-6, r.bottom+4, i);
      });
    });
    qa('.cab-edit',host).forEach(function(el){
      el.addEventListener('click',function(e){ e.stopPropagation(); });
    });
    bindCableForm(st);
  };

  function addCable(){
    var st=curStep(S); if(!st) return;
    var c=emptyCable(), prev=st.cables[st.cables.length-1];
    if(prev) c.color=prev.color;
    st.cables.push(c); S.cable=st.cables.length-1; S.openCable=true;
    touch(); renderFiche(S); renderSteps(S);
    var f=q('#f-num'); if(f) f.focus();
  }
  function delCable(i){
    var st=curStep(S); if(!st) return;
    if(st.cables.length<2){ toast('Une étape garde au moins un fil.',true); return; }
    if(!confirm('Supprimer ce fil ?')) return;
    st.cables.splice(i,1); S.cable=Math.max(0,i-1); S.openCable=false;
    touch(); S.render();
  }

  function autoGrow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }

  /* Bandeau du haut : la remarque libre et les points à vérifier. */
  window.editorRq=function(S){

  /* Colonne photo : import et retrait, dans son en-tête. */

  /* Les champs du fil, dépliés sous sa ligne. */
  function cableForm(c,i){
    var opts=WIRE_COLORS.map(function(o){
      return '<option value="'+o.id+'"'+(o.id===c.color?' selected':'')+'>'+o.name+'</option>';
    }).join('');
    return '<div class="cab-edit" data-form="'+i+'">'+
      '<div class="row">'+
        '<div class="field" style="flex:0 0 76px"><label>N° fil</label><input class="inp" id="f-num" value="'+esc(c.num)+'" placeholder="142"></div>'+
        '<div class="field"><label>Couleur</label><select class="inp" id="f-col">'+opts+'</select></div>'+
      '</div>'+
      '<div class="field"><label>Origine</label><input class="inp" id="f-from" value="'+esc(c.from)+'" placeholder="X1:3"></div>'+
      '<div class="field"><label>Extrémité</label><input class="inp" id="f-to" value="'+esc(c.to)+'" placeholder="Wago A:2"></div>'+
      '<div class="acts">'+
        '<button class="btn sm primary" id="f-draw">'+(c.path.length?'Retracer':'Tracer')+'</button>'+
        (c.path.length?'<button class="btn sm" id="f-adj">Ajuster</button>':'')+
        '<span class="sp"></span>'+
        '<button class="btn sm danger icon" id="f-del" title="Supprimer ce fil">'+
          '<svg '+ICO+'><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>'+
      '</div>'+
    '</div>';
  }
  function bindCableForm(st){
    var c=st.cables[S.cable]; if(!c) return;
    function bind(id,fn){
      var e=q(id); if(!e) return;
      e.addEventListener('input',function(){ fn(e.value); touch(); renderSteps(S); renderCanvas(S); });
    }
    bind('#f-num',function(v){ c.num=v; });
    bind('#f-from',function(v){ c.from=v; });
    bind('#f-to',function(v){ c.to=v; });
    var col=q('#f-col');
    if(col) col.addEventListener('change',function(){
      c.color=this.value; touch(); renderSteps(S); renderCanvas(S); renderFiche(S);
    });
    var d=q('#f-draw');
    if(d) d.addEventListener('click',function(){ c.path=[]; touch(); renderFiche(S); setTool('draw'); });
    var a=q('#f-adj');
    if(a) a.addEventListener('click',function(){ setTool('edit'); });
    var x=q('#f-del');
    if(x) x.addEventListener('click',function(){ delCable(S.cable); });
  }

  /* Menu contextuel d'un câble. */
  function cableMenu(x,y,i){
    var st=curStep(S); if(!st) return;
    var c=st.cables[i];
    menu(x,y,[
      { t:(c.path.length?'Retracer':'Tracer'), f:function(){
          c.path=[]; S.cable=i; touch(); renderFiche(S); setTool('draw'); } },
      { t:'Ajuster les points', f:function(){ S.cable=i; renderFiche(S); setTool('edit'); } },
      { t:'Dupliquer', f:function(){
          var d=JSON.parse(JSON.stringify(c)); d.id=uid(); d.path=[];
          st.cables.splice(i+1,0,d); S.cable=i+1; S.openCable=true;
          touch(); renderFiche(S); renderSteps(S); } },
      null,
      { t:'Supprimer le fil', danger:true, f:function(){ delCable(i); } }
    ]);
  }
  function menu(x,y,items){
    var old=q('.ctx'); if(old) old.remove();
    var m=document.createElement('div');
    m.className='ctx';
    m.innerHTML=items.map(function(it){
      return it ? '<button'+(it.danger?' class="danger"':'')+'>'+esc(it.t)+'</button>' : '<hr>';
    }).join('');
    document.body.appendChild(m);
    var r=m.getBoundingClientRect();
    m.style.left=Math.min(x,innerWidth-r.width-8)+'px';
    m.style.top=Math.min(y,innerHeight-r.height-8)+'px';
    var bs=qa('button',m), k=0;
    items.forEach(function(it){ if(it){ bs[k++].addEventListener('click',function(){ m.remove(); it.f(); }); } });
    /* Le mousedown sur une entrée précède son click : ignorer ceux qui
       viennent du menu, sinon il disparaît avant d'avoir agi. */
    setTimeout(function(){
      window.addEventListener('mousedown',function h(e){
        if(m.contains(e.target)) return;
        m.remove(); window.removeEventListener('mousedown',h);
      });
    },0);
  }

  function groupOpts(){
    var seen={}, o='';
    S.project.steps.forEach(function(s){ if(s.group && !seen[s.group]){ seen[s.group]=1; o+='<option value="'+esc(s.group)+'">'; } });
    return o;
  }

  /* ------------------------------------------------------- calque d'édition */
  /* Le calque d'édition n'est pas du dessin : ses poignées gardent une taille
     constante à l'écran, sinon elles deviennent énormes dès qu'on zoome. */
  function screenUnit(S){
    var svg=q('#svg'); if(!svg||!S.view) return 1;
    var cw=svg.clientWidth||1000, ch=svg.clientHeight||700;
    return 1/Math.min(cw/S.view.w, ch/S.view.h);
  }
  function overlay(S){
    if(S.tool==='bg') return bgOverlay(S);
    if(S.tool!=='draw' && S.tool!=='edit') return '';   /* en Vue : le fil seul */
    var c=curCable(S); if(!c) return '';
    var k=screenUnit(S), r=6*k;          /* ≈ 6 px à l'écran, quel que soit le zoom */
    var col=colorOf(c.color), s='';

    /* aperçu du prochain segment */
    if(S.tool==='draw' && c.path.length && S.mouse){
      var a=c.path[c.path.length-1], b={x:S.mouse.x,y:S.mouse.y,elbow:S.elbow};
      s+='<path d="'+pathD([a,b])+'" fill="none" stroke="'+col.hex+'" stroke-opacity=".55" stroke-width="'+wireWidth(S.project)+'" stroke-dasharray="'+(9*k)+' '+(7*k)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="'+(r*.9)+'" fill="none" stroke="'+ink(S.project).lblTx+'" stroke-opacity=".8" stroke-width="'+(1.5*k)+'"/>';
    }
    if(S.tool==='edit'||S.tool==='draw'){
      c.path.forEach(function(p,i){
        var sel = i===S.sel;
        s+='<circle class="handle" data-pi="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" '+
           'fill="'+(sel?'#1a63d6':ink(S.project).lblBg)+'" stroke="'+ink(S.project).lblTx+'" stroke-width="'+(1.5*k)+'" style="cursor:move"/>';
      });
      for(var i=1;i<c.path.length;i++){
        var A=c.path[i-1], B=c.path[i];
        if(A.x!==B.x && A.y!==B.y){
          var e=(B.elbow||'h')==='h'?{x:B.x,y:A.y}:{x:A.x,y:B.y};
          s+='<rect class="elbow" data-ei="'+i+'" x="'+(e.x-r*.72)+'" y="'+(e.y-r*.72)+'" width="'+(r*1.44)+'" height="'+(r*1.44)+'" rx="'+(r*.3)+'" fill="'+ink(S.project).markBg+'" stroke="#1a63d6" stroke-width="'+(1.4*k)+'" style="cursor:pointer"/>';
        }
      }
    }
    return s;
  }

  /* Cadres de manipulation des fonds : contour, poignées d'angle. */
  function bgOverlay(S){
    var P=S.project, st=curStep(S); if(!st) return '';
    var k=screenUnit(S), r=6*k, s='';
    stepBgs(P,st).forEach(function(b,i){
      var on=i===S.bg;
      s+='<rect class="bgbox" data-bgi="'+i+'" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" '+
         'fill="transparent" stroke="'+(on?'#1a63d6':'#8aa4c8')+'" stroke-width="'+((on?2:1.2)*k)+'" '+
         'stroke-dasharray="'+(on?'':(6*k)+' '+(5*k))+'" style="cursor:move"/>';
      if(on){
        [['nw',b.x,b.y],['ne',b.x+b.w,b.y],['sw',b.x,b.y+b.h],['se',b.x+b.w,b.y+b.h]].forEach(function(h){
          s+='<rect class="bgh" data-bgh="'+h[0]+'" data-bgi="'+i+'" x="'+(h[1]-r)+'" y="'+(h[2]-r)+'" '+
             'width="'+(r*2)+'" height="'+(r*2)+'" rx="'+(r*.35)+'" fill="#1a63d6" stroke="#fff" '+
             'stroke-width="'+(1.6*k)+'" style="cursor:'+((h[0]==='nw'||h[0]==='se')?'nwse-resize':'nesw-resize')+'"/>';
        });
      }
    });
    return s;
  }

  /* ------------------------------------------------------ interactions SVG */
  function bindStage(){
    var svg=q('#svg');
    var drag=null;

    function snap(p){
      var P=S.project, bd=curBounds(S), m=Math.max(bd.w,bd.h)*.05;
      p.x=clamp(p.x,bd.x-m,bd.x+bd.w+m); p.y=clamp(p.y,bd.y-m,bd.y+bd.h+m);
      if(S.magnet){
        var best=null,bd=14*(S.view.w/(svg.clientWidth||1000));
        var sig=bgKeyOf(P,curStep(S));
        P.steps.forEach(function(st){
          if(bgKeyOf(P,st)!==sig) return;
          st.cables.forEach(function(c){
            c.path.forEach(function(q2){
              var d=Math.hypot(q2.x-p.x,q2.y-p.y);
              if(d<bd){ bd=d; best={x:q2.x,y:q2.y}; }
            });
          });
        });
        if(best) return best;
      }
      if(S.snap>0){
        var g=Math.max(2,Math.round(docUnit(curBounds(S))/2));
        p.x=Math.round(p.x/g)*g; p.y=Math.round(p.y/g)*g;
      }
      return p;
    }

    svg.addEventListener('mousemove',function(e){
      S.mouse=snap(S.toImg(e));
      if(bgdrag){
        var pm=S.toImg(e), dx=pm.x-bgdrag.ox, dy=pm.y-bgdrag.oy, b=bgdrag.b;
        if(bgdrag.mode==='move'){ b.x=bgdrag.x+dx; b.y=bgdrag.y+dy; }
        else{
          /* redimensionnement à proportions conservées, l'angle opposé fixe */
          var c0=bgdrag.corner;
          var ax=(c0==='ne'||c0==='se')?1:-1, ay=(c0==='sw'||c0==='se')?1:-1;
          var nw=Math.max(20, bgdrag.w+dx*ax), nh=Math.max(20, bgdrag.h+dy*ay);
          var k=Math.max(nw/bgdrag.w, nh/bgdrag.h);
          b.w=Math.max(20,bgdrag.w*k); b.h=Math.max(20,bgdrag.h*k);
          b.x=(ax>0)?bgdrag.x:bgdrag.x+bgdrag.w-b.w;
          b.y=(ay>0)?bgdrag.y:bgdrag.y+bgdrag.h-b.h;
        }
        setBackgrounds(S,stepBgs(S.project,curStep(S)));
        S.frameKey=null; renderCanvas(S);
        return;
      }
      if(drag){
        var c=curCable(S);
        if(c){ c.path[drag.i].x=S.mouse.x; c.path[drag.i].y=S.mouse.y; renderCanvas(S); }
        return;
      }
      if(S.tool==='draw') renderOverlay(S);
    });
    svg.addEventListener('mouseleave',function(){ S.mouse=null; if(S.tool==='draw') renderOverlay(S); });

    var bgdrag=null;
    svg.addEventListener('mousedown',function(e){
      if(e.button!==0 || e.shiftKey || S.spaceDown || S.tool==='pan') return;
      var t=e.target;
      if(S.tool==='bg'){
        var st=curStep(S); if(!st) return;
        var p0=S.toImg(e);
        if(t.classList && t.classList.contains('bgh')){
          e.preventDefault();
          var bi=parseInt(t.dataset.bgi,10), b=stepBgs(S.project,st)[bi];
          bgdrag={ mode:'size', b:b, corner:t.dataset.bgh, ox:p0.x, oy:p0.y,
                   x:b.x, y:b.y, w:b.w, h:b.h, ratio:b.w/b.h };
          return;
        }
        if(t.classList && t.classList.contains('bgbox')){
          e.preventDefault();
          var j=parseInt(t.dataset.bgi,10);
          S.bg=j; stepProps(); renderOverlay(S);
          var bb=stepBgs(S.project,st)[j];
          bgdrag={ mode:'move', b:bb, ox:p0.x, oy:p0.y, x:bb.x, y:bb.y };
          return;
        }
        S.bg=-1; stepProps(); renderOverlay(S); return;
      }
      if(t.classList && t.classList.contains('handle')){
        e.preventDefault();
        S.sel=parseInt(t.dataset.pi,10); drag={i:S.sel}; renderCanvas(S); return;
      }
      if(t.classList && t.classList.contains('elbow')) return;   /* géré au dblclick */
      var c=curCable(S);
      var p=snap(S.toImg(e));
      if(S.tool==='draw'){
        if(!c){ toast('Créez d\'abord une étape.',true); return; }
        c.path.push({x:p.x,y:p.y,elbow:S.elbow});
        renderCanvas(S); renderFiche(S); touch();
      }else if(S.tool==='mark'){
        var txt=prompt('Texte du repère (ex. X1, Wago A, Flexisoft M1) :','');
        if(txt){
          var im=curMainBg(S);
          S.project.marks.push({id:uid(),img:im?im.id:'',x:p.x,y:p.y,text:txt});
          renderCanvas(S); touch();
        }
      }else if(S.tool==='edit'){
        S.sel=-1; renderOverlay(S);
      }
    });
    window.addEventListener('mouseup',function(){
      if(drag){ drag=null; renderFiche(S); touch(); }
      if(bgdrag){ bgdrag=null; touch(); stepProps(); S.viewSig=null; }
    });

    svg.addEventListener('dblclick',function(e){
      var t=e.target, c=curCable(S); if(!c) return;
      if(t.classList && t.classList.contains('elbow')){
        var i=parseInt(t.dataset.ei,10);
        c.path[i].elbow = (c.path[i].elbow||'h')==='h' ? 'v':'h';
        renderCanvas(S); touch();
      }
    });
    svg.addEventListener('contextmenu',function(e){
      var t=e.target, c=curCable(S);
      if(t.classList && t.classList.contains('handle') && c){
        e.preventDefault();
        c.path.splice(parseInt(t.dataset.pi,10),1);
        S.sel=-1; renderCanvas(S); renderFiche(S); touch(); return;
      }
      if(t.getAttribute && t.parentNode && t.parentNode.dataset && t.parentNode.dataset.mark){
        e.preventDefault();
        var id=t.parentNode.dataset.mark;
        if(confirm('Supprimer ce repère ?')){
          S.project.marks=S.project.marks.filter(function(m){ return m.id!==id; });
          renderCanvas(S); touch();
        }
      }
    });

    window.addEventListener('keydown',function(e){
      var tag=e.target.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      var c=curCable(S);
      if(e.key==='Tab'){ e.preventDefault(); S.elbow=S.elbow==='h'?'v':'h'; syncSeg(); renderOverlay(S); }
      /* Échap termine le tracé : on repasse en Vue, où le fil s'affiche seul.
         La suppression, elle, se fait depuis le panneau des câbles. */
      if(e.key==='Escape'){ S.sel=-1; setTool('view'); }
      if(e.key==='Backspace' && S.tool==='draw' && c && c.path.length){
        e.preventDefault(); c.path.pop(); renderCanvas(S); renderFiche(S); touch();
      }
      if(e.key==='Delete' && S.sel>=0 && c){
        c.path.splice(S.sel,1); S.sel=-1; renderCanvas(S); renderFiche(S); touch();
      }
      if(e.key==='d'||e.key==='D'){ setTool('draw'); }
      if(e.key==='v'||e.key==='V'){ setTool('edit'); }
      if(e.key==='n'||e.key==='N'){ addStep(); }
    });
  }

  /* ------------------------------------------------------------- schéma */
  /* Un plan importé rejoint la bibliothèque sans rien demander. S'il est
     demandé depuis une étape, il lui est en plus affecté ; au tout premier
     import, les étapes encore sans plan l'adoptent. */
  function onImage(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    var assign = e.target.dataset.assign==='1', back = e.target.dataset.back==='1',
        photo = e.target.dataset.photo==='1';
    e.target.dataset.assign=''; e.target.dataset.back=''; e.target.dataset.photo=''; e.target.value='';
    if(!files.length) return;
    var busy=working('Chargement '+(files.length>1?'de '+files.length+' plans':'du plan')+'…');
    var added=[];
    (function next(){
      var f=files.shift();
      if(!f) return done();
      readImage(f,function(im){
        if(!im) return next();
        var P=S.project, first=!P.images.length;
        P.images.push(im); added.push(im);
        /* L'épaisseur est exprimée en unités du schéma : sur un plan en 8K,
           la valeur par défaut serait un cheveu. On la cale sur la taille du
           premier plan, tant que l'utilisateur n'y a pas touché. */
        if(first && P.settings.thickAuto) P.settings.thickness=Math.max(3,Math.round(im.w/200));
        var st0=P.steps[S.current];
        if(photo && st0){ st0.photos=st0.photos||[]; st0.photos.push(im.id); }
        else if(assign && st0) addBg(st0,im);
        else if(first) P.steps.forEach(function(st){ if(!(st.bgs||[]).length) addBg(st,im); });
        next();
      });
    })();
    function done(){
      busy();
      if(!added.length) return;
      touch(); S.render();
      var m=q('.mask'); if(m){ m.remove(); if(back) dlgDoc(); }
      var last=added[added.length-1];
      toast(added.length===1
        ? 'Plan « '+last.name+' » ajouté ('+last.w+' × '+last.h+' px)'
        : added.length+' plans ajoutés');
    }
  }
  /* Le fichier est repris tel quel : un plan en 8K est chargé sans être
     réduit ni ré-encodé, sa définition étant précisément ce qui permet de
     zoomer sur un bornier. */
  function readImage(f,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        cb({ id:uid(), name:cleanName(f.name), data:rd.result,
             w:img.naturalWidth, h:img.naturalHeight });
      };
      img.onerror=function(){ toast('« '+f.name+' » : image illisible.',true); cb(null); };
      img.src=rd.result;
    };
    rd.onerror=function(){ cb(null); };
    rd.readAsDataURL(f);
  }
  function koMo(n){
    n=n*0.75;   /* le base64 pèse un tiers de plus que les octets */
    return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' Mo'
                     : Math.round(n/1024)+' Ko';
  }
  function cleanName(n){
    return String(n||'Plan').replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').slice(0,40) || 'Plan';
  }
  function pickImage(opt){
    var i=q('#f-img');
    i.dataset.assign = (opt&&opt.assign)?'1':'';
    i.dataset.back   = (opt&&opt.back)?'1':'';
    i.dataset.photo  = (opt&&opt.photo)?'1':'';
    i.click();
  }
  /* Un nouveau fond se pose à droite des précédents, à sa taille naturelle. */
  function addBg(st,im){
    st.bgs=st.bgs||[];
    var x=0;
    st.bgs.forEach(function(b){ x=Math.max(x,b.x+b.w); });
    st.bgs.push({ id:uid(), img:im.id, x:x?x+im.w*.03:0, y:0, w:im.w, h:im.h });
  }
  function imageUsage(P,id){
    var n=0;
    P.steps.forEach(function(st){
      if((st.bgs||[]).some(function(b){ return b.img===id; })) n++;
      if((st.photos||[]).indexOf(id)>=0) n++;
    });
    return n;
  }

  /* ------------------------------------------------------------ cartouche */
  function dlgDoc(){
    var P=S.project;
    var list = (P.images||[]).map(function(im){
      var used=imageUsage(P,im.id);
      return '<div class="imgrow" data-img="'+im.id+'">'+
        '<img src="'+im.data+'" alt="">'+
        '<div class="txt"><input class="inp nm" value="'+esc(im.name)+'" data-nm="'+im.id+'">'+
          '<div class="mt">'+im.w+' × '+im.h+' px · '+(used?used+' étape'+(used>1?'s':''):'inutilisé')+'</div></div>'+
        '<button class="btn icon sm danger" data-del="'+im.id+'" title="Retirer ce plan">'+
          '<svg '+ICO+'><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>';
    }).join('') || '<div class="empty" style="padding:14px">Aucun plan pour l\'instant.</div>';
    modal('Plans et réglages',
      '<div class="field"><label>Plans du projet</label>'+
        '<div class="imglist">'+list+'</div>'+
        '<button class="btn" id="d-img" style="margin-top:8px">+ Ajouter un plan</button></div>'+
      '<div class="field" style="margin-top:14px"><label>Épaisseur du tracé</label>'+
        '<input class="inp" id="i-th" type="number" min="1" max="400" value="'+(P.settings.thickness||6)+'"></div>'+
      '<label class="check'+(P.settings.labels?' on':'')+'" style="margin-top:0"><input type="checkbox" id="i-lab"'+(P.settings.labels?' checked':'')+'> <span>Afficher le n° de fil sur le tracé</span></label>',
      function(){
        P.settings.thickness=clamp(parseInt(q('#i-th').value,10)||6,1,400);
        P.settings.thickAuto=false;
        P.settings.labels=q('#i-lab').checked;
        touch(); S.render();
      },
      function(m){
        q('#d-img',m).addEventListener('click',function(){ pickImage({back:true}); });
        qa('[data-nm]',m).forEach(function(inp){
          inp.addEventListener('input',function(){
            var im=imageById(P,inp.dataset.nm); if(im){ im.name=inp.value; touch(); }
          });
        });
        qa('[data-del]',m).forEach(function(b){
          b.addEventListener('click',function(){
            var id=b.dataset.del, used=imageUsage(P,id), im=imageById(P,id);
            if(!confirm('Retirer le plan « '+(im?im.name:'')+' » ?'+
               (used?'\n\n'+used+' étape(s) l\'utilisent : leur tracé sera perdu.':''))) return;
            P.images=P.images.filter(function(x){ return x.id!==id; });
            P.marks=P.marks.filter(function(x){ return x.img!==id; });
            P.steps.forEach(function(st){
              var n=(st.bgs||[]).length;
              st.bgs=(st.bgs||[]).filter(function(b){ return b.img!==id; });
              if(st.bgs.length!==n) st.cables.forEach(function(c){ c.path=[]; });
              st.photos=(st.photos||[]).filter(function(x){ return x!==id; });
            });
            touch(); S.viewImg=null; S.bgKey=null; S.render(); m.remove(); dlgDoc();
          });
        });
      });
  }
  function modal(title,body,ok,onOpen){
    var m=document.createElement('div');
    m.className='mask';
    m.innerHTML='<div class="modal"><header>'+esc(title)+'</header><div class="mbody">'+body+'</div>'+
      '<footer><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Valider</button></footer></div>';
    document.body.appendChild(m);
    function close(){ m.remove(); }
    m.addEventListener('click',function(e){ if(e.target===m) close(); });
    q('[data-x]',m).addEventListener('click',close);
    q('[data-ok]',m).addEventListener('click',function(){
      if(ok && ok()===false) return;   /* refus : on garde la saisie à l'écran */
      close();
    });
    if(onOpen) onOpen(m);
  }

  /* ------------------------------------------------------ fichiers projet */
  function download(name,content,mime){
    var b=new Blob([content],{type:mime||'application/octet-stream'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },500);
  }
  function slug(s){
    return String(s||'cheminement').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'cheminement';
  }
  function saveJson(){
    download(slug(S.project.ref||S.project.title)+'.json', JSON.stringify(S.project,null,1),'application/json');
    clean();
    toast('Projet enregistré (.json)');
  }
  function onOpen(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(o.kind!=='cheminement-cables') throw new Error('format');
        S.project=migrate(o); S.current=0; S.done={}; S.viewImg=null; fitView(S); S.render(); clean();
        toast('Projet chargé : '+(o.title||''));
      }catch(x){ toast('Fichier projet invalide.',true); }
    };
    rd.readAsText(f); e.target.value='';
  }

  /* ---------------------------------------------------- export opérateur */
  /* L'export est la remise d'un document daté et identifié : on renseigne
     son cartouche avant de le produire. */
  function dlgExport(){
    var P=S.project;
    if(!P.steps.length){ toast('Aucune étape à exporter.',true); return; }
    var r=P.release||(P.release={trigram:'',hard:'',date:''});
    modal('Exporter pour l\'opérateur',
      '<div class="field"><label>Titre du document</label><input class="inp" id="x-title" value="'+esc(P.title)+'"></div>'+
      '<div class="field"><label>Référence / affaire</label><input class="inp" id="x-ref" value="'+esc(P.ref)+'" placeholder="facultatif"></div>'+
      '<div class="row">'+
        '<div class="field"><label>Trigramme</label><input class="inp" id="x-trg" value="'+esc(r.trigram)+'" maxlength="8" placeholder="ABC"></div>'+
        '<div class="field"><label>Version Hard</label><input class="inp" id="x-hard" value="'+esc(r.hard)+'" placeholder="B2"></div>'+
      '</div>'+
      '<div class="field"><label>Date</label><input class="inp" id="x-date" value="'+esc(r.date||today())+'" placeholder="JJ/MM/AAAA"></div>'+
      '<div class="note" style="margin-top:4px"><div class="k">Cartouche</div>'+
        'Ces informations sont celles que l\'opérateur verra en tête du document, à l\'écran comme à l\'impression.'+
        '<br><br>Poids estimé du fichier : <b>'+koMo(weightEstimate(P))+'</b>.</div>',
      function(){
        P.title=q('#x-title').value.trim()||'Cheminement de câbles';
        P.ref=q('#x-ref').value.trim();
        r.trigram=q('#x-trg').value.trim();
        r.hard=q('#x-hard').value.trim();
        r.date=q('#x-date').value.trim()||today();
        if(!r.trigram || !r.hard){ toast('Trigramme et version Hard sont nécessaires.',true); return false; }
        touch(); renderNav(S); exportViewer();
      });
  }
  /* Les plans sont embarqués en base64 : leur poids fait celui du document. */
  function weightEstimate(P){
    var n=60*1024;
    (P.images||[]).forEach(function(im){ n+=im.data.length; });
    return n;
  }
  function today(){
    var d=new Date(), p2=function(n){ return (n<10?'0':'')+n; };
    return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
  }
  function exportViewer(){
    var P=S.project;
    if(!P.steps.length){ toast('Aucune étape à exporter.',true); return; }
    var css=document.getElementById('app-css').textContent;
    var js=document.getElementById('viewer-js').textContent;
    var data=JSON.stringify(P).replace(/<\//g,'<\\/').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    var head=esc(P.title||'Cheminement de câbles')+(P.ref?' — '+esc(P.ref):'');
    var html='<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+head+'</title>\n'+
      '<!-- Document autonome : aucune connexion réseau requise. -->\n'+
      '<style>\n'+css+'\n</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script>\n'+js+'\n<\/script>\n'+
      '<script>bootViewer('+data+');<\/script>\n</body>\n</html>\n';
    var r=P.release||{};
    var nom=slug(P.ref||P.title)+'-operateur'+(r.hard?'-'+slug(r.hard):'')+(r.trigram?'-'+slug(r.trigram):'');
    download(nom+'.html', html, 'text/html;charset=utf-8');
    toast('Document opérateur exporté ('+koMo(html.length)+')');
  }

  /* démarrage */
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
