<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheminement de câbles — Éditeur & Doc opérateur</title>
<!--
  ============================================================================
  CHEMINEMENT DE CABLES
  Application 100% locale, un seul fichier, aucune dépendance réseau.
  Fonctionne en double-cliquant le fichier (protocole file://).
  ============================================================================
-->
<style id="app-css">
/* ------------------------------------------------------------------ base */
:root{
  /* thème clair (par défaut) */
  --bg:#e9eff8;
  --bg-2:#ffffff;
  --bg-3:#f3f7fd;
  --line:#d8e2f0;
  --line-2:#bacbe4;
  --tx:#10203a;
  --tx-2:#4b6183;
  --tx-3:#7e91ae;
  --acc:#1a63d6;
  --acc-2:#1450b4;
  --ok:#12915a;
  --warn:#b5751a;
  --danger:#cc3444;
  --hov:#e7effc;
  --head:#f0f5fc;
  --top-grad:#f4f8fe;
  --stage-top:#dfe8f6;
  --pop:rgba(255,255,255,.96);
  --mask:rgba(20,35,60,.42);
  --sw-bd:rgba(0,0,0,.18);
  --note-bg:#fdf5e6;
  --note-bd:#e8c489;
  --note-tx:#7a5312;
  --done-bg:#e4f6ec;
  --done-bd:#9dd7b8;
  --done-tx:#0e7a4b;
  --dgr-bg:#fdecee;
  --dgr-bd:#e9a8b0;
  --dgr-tx:#a52233;
  --r:10px;
  --sh:0 6px 20px rgba(20,40,80,.12);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.theme-dark{
  --bg:#081020;
  --bg-2:#0d1a33;
  --bg-3:#142748;
  --line:#1d3159;
  --line-2:#2b4a80;
  --tx:#e9effc;
  --tx-2:#9db4dd;
  --tx-3:#6a85b6;
  --acc:#3d8bfd;
  --acc-2:#1a5fd0;
  --ok:#35c47b;
  --warn:#f0a742;
  --danger:#ef5f6b;
  --hov:#132444;
  --head:#0b1832;
  --top-grad:#0a1428;
  --stage-top:#0f1d38;
  --pop:rgba(13,26,51,.95);
  --mask:rgba(4,9,20,.74);
  --sw-bd:rgba(255,255,255,.3);
  --note-bg:rgba(240,167,66,.1);
  --note-bd:rgba(240,167,66,.34);
  --note-tx:#f7d9a8;
  --done-bg:#123a2e;
  --done-bd:#1f6b52;
  --done-tx:#7fe0aa;
  --dgr-bg:#3a1f2c;
  --dgr-bd:#7a3a52;
  --dgr-tx:#ffc9cf;
  --sh:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- layout */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 14px;height:52px;flex:0 0 52px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-2) 60%,var(--top-grad));
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(135deg,var(--acc),#7b5cff);
  display:grid;place-items:center;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 40%,transparent)
}
.logo svg{width:16px;height:16px}
.brand-txt{min-width:0}
.brand-title{font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}

.body{display:flex;flex:1;min-height:0}
.left{
  width:288px;flex:0 0 288px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.right{
  width:330px;flex:0 0 330px;background:var(--bg-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:
  radial-gradient(1200px 600px at 50% -10%,var(--stage-top),var(--bg))}
.panel-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;flex:0 0 auto;
  font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--tx-3);
  border-bottom:1px solid var(--line);font-weight:650
}
.panel-head .count{margin-left:auto;color:var(--tx-3);font-size:11px;letter-spacing:0}
.scroll{overflow:auto;flex:1;min-height:0}

/* ---------------------------------------------------------------- boutons */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx);cursor:pointer;
  white-space:nowrap;transition:background .12s,border-color .12s,transform .06s
}
.btn:hover{background:var(--hov);border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc-2));border-color:#1a5fd0;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--tx)}
.btn.danger:hover{background:var(--dgr-bg);border-color:var(--dgr-bd);color:var(--dgr-tx)}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px;border-radius:7px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.icon.sm{width:26px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 15px}
.seg{display:inline-flex;background:var(--bg-3);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{
  height:30px;padding:0 10px;background:transparent;border:0;color:var(--tx-2);cursor:pointer;
  border-right:1px solid var(--line-2);font-size:12.5px
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc-2);color:#fff;font-weight:600}
.seg button:hover:not(.on){background:var(--hov);color:var(--tx)}

/* --------------------------------------------------------------- étapes */
.grp{border-bottom:1px solid var(--line)}
.grp-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  background:var(--head);color:var(--tx-2);font-size:11.5px;font-weight:650;letter-spacing:.5px;
  position:sticky;top:0;z-index:2
}
.grp-head:hover{color:var(--tx)}
.grp-head .chev{transition:transform .15s;flex:0 0 auto;opacity:.7}
.grp.collapsed .chev{transform:rotate(-90deg)}
.grp.collapsed .grp-body{display:none}
.grp-head .n{margin-left:auto;font-weight:500;color:var(--tx-3)}

.step{
  display:flex;align-items:center;gap:9px;padding:8px 12px 8px 10px;cursor:pointer;
  border-left:3px solid transparent;position:relative
}
.step:hover{background:var(--hov)}
.step.on{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 13%,transparent),transparent);border-left-color:var(--acc)}
.step.done .idx{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.step .idx{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  background:var(--bg-3);border:1px solid var(--line-2);font-size:11.5px;font-family:var(--mono);color:var(--tx-2)
}
.step.on .idx{background:var(--acc-2);border-color:var(--acc);color:#fff;font-weight:600}
.step .txt{min-width:0;flex:1}
.step .t1{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .t2{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.step.on .t2{color:var(--tx-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;border:1px solid var(--sw-bd);box-shadow:0 0 0 2px rgba(0,0,0,.25) inset}
.step .grab{opacity:0;color:var(--tx-3);cursor:grab;flex:0 0 auto}
.step:hover .grab{opacity:.8}
.step.dragging{opacity:.45}
.step.drop-before{box-shadow:inset 0 2px 0 var(--acc)}
.step.drop-after{box-shadow:inset 0 -2px 0 var(--acc)}
.empty{padding:22px 16px;color:var(--tx-3);text-align:center;font-size:12.5px;line-height:1.6}

/* ---------------------------------------------------------------- stage */
.stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;background:transparent}
#svg.pan{cursor:grab}
#svg.panning{cursor:grabbing}
#svg.draw{cursor:crosshair}
.stage-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-top:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap
}
.stage-bar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx-3);font-weight:650}
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
  background:var(--pop);border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;backdrop-filter:blur(3px);
  font-size:12.5px;color:var(--tx-2);box-shadow:var(--sh);pointer-events:none;max-width:90%;text-align:center
}
.hint b{color:var(--tx)}
.hint kbd{
  font-family:var(--mono);font-size:11px;background:var(--bg-3);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--tx);margin:0 1px
}
.stepper{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--pop);border:1px solid var(--line-2);border-radius:11px;padding:6px 8px;box-shadow:var(--sh);backdrop-filter:blur(3px)
}
.stepper .pos{font-family:var(--mono);font-size:12.5px;color:var(--tx-2);min-width:74px;text-align:center}
.stepper .pos b{color:var(--tx);font-size:14px}

/* --------------------------------------------------------------- fiche */
.fiche{padding:14px}
.fiche h2{margin:0 0 3px;font-size:17px;font-weight:650;letter-spacing:.2px}
.fiche .sub{color:var(--tx-3);font-size:12px;margin-bottom:14px;font-family:var(--mono)}
.wire-head{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);margin-bottom:12px
}
.wire-swatch{
  width:42px;height:42px;border-radius:11px;flex:0 0 42px;border:1px solid var(--sw-bd);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)
}
.wire-head .wn{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.5px}
.wire-head .wc{font-size:12px;color:var(--tx-2)}
.route{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.node{
  display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:var(--bg-3);
  border:1px solid var(--line);border-radius:var(--r)
}
.node .pin{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#04101f
}
.node.from .pin{background:var(--ok)}
.node.to .pin{background:var(--acc)}
.node .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.node .v{font-size:19px;font-weight:650;font-family:var(--mono);word-break:break-word;letter-spacing:.4px}
.route .arrow{height:14px;margin-left:25px;border-left:2px dashed var(--line-2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cell{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.cell .v{font-size:15px;font-weight:600;font-family:var(--mono)}
.cell .v small{font-size:11px;color:var(--tx-3);font-weight:400;font-family:var(--sans)}
.note{
  background:var(--note-bg);border:1px solid var(--note-bd);border-left-width:3px;
  border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--note-tx);white-space:pre-wrap
}
.note .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--warn);font-weight:650;margin-bottom:2px}
.check{
  display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);cursor:pointer;user-select:none
}
.check:hover{border-color:var(--line-2)}
.check input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.check.on{background:var(--done-bg);border-color:var(--done-bd)}

/* ------------------------------------------------------------ accordéon */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-3);margin-bottom:9px;overflow:hidden}
.acc>summary{
  list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx-2);font-weight:650;user-select:none
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{color:var(--tx)}
.acc>summary::after{
  content:'';width:7px;height:7px;flex:0 0 7px;margin-left:auto;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .16s
}
.acc[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.acc>summary .peek{
  margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--tx-3);
  text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.acc>summary .peek~::after{margin-left:8px}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc[open]>summary .peek{display:none}
.accb{padding:12px}
.accb .kv,.accb .field:last-child{margin-bottom:0}

/* --------------------------------------------------------------- formes */
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650;margin-bottom:4px}
.inp{
  width:100%;height:32px;padding:0 9px;background:var(--bg);border:1px solid var(--line-2);
  border-radius:8px;outline:none;transition:border-color .12s,box-shadow .12s
}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;min-height:60px;font-family:inherit}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.inp{cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.sw-row{display:flex;align-items:center;gap:8px}
.sw-prev{width:32px;height:32px;border-radius:8px;flex:0 0 32px;border:1px solid var(--line-2)}

/* --------------------------------------------------------------- modale */
.mask{position:fixed;inset:0;background:var(--mask);z-index:60;display:grid;place-items:center;padding:20px}
.modal{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh);
  width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column
}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center;gap:8px}
.modal .mbody{padding:16px;overflow:auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{
  position:fixed;top:64px;right:14px;z-index:80;
  background:var(--bg-3);border:1px solid var(--line-2);border-left:3px solid var(--ok);
  padding:10px 16px;border-radius:10px;box-shadow:var(--sh);font-size:13px;
  animation:pop .18s ease-out
}
.toast.err{border-left-color:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tag{
  display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-2)
}
.tag.ok{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}

/* -------------------------------------------------------------- viewer */
body.viewer .editor-only{display:none !important}
body.viewer .left{width:300px;flex-basis:300px}

/* ------------------------------------------------------------ impression */
@media print{
  body{overflow:visible;background:#fff;color:#000}
  .topbar,.stage-bar,.left,.hint,.stepper,.editor-only{display:none !important}
  .app,.body{display:block;height:auto}
  .right{width:auto;border:0;background:#fff}
  .cell,.node,.wire-head{background:#fff;border-color:#bbb}
  .stage-wrap{height:60vh;page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="root"></div>

<!-- =====================================================================
     MOTEUR + VUE OPERATEUR
     Ce bloc est relu tel quel au moment de l'export : il constitue à lui
     seul le fichier autonome remis à l'opérateur. Ne pas y mettre de code
     d'édition.
     ================================================================== -->
<script id="viewer-js">
/* ----------------------------------------------------------- constantes */
var WIRE_COLORS = [
  {id:'noir',    name:'Noir',       hex:'#20262e'},
  {id:'marron',  name:'Marron',     hex:'#7b4b26'},
  {id:'rouge',   name:'Rouge',      hex:'#e03040'},
  {id:'orange',  name:'Orange',     hex:'#f2811d'},
  {id:'jaune',   name:'Jaune',      hex:'#f2c832'},
  {id:'vert',    name:'Vert',       hex:'#31b45e'},
  {id:'bleu',    name:'Bleu',       hex:'#2f86e8'},
  {id:'violet',  name:'Violet',     hex:'#9163d8'},
  {id:'gris',    name:'Gris',       hex:'#9aa4b2'},
  {id:'blanc',   name:'Blanc',      hex:'#eef2f7'},
  {id:'rose',    name:'Rose',       hex:'#ee7fb0'},
  {id:'turq',    name:'Turquoise',  hex:'#2ec7c0'},
  {id:'vj',      name:'Vert/Jaune', hex:'#31b45e', hex2:'#f2c832'},
  {id:'bb',      name:'Bleu clair', hex:'#79c0ff'}
];
function colorOf(id){
  for(var i=0;i<WIRE_COLORS.length;i++){ if(WIRE_COLORS[i].id===id) return WIRE_COLORS[i]; }
  return WIRE_COLORS[0];
}
var DEF_W = 1600, DEF_H = 1000;

/* Section en mm², virgule ou point acceptés. */
function parseSection(v){
  var n=parseFloat(String(v==null?'':v).replace(',','.'));
  return (isFinite(n)&&n>0)?n:0;
}
/* Épaisseur du tracé : le diamètre d'un conducteur varie comme la racine
   carrée de sa section, l'épaisseur de référence valant pour 1,5 mm². */
function wireWidth(P,st){
  var base=P.settings.thickness||6;
  var sec=parseSection(st && st.wire ? st.wire.section : 0);
  return sec>0 ? base*Math.sqrt(sec/1.5) : base;
}
/* Unité de dessin liée au schéma, jamais au zoom : repères et étiquettes
   conservent donc leur taille par rapport au plan quand on zoome. */
function docUnit(P){ return Math.max(10,(P.imgW||DEF_W)/100); }
/* Couleurs du dessin selon le thème. */
function ink(P){
  return (P.settings.theme==='sombre')
   ? {grid:'#1b2f57',frame:'#1d3159',vd:'#0a1730',vdTx:'#3d5480',
      lblBg:'#081020',lblTx:'#e9effc',halo:'#03080f',haloOp:'.75',markBg:'#0d1a33'}
   : {grid:'#ccd9ec',frame:'#b3c6e0',vd:'#eef3fa',vdTx:'#9fb0c8',
      lblBg:'#ffffff',lblTx:'#10203a',halo:'#ffffff',haloOp:'.85',markBg:'#ffffff'};
}

/* --------------------------------------------------------------- utils */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function q(sel,ctx){ return (ctx||document).querySelector(sel); }
function qa(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function uid(){ return 's'+Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(n,d){ var f=Math.pow(10,d==null?1:d); return Math.round(n*f)/f; }

function emptyProject(){
  return {
    version:1, kind:'cheminement-cables',
    title:'Cheminement de câbles', ref:'', revision:'A', author:'', date:'',
    image:null, imgW:DEF_W, imgH:DEF_H,
    scale:0,                 /* pixels image par mm ; 0 = non défini */
    steps:[], marks:[],
    settings:{ ghost:'prev', labels:true, thickness:6, theme:'clair' }
  };
}
function emptyStep(n){
  return {
    id:uid(), group:'', name:'Étape '+n,
    wire:{ num:'', color:'noir', section:'', length:'', from:'', to:'', comment:'' },
    path:[]
  };
}

/* ------------------------------------------------- géométrie orthogonale */
/* Chaque point porte un coude (elbow) : 'h' = on part à l'horizontale,
   'v' = on part à la verticale. Le tracé rendu est donc toujours composé
   de segments strictement horizontaux ou verticaux. */
function routePoints(path){
  var out=[];
  if(!path || !path.length) return out;
  out.push({x:path[0].x,y:path[0].y});
  for(var i=1;i<path.length;i++){
    var a=path[i-1], b=path[i];
    if(a.x!==b.x && a.y!==b.y){
      if((b.elbow||'h')==='h') out.push({x:b.x,y:a.y});
      else out.push({x:a.x,y:b.y});
    }
    out.push({x:b.x,y:b.y});
  }
  return out;
}
function pathD(path){
  var p=routePoints(path); if(!p.length) return '';
  var d='M '+fmt(p[0].x,2)+' '+fmt(p[0].y,2);
  for(var i=1;i<p.length;i++) d+=' L '+fmt(p[i].x,2)+' '+fmt(p[i].y,2);
  return d;
}
function pathLen(path){
  var p=routePoints(path), L=0;
  for(var i=1;i<p.length;i++) L+=Math.abs(p[i].x-p[i-1].x)+Math.abs(p[i].y-p[i-1].y);
  return L;
}

/* ------------------------------------------------------------- rendu SVG */
function renderCanvas(S){
  var P=S.project, svg=q('#svg');
  var W=P.imgW||DEF_W, H=P.imgH||DEF_H;
  if(!S.view) S.view={x:0,y:0,w:W,h:H};
  var v=S.view;
  svg.setAttribute('viewBox', fmt(v.x,2)+' '+fmt(v.y,2)+' '+fmt(v.w,2)+' '+fmt(v.h,2));
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');

  /* unités image par pixel écran, en tenant compte du cadrage 'meet' */
  var cw=svg.clientWidth||1000, ch=svg.clientHeight||700;
  var k = 1/Math.min(cw/v.w, ch/v.h);
  var C = ink(P), u = docUnit(P);
  var s='';

  /* défs */
  s+='<defs>'+
     '<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">'+
       '<path d="M40 0H0V40" fill="none" stroke="'+C.grid+'" stroke-width="1"/></pattern>'+
     '</defs>';

  /* fond */
  if(P.image){
    s+='<image href="'+P.image+'" xlink:href="'+P.image+'" x="0" y="0" width="'+W+'" height="'+H+'" />';
  }else{
    s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+C.vd+'"/>'+
       '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#grid)"/>'+
       '<text x="'+(W/2)+'" y="'+(H/2)+'" fill="'+C.vdTx+'" font-size="'+(u*2)+'" text-anchor="middle" font-family="system-ui">Aucun schéma chargé</text>';
  }
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none" stroke="'+C.frame+'" stroke-width="'+(u*.09)+'"/>';

  /* étapes fantômes */
  var cur=S.current, steps=P.steps, ghost=P.settings.ghost;
  var lo = ghost==='all' ? 0 : (ghost==='prev' ? Math.max(0,cur-1) : cur);
  if(ghost!=='none'){
    for(var i=lo;i<cur;i++){
      var st=steps[i]; if(!st || st.path.length<2) continue;
      var c=colorOf(st.wire.color), gw=wireWidth(P,st), gd=pathD(st.path);
      s+='<path d="'+gd+'" fill="none" stroke="'+C.halo+'" stroke-opacity=".45" stroke-width="'+(gw+u*.12)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<path d="'+gd+'" fill="none" stroke="'+c.hex+'" stroke-opacity=".45" stroke-width="'+gw+'" stroke-linecap="round" stroke-linejoin="round"/>';
      if(c.hex2) s+='<path d="'+gd+'" fill="none" stroke="'+c.hex2+'" stroke-opacity=".45" stroke-width="'+gw+'" stroke-dasharray="'+(gw*2.2)+' '+(gw*2.2)+'" stroke-linecap="butt"/>';
    }
  }

  /* étape courante */
  var st2 = steps[cur];
  if(st2 && st2.path.length){
    var cc=colorOf(st2.wire.color), cw=wireWidth(P,st2);
    var d=pathD(st2.path);
    if(st2.path.length>1){
      s+='<path d="'+d+'" fill="none" stroke="'+C.halo+'" stroke-opacity="'+C.haloOp+'" stroke-width="'+(cw+u*.22)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<path d="'+d+'" fill="none" stroke="'+cc.hex+'" stroke-width="'+cw+'" stroke-linecap="round" stroke-linejoin="round"/>';
      if(cc.hex2) s+='<path d="'+d+'" fill="none" stroke="'+cc.hex2+'" stroke-width="'+cw+'" stroke-dasharray="'+(cw*2.2)+' '+(cw*2.2)+'" stroke-linecap="butt"/>';
    }
    var a=st2.path[0], b=st2.path[st2.path.length-1];
    var r=Math.max(cw*1.6, u*.55);
    s+=marker(a.x,a.y,r,'#12915a','D',C);
    if(st2.path.length>1) s+=marker(b.x,b.y,r,'#1a63d6','A',C);
    /* étiquette du fil au milieu du parcours */
    if(P.settings.labels && st2.wire.num && st2.path.length>1){
      var rp=routePoints(st2.path), mid=rp[Math.floor(rp.length/2)];
      var fs=Math.max(cw*2.2,u*.9), tw=String(st2.wire.num).length*fs*.66+fs;
      s+='<g><rect x="'+(mid.x-tw/2)+'" y="'+(mid.y-r-fs*1.55)+'" rx="'+(fs*.42)+'" width="'+tw+'" height="'+(fs*1.45)+'" fill="'+C.lblBg+'" fill-opacity=".94" stroke="'+cc.hex+'" stroke-width="'+(fs*.11)+'"/>'+
         '<text x="'+mid.x+'" y="'+(mid.y-r-fs*.42)+'" fill="'+C.lblTx+'" font-size="'+fs+'" font-family="ui-monospace,monospace" text-anchor="middle">'+esc(st2.wire.num)+'</text></g>';
    }
  }

  /* repères */
  (P.marks||[]).forEach(function(m){
    var mf=u*1.15, w=String(m.text||'').length*mf*.62+mf*1.3, h=mf*1.85;
    s+='<g class="mark" data-mark="'+m.id+'">'+
       '<rect x="'+(m.x-w/2)+'" y="'+(m.y-h/2)+'" rx="'+(mf*.42)+'" width="'+w+'" height="'+h+'" fill="'+C.markBg+'" fill-opacity=".94" stroke="#1a63d6" stroke-width="'+(mf*.1)+'"/>'+
       '<text x="'+m.x+'" y="'+(m.y+mf*.36)+'" fill="'+C.lblTx+'" font-size="'+mf+'" font-weight="600" font-family="system-ui" text-anchor="middle">'+esc(m.text)+'</text>'+
       '</g>';
  });

  svg.innerHTML = s + (S.overlay ? S.overlay(S,k) : '');
}
function marker(x,y,r,col,txt,C){
  return '<g>'+
    '<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.28)+'" fill="'+C.halo+'" fill-opacity="'+C.haloOp+'"/>'+
    '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'" stroke="#fff" stroke-width="'+(r*.18)+'"/>'+
    '<text x="'+x+'" y="'+(y+r*.42)+'" font-size="'+(r*1.15)+'" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="system-ui">'+txt+'</text>'+
    '</g>';
}

/* ------------------------------------------------------- liste de gauche */
function renderSteps(S){
  var P=S.project, host=q('#step-list');
  q('#step-count').textContent = P.steps.length ? (S.current+1)+' / '+P.steps.length : '0';
  if(!P.steps.length){
    host.innerHTML='<div class="empty">Aucune étape.<br>'+(S.edit?'Cliquez sur <b>+ Étape</b> pour commencer.':'')+'</div>';
    return;
  }
  /* regroupement par connecteur, ordre d'apparition conservé */
  var groups=[], map={};
  P.steps.forEach(function(st,i){
    var g=(st.group||'').trim() || '—';
    if(!map[g]){ map[g]={name:g,items:[]}; groups.push(map[g]); }
    map[g].items.push({st:st,i:i});
  });
  var html='';
  groups.forEach(function(g){
    var collapsed = S.collapsed[g.name] ? ' collapsed':'';
    var single = groups.length===1 && g.name==='—';
    html+='<div class="grp'+collapsed+'" data-grp="'+esc(g.name)+'">';
    if(!single){
      html+='<div class="grp-head"><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
            '<span>'+esc(g.name)+'</span><span class="n">'+g.items.length+'</span></div>';
    }
    html+='<div class="grp-body">';
    g.items.forEach(function(o){
      var st=o.st, i=o.i, c=colorOf(st.wire.color);
      var route = (st.wire.from||'?')+' → '+(st.wire.to||'?');
      html+='<div class="step'+(i===S.current?' on':'')+(S.done[st.id]?' done':'')+'" data-i="'+i+'"'+(S.edit?' draggable="true"':'')+'>'+
        '<div class="idx">'+(S.done[st.id]?'✓':(i+1))+'</div>'+
        '<div class="dot" style="background:'+c.hex+(c.hex2?';background:linear-gradient(135deg,'+c.hex+' 50%,'+c.hex2+' 50%)':'')+'"></div>'+
        '<div class="txt"><div class="t1">'+esc(st.name||('Étape '+(i+1)))+'</div>'+
          '<div class="t2">'+esc(st.wire.num?('['+st.wire.num+'] '):'')+esc(route)+'</div></div>'+
        (S.edit?'<span class="grab" title="Glisser pour réordonner">⠿</span>':'')+
      '</div>';
    });
    html+='</div></div>';
  });
  host.innerHTML=html;

  qa('.step',host).forEach(function(elm){
    elm.addEventListener('click',function(){ S.go(parseInt(elm.dataset.i,10)); });
  });
  qa('.grp-head',host).forEach(function(h){
    h.addEventListener('click',function(e){
      e.stopPropagation();
      var name=h.parentNode.dataset.grp;
      S.collapsed[name]=!S.collapsed[name];
      renderSteps(S);
    });
  });
  if(S.onStepsRendered) S.onStepsRendered(S);
  var on=q('.step.on',host); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}

/* ------------------------------------------------------- fiche de droite */
function renderFiche(S){
  if(S.edit && window.editorFiche) return window.editorFiche(S);
  var P=S.project, st=P.steps[S.current], host=q('#fiche');
  if(!st){ host.innerHTML='<div class="empty">Sélectionnez une étape à gauche.</div>'; return; }
  var w=st.wire, c=colorOf(w.color);
  var sw = c.hex2 ? 'background:linear-gradient(135deg,'+c.hex+' 50%,'+c.hex2+' 50%)' : 'background:'+c.hex;
  var lenTxt = w.length ? esc(w.length)+' <small>mm</small>' : estim(P,st);
  /* aperçu replié : ce que l'on voit sans ouvrir le bloc */
  var peek=[]; if(w.section) peek.push(w.section+' mm²'); if(w.length) peek.push(w.length+' mm');
  var h='<div class="fiche">'+
    '<h2>'+esc(st.name||('Étape '+(S.current+1)))+'</h2>'+
    '<div class="sub">Étape '+(S.current+1)+' / '+P.steps.length+(st.group?' · '+esc(st.group):'')+'</div>'+
    '<div class="wire-head"><div class="wire-swatch" style="'+sw+'"></div>'+
      '<div><div class="wn">'+esc(w.num||'—')+'</div><div class="wc">'+esc(c.name)+'</div></div></div>'+
    '<div class="route">'+
      '<div class="node from"><div class="pin">D</div><div><div class="k">Départ</div><div class="v">'+esc(w.from||'—')+'</div></div></div>'+
      '<div class="arrow"></div>'+
      '<div class="node to"><div class="pin">A</div><div><div class="k">Arrivée</div><div class="v">'+esc(w.to||'—')+'</div></div></div>'+
    '</div>'+
    (w.comment?'<div class="note"><div class="k">À vérifier</div>'+esc(w.comment)+'</div>':'')+
    '<details class="acc" id="acc-det"'+(S.open.det?' open':'')+'><summary>Détail du câble'+
      (peek.length?'<span class="peek">'+esc(peek.join('  ·  '))+'</span>':'')+'</summary>'+
      '<div class="accb"><div class="kv">'+
        '<div class="cell"><div class="k">Section</div><div class="v">'+(w.section?esc(w.section)+' <small>mm²</small>':'—')+'</div></div>'+
        '<div class="cell"><div class="k">Longueur</div><div class="v">'+(lenTxt||'—')+'</div></div>'+
      '</div></div>'+
    '</details>'+
    '<label class="check'+(S.done[st.id]?' on':'')+'"><input type="checkbox" id="chk-done"'+(S.done[st.id]?' checked':'')+'> <span>Câblage réalisé et vérifié</span></label>'+
  '</div>';
  host.innerHTML=h;
  var acc=q('#acc-det');
  if(acc) acc.addEventListener('toggle',function(){ S.open.det=acc.open; });
  var chk=q('#chk-done');
  if(chk) chk.addEventListener('change',function(){
    S.done[st.id]=chk.checked; S.saveDone&&S.saveDone(); renderSteps(S); renderFiche(S);
  });
}
function estim(P,st){
  if(!st.path || st.path.length<2) return '';
  var px=pathLen(st.path);
  if(P.scale>0) return fmt(px/P.scale,0)+' <small>mm (estimé)</small>';
  return '';
}

/* --------------------------------------------------- navigation / clavier */
function makeState(project, edit){
  var S={ project:project, current:0, edit:!!edit, collapsed:{}, done:{}, open:{det:false,etp:false}, view:null, overlay:null };
  S.go=function(i){
    if(!S.project.steps.length){ S.current=0; }
    else S.current=clamp(i,0,S.project.steps.length-1);
    S.render();
  };
  S.render=function(){ renderSteps(S); renderFiche(S); renderCanvas(S); renderNav(S); if(S.afterRender) S.afterRender(S); };
  return S;
}
function renderNav(S){
  var n=S.project.steps.length;
  q('#nav-pos').innerHTML = n? '<b>'+(S.current+1)+'</b> / '+n : '—';
  q('#nav-prev').disabled = S.current<=0;
  q('#nav-next').disabled = S.current>=n-1;
  var t=S.project.title||'Cheminement de câbles';
  q('#hd-title').textContent=t;
  var bits=[]; if(S.project.ref) bits.push(S.project.ref);
  if(S.project.revision) bits.push('Ind. '+S.project.revision);
  if(S.project.date) bits.push(S.project.date);
  if(S.project.author) bits.push(S.project.author);
  q('#hd-sub').textContent=bits.join('  ·  ');
  document.title = t + (S.project.ref? ' — '+S.project.ref : '');
}
function fitView(S){
  var P=S.project, svg=q('#svg');
  var W=P.imgW||DEF_W, H=P.imgH||DEF_H;
  S.view={x:0,y:0,w:W,h:H};
  renderCanvas(S);
}
function bindViewport(S){
  var svg=q('#svg'), wrap=q('#stage-wrap');
  function toImg(ev){
    var r=svg.getBoundingClientRect();
    var vb=S.view, sc=Math.min(r.width/vb.w, r.height/vb.h);
    var ox=(r.width - vb.w*sc)/2, oy=(r.height - vb.h*sc)/2;
    return { x: (ev.clientX-r.left-ox)/sc + vb.x, y: (ev.clientY-r.top-oy)/sc + vb.y };
  }
  S.toImg=toImg;
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var p=toImg(e), f=e.deltaY>0?1.15:1/1.15;
    var nw=clamp(S.view.w*f, 40, (S.project.imgW||DEF_W)*6);
    var ratio=nw/S.view.w;
    S.view={ x:p.x-(p.x-S.view.x)*ratio, y:p.y-(p.y-S.view.y)*ratio, w:nw, h:S.view.h*ratio };
    renderCanvas(S);
  },{passive:false});
  var pan=null;
  svg.addEventListener('mousedown',function(e){
    var wantPan = e.button===1 || (e.button===0 && (e.shiftKey||S.spaceDown||S.tool==='pan'));
    if(!wantPan) return;
    e.preventDefault(); svg.classList.add('panning');
    pan={sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};
  });
  window.addEventListener('mousemove',function(e){
    if(!pan) return;
    var r=svg.getBoundingClientRect(), sc=Math.min(r.width/S.view.w,r.height/S.view.h);
    S.view.x=pan.vx-(e.clientX-pan.sx)/sc; S.view.y=pan.vy-(e.clientY-pan.sy)/sc;
    renderCanvas(S);
  });
  window.addEventListener('mouseup',function(){ pan=null; svg.classList.remove('panning'); });
  window.addEventListener('resize',function(){ renderCanvas(S); });
  q('#nav-prev').addEventListener('click',function(){ S.go(S.current-1); });
  q('#nav-next').addEventListener('click',function(){ S.go(S.current+1); });
  window.addEventListener('keydown',function(e){
    var t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
    if(e.code==='Space'){ S.spaceDown=true; svg.classList.add('pan'); }
    if(e.key==='ArrowLeft'){ S.go(S.current-1); }
    if(e.key==='ArrowRight'){ S.go(S.current+1); }
    if(e.key==='0'){ fitView(S); }
    if(e.key==='+'||e.key==='='){ zoomBy(S,1/1.25); }
    if(e.key==='-'){ zoomBy(S,1.25); }
    if(e.key==='g'||e.key==='G'){ cycleGhost(S); }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space'){ S.spaceDown=false; svg.classList.remove('pan'); }
  });
}
function zoomBy(S,f){
  var cx=S.view.x+S.view.w/2, cy=S.view.y+S.view.h/2;
  var nw=clamp(S.view.w*f,40,(S.project.imgW||DEF_W)*6), r=nw/S.view.w;
  S.view={x:cx-S.view.w*r/2, y:cy-S.view.h*r/2, w:nw, h:S.view.h*r};
  renderCanvas(S);
}
function cycleGhost(S){
  var o=['none','prev','all'], i=o.indexOf(S.project.settings.ghost);
  S.project.settings.ghost=o[(i+1)%3];
  qa('#ghost-seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.g===S.project.settings.ghost); });
  renderCanvas(S);
}
function ghostSeg(S){
  return '<span class="lbl">Étapes précédentes</span>'+

      '<button data-g="prev"'+(S.project.settings.ghost==='prev'?' class="on"':'')+'>Précédente</button>'+
      '<button data-g="all"'+(S.project.settings.ghost==='all'?' class="on"':'')+'>Toutes</button>'+
    '</span>';
}
function bindGhostSeg(S){
  qa('#ghost-seg button').forEach(function(b){
    b.addEventListener('click',function(){
      S.project.settings.ghost=b.dataset.g;

function bindThemeBtn(S,after){

  b.addEventListener('click',function(){
    S.project.settings.theme = S.project.settings.theme==='sombre' ? 'clair' : 'sombre';
    applyTheme(S.project); renderCanvas(S); if(after) after();
  });
}
function toast(msg,err){
  var t=document.createElement('div');
  t.className='toast'+(err?' err':''); t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); },320); },2200);
}

/* ------------------------------------------------------- boot opérateur */
function bootViewer(project){
  document.body.classList.add('viewer');
  var S=makeState(project,false);
  window.S=S;
  buildLayout(q('#root'));
  applyTheme(project);
  q('#top-actions').innerHTML= themeBtn()+
    '<button class="btn" id="op-print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg> Imprimer</button>'+
    '<button class="btn" id="op-reset" title="Réinitialiser les cases cochées">Réinitialiser le suivi</button>';
  q('#stage-bar').innerHTML = '<div style="flex:1"></div>'+ghostSeg(S)+
    '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+zoomBtns();
  bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindThemeBtn(S);

  /* suivi de câblage mémorisé sur le poste */
  var key='chem-done-'+(project.ref||project.title||'doc');
  try{ S.done=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){ S.done={}; }
  S.saveDone=function(){ try{ localStorage.setItem(key,JSON.stringify(S.done)); }catch(e){} };
  q('#op-print').addEventListener('click',function(){ window.print(); });
  q('#op-reset').addEventListener('click',function(){
    if(confirm('Décocher toutes les étapes ?')){ S.done={}; S.saveDone(); S.render(); }
  });
  fitView(S); S.go(0);
}
</script>

<!-- =====================================================================
     EDITEUR (jamais exporté)
     ================================================================== -->
<script id="editor-js">
(function(){
  var S=null;
  var LS='cheminement-cables-autosave';

  /* ------------------------------------------------------------- démarrage */
  function boot(){
    var p=emptyProject();
    try{
      var raw=localStorage.getItem(LS);
      if(raw){ var o=JSON.parse(raw); if(o && o.kind==='cheminement-cables') p=migrate(o); }
    }catch(e){}
    S=makeState(p,true);
    window.S=S;
    S.tool='select'; S.sel=-1; S.elbow='h'; S.snap=10; S.magnet=true;   /* aimantation et grille toujours actives */
    applyTheme(S.project);
    buildLayout(q('#root'));
    topbar(); stagebar(); leftfoot();
    bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindStage();
    S.overlay=overlay;
    S.onStepsRendered=bindDnd;
    S.afterRender=function(){ hint(); autosave(); };
    fitView(S);
    if(!S.project.steps.length) addStep();
    else S.render();
  }
  function migrate(o){
    var d=emptyProject();
    o.settings=Object.assign({},d.settings,o.settings||{});
    o.marks=o.marks||[]; o.steps=o.steps||[];
    o.steps.forEach(function(st){
      st.wire=Object.assign({num:'',color:'noir',section:'',length:'',from:'',to:'',comment:''},st.wire||{});
      st.path=st.path||[]; st.id=st.id||uid(); st.group=st.group||'';
    });
    return Object.assign(d,o);
  }
  function autosave(){
    try{ localStorage.setItem(LS,JSON.stringify(S.project)); }catch(e){}
  }

  /* ---------------------------------------------------------- barre haute */
  function topbar(){
    q('#top-actions').innerHTML= themeBtn()+
      '<button class="btn" id="t-doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> Document</button>'+
      '<button class="btn" id="t-open">Ouvrir</button>'+
      '<button class="btn" id="t-save">Enregistrer</button>'+
      '<button class="btn primary" id="t-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 20h16"/></svg> Exporter pour l\'opérateur</button>'+
      '<input type="file" id="f-img" accept="image/*" hidden><input type="file" id="f-json" accept=".json,application/json" hidden>';
    bindThemeBtn(S,autosave);
    q('#f-img').addEventListener('change',onImage);
    q('#f-json').addEventListener('change',onOpen);
    q('#t-doc').addEventListener('click',dlgDoc);
    q('#t-open').addEventListener('click',function(){ q('#f-json').click(); });
    q('#t-save').addEventListener('click',saveJson);
    q('#t-export').addEventListener('click',exportViewer);
  }

  /* ---------------------------------------------------------- barre basse */
  function stagebar(){
    q('#stage-bar').innerHTML=
      '<span class="seg" id="tool-seg">'+
        '<button data-t="draw">Tracer le fil</button>'+
        '<button data-t="select">Modifier</button>'+
        '<button data-t="mark">Repère</button>'+
      '</span>'+
      '<div style="flex:1"></div>'+
      ghostSeg(S)+
      '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+
      '<button class="btn sm" id="z-fit">Ajuster</button>';
    qa('#tool-seg button').forEach(function(b){
      b.addEventListener('click',function(){ setTool(b.dataset.t); });
    });
    syncSeg();
  }

  function syncSeg(){
    qa('#tool-seg button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===S.tool); });
  }
  function setTool(t){
    S.tool=t; S.sel=-1; syncSeg();
    var svg=q('#svg');
    svg.classList.toggle('draw', t==='draw'||t==='mark');
    svg.classList.toggle('pan', t==='pan');
    hint(); renderCanvas(S);
  }
  function hint(){
    var h=q('#hint');
    var txt='';
    if(S.tool==='draw'){
      txt='<b>Clic</b> = poser un point · <kbd>Tab</kbd> inverser le coude · <kbd>Retour arr.</kbd> annuler le dernier · <kbd>Échap</kbd> terminer';
    }else if(S.tool==='mark'){
      txt='<b>Clic</b> = poser un repère (X1, Wago A, Flexisoft…) · <kbd>Échap</kbd> pour sortir';
    }else if(S.tool==='select'){
      var st=S.project.steps[S.current];
      if(st && st.path.length) txt='<b>Glisser</b> un point pour le déplacer · <b>Clic droit</b> = supprimer · <b>Double-clic</b> sur un coude = inverser';
    }
    h.innerHTML=txt; h.style.display= txt?'block':'none';
  }

  /* --------------------------------------------------------- bas de liste */
  function leftfoot(){
    q('#left-foot').innerHTML=
      '<div style="padding:9px;border-top:1px solid var(--line);display:flex;gap:6px">'+
        '<button class="btn primary sm" id="s-add" style="flex:1">+ Étape</button>'+
        '<button class="btn sm" id="s-dup" title="Dupliquer l\'étape">⧉</button>'+
        '<button class="btn sm danger" id="s-del" title="Supprimer l\'étape">🗑</button>'+
      '</div>';
    q('#s-add').addEventListener('click',function(){ addStep(); });
    q('#s-dup').addEventListener('click',dupStep);
    q('#s-del').addEventListener('click',delStep);
  }
  function addStep(){
    var P=S.project, prev=P.steps[P.steps.length-1];
    var st=emptyStep(P.steps.length+1);
    if(prev){ st.group=prev.group; st.wire.color=prev.wire.color; st.wire.section=prev.wire.section; }
    P.steps.push(st); S.go(P.steps.length-1); setTool('draw');
  }
  function dupStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    var c=JSON.parse(JSON.stringify(st)); c.id=uid(); c.name=st.name+' (copie)';
    P.steps.splice(S.current+1,0,c); S.go(S.current+1);
  }
  function delStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    if(!confirm('Supprimer « '+(st.name||'cette étape')+' » ?')) return;
    P.steps.splice(S.current,1); S.go(Math.min(S.current,P.steps.length-1));
  }

  /* ------------------------------------------------ réordonnancement (DnD) */
  function bindDnd(){
    var dragI=-1;
    qa('#step-list .step').forEach(function(elm){
      elm.addEventListener('dragstart',function(e){
        dragI=parseInt(elm.dataset.i,10); elm.classList.add('dragging');
        e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(dragI)); }catch(x){}
      });
      elm.addEventListener('dragend',function(){
        elm.classList.remove('dragging');
        qa('#step-list .step').forEach(function(x){ x.classList.remove('drop-before','drop-after'); });
      });
      elm.addEventListener('dragover',function(e){
        e.preventDefault();
        var r=elm.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
        elm.classList.toggle('drop-after',after); elm.classList.toggle('drop-before',!after);
      });
      elm.addEventListener('dragleave',function(){ elm.classList.remove('drop-before','drop-after'); });
      elm.addEventListener('drop',function(e){
        e.preventDefault();
        var to=parseInt(elm.dataset.i,10);
        var r=elm.getBoundingClientRect(); if((e.clientY-r.top)>r.height/2) to++;
        if(dragI<0||dragI===to) return;
        var P=S.project, moved=P.steps[dragI];
        P.steps.splice(dragI,1);
        if(dragI<to) to--;
        P.steps.splice(to,0,moved);
        S.go(P.steps.indexOf(moved));
      });
    });
  }

  /* ----------------------------------------------------- fiche éditable */
  window.editorFiche=function(S){
    var P=S.project, st=P.steps[S.current], host=q('#fiche');
    if(!st){ host.innerHTML='<div class="empty">Aucune étape.<br>Cliquez sur <b>+ Étape</b>.</div>'; return; }
    var w=st.wire, c=colorOf(w.color);
    var opts=WIRE_COLORS.map(function(o){
      return '<option value="'+o.id+'"'+(o.id===w.color?' selected':'')+'>'+o.name+'</option>';
    }).join('');
    var est = st.path.length>1 ? pathLen(st.path) : 0;
    var estTxt = est ? (P.scale>0 ? fmt(est/P.scale,0)+' mm' : fmt(est,0)+' px') : '—';
    var peek=[]; if(w.section) peek.push(w.section+' mm²'); if(w.length) peek.push(w.length+' mm');
    if(w.comment) peek.push('remarque');
    host.innerHTML=
    '<div class="fiche">'+
      '<div class="row">'+
        '<div class="field"><label>N° de fil</label><input class="inp" id="e-num" value="'+esc(w.num)+'" placeholder="1042"></div>'+
        '<div class="field"><label>Couleur</label><div class="sw-row">'+
          '<span class="sw-prev" style="'+(c.hex2?'background:linear-gradient(135deg,'+c.hex+' 50%,'+c.hex2+' 50%)':'background:'+c.hex)+'"></span>'+
          '<select class="inp" id="e-col">'+opts+'</select></div></div>'+
      '</div>'+
      '<div class="row">'+
        '<div class="field"><label>Départ</label><input class="inp" id="e-from" value="'+esc(w.from)+'" placeholder="X1:3"></div>'+
        '<div class="field"><label>Arrivée</label><input class="inp" id="e-to" value="'+esc(w.to)+'" placeholder="Wago A:2"></div>'+
      '</div>'+

      '<details class="acc" data-acc="det"'+(S.open.det?' open':'')+'><summary>Détail du câble'+
        (peek.length?'<span class="peek">'+esc(peek.join('  ·  '))+'</span>':'')+'</summary><div class="accb">'+
        '<div class="row">'+
          '<div class="field"><label>Section (mm²)</label><input class="inp" id="e-sec" value="'+esc(w.section)+'" placeholder="0,75"></div>'+
          '<div class="field"><label>Longueur (mm)</label><div class="sw-row">'+
            '<input class="inp" id="e-len" value="'+esc(w.length)+'" placeholder="—">'+
            (P.scale>0&&est?'<button class="btn sm" id="e-len-est" title="Reprendre la longueur mesurée sur le tracé">≈ '+estTxt+'</button>':'')+
          '</div></div>'+
        '</div>'+
        '<div class="field"><label>À vérifier / remarque</label><textarea class="inp" id="e-com" placeholder="Serrage, repérage, précaution…">'+esc(w.comment)+'</textarea></div>'+
      '</div></details>'+

      '<details class="acc" data-acc="etp"'+(S.open.etp?' open':'')+'><summary>Étape'+
        '<span class="peek">'+esc(st.name||'—')+'</span></summary><div class="accb">'+
        '<div class="field"><label>Intitulé</label><input class="inp" id="e-name" value="'+esc(st.name)+'"></div>'+
        '<div class="field"><label>Connecteur / groupe</label><input class="inp" id="e-group" list="grp-list" value="'+esc(st.group)+'" placeholder="X1 — Flexisoft"><datalist id="grp-list">'+groupOpts()+'</datalist></div>'+
      '</div></details>'+

      '<div class="sw-row" style="justify-content:space-between;margin-top:12px">'+
        '<span class="tag'+(st.path.length>1?' ok':'')+'">Tracé : '+st.path.length+' point'+(st.path.length>1?'s':'')+'</span>'+
        '<span style="display:flex;gap:6px">'+
          '<button class="btn sm" id="e-draw">Tracer</button>'+
          '<button class="btn sm danger" id="e-clear">Effacer</button>'+
        '</span>'+
      '</div>'+
    '</div>';

    qa('.acc',host).forEach(function(a){
      a.addEventListener('toggle',function(){ S.open[a.dataset.acc]=a.open; });
    });

    function bindF(id,fn){
      var e=q(id); if(!e) return;
      e.addEventListener('input',function(){ fn(e.value); autosave(); renderSteps(S); renderCanvas(S); });
    }
    bindF('#e-name',function(v){ st.name=v; });
    bindF('#e-group',function(v){ st.group=v; });
    bindF('#e-num',function(v){ w.num=v; });
    bindF('#e-sec',function(v){ w.section=v; });
    bindF('#e-from',function(v){ w.from=v; });
    bindF('#e-to',function(v){ w.to=v; });
    bindF('#e-len',function(v){ w.length=v; });
    bindF('#e-com',function(v){ w.comment=v; });
    q('#e-col').addEventListener('change',function(){ w.color=this.value; renderFiche(S); renderSteps(S); renderCanvas(S); autosave(); });
    q('#e-draw').addEventListener('click',function(){ setTool('draw'); });
    q('#e-clear').addEventListener('click',function(){ st.path=[]; renderFiche(S); renderCanvas(S); autosave(); });
    var eb=q('#e-len-est');
    if(eb) eb.addEventListener('click',function(){
      w.length=String(fmt(est/P.scale,0)); renderFiche(S); autosave();
    });
  };
  function groupOpts(){
    var seen={}, o='';
    S.project.steps.forEach(function(s){ if(s.group && !seen[s.group]){ seen[s.group]=1; o+='<option value="'+esc(s.group)+'">'; } });
    return o;
  }

  /* ------------------------------------------------------- calque d'édition */
  function overlay(S,k){
    var st=S.project.steps[S.current];
    var s='';
    if(!st) return s;
    /* poignées exprimées en unités schéma : elles suivent le zoom */
    var u=docUnit(S.project), r=Math.max(wireWidth(S.project,st)*1.15, u*.34);
    var c=colorOf(st.wire.color);

    /* aperçu du prochain segment */
    if(S.tool==='draw' && st.path.length && S.mouse){
      var a=st.path[st.path.length-1], b={x:S.mouse.x,y:S.mouse.y,elbow:S.elbow};
      s+='<path d="'+pathD([a,b])+'" fill="none" stroke="'+c.hex+'" stroke-opacity=".55" stroke-width="'+wireWidth(S.project,st)+'" stroke-dasharray="'+(u*.6)+' '+(u*.45)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="'+(r*.85)+'" fill="none" stroke="'+ink(S.project).lblTx+'" stroke-opacity=".8" stroke-width="'+(r*.2)+'"/>';
    }
    /* poignées */
    if(S.tool==='select'||S.tool==='draw'){
      st.path.forEach(function(p,i){
        var sel = i===S.sel;
        s+='<circle class="handle" data-pi="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" '+
           'fill="'+(sel?'#1a63d6':ink(S.project).lblBg)+'" stroke="'+ink(S.project).lblTx+'" stroke-width="'+(r*.22)+'" style="cursor:move"/>';
      });
      /* coudes calculés (double-clic pour inverser) */
      for(var i=1;i<st.path.length;i++){
        var A=st.path[i-1], B=st.path[i];
        if(A.x!==B.x && A.y!==B.y){
          var e=(B.elbow||'h')==='h'?{x:B.x,y:A.y}:{x:A.x,y:B.y};
          s+='<rect class="elbow" data-ei="'+i+'" x="'+(e.x-r*.7)+'" y="'+(e.y-r*.7)+'" width="'+(r*1.4)+'" height="'+(r*1.4)+'" rx="'+(r*.3)+'" fill="'+ink(S.project).markBg+'" stroke="#1a63d6" stroke-width="'+(r*.2)+'" style="cursor:pointer"/>';
        }
      }
    }
    return s;
  }

  /* ------------------------------------------------------ interactions SVG */
  function bindStage(){
    var svg=q('#svg');
    var drag=null;

    function snap(p){
      var P=S.project;
      p.x=clamp(p.x,0,P.imgW||DEF_W); p.y=clamp(p.y,0,P.imgH||DEF_H);
      if(S.magnet){
        var best=null,bd=14*(S.view.w/(svg.clientWidth||1000));
        P.steps.forEach(function(st,si){
          st.path.forEach(function(q2){
            var d=Math.hypot(q2.x-p.x,q2.y-p.y);
            if(d<bd){ bd=d; best={x:q2.x,y:q2.y}; }
          });
        });
        if(best) return best;
      }
      if(S.snap>0){
        var g=Math.max(2,Math.round(docUnit(P)/2));
        p.x=Math.round(p.x/g)*g; p.y=Math.round(p.y/g)*g;
      }
      return p;
    }

    svg.addEventListener('mousemove',function(e){
      S.mouse=snap(S.toImg(e));
      if(drag){
        var st=S.project.steps[S.current];
        st.path[drag.i].x=S.mouse.x; st.path[drag.i].y=S.mouse.y;
        renderCanvas(S); return;
      }
      if(S.tool==='draw') renderCanvas(S);
    });
    svg.addEventListener('mouseleave',function(){ S.mouse=null; if(S.tool==='draw') renderCanvas(S); });

    svg.addEventListener('mousedown',function(e){
      if(e.button!==0 || e.shiftKey || S.spaceDown || S.tool==='pan') return;
      var t=e.target;
      if(t.classList && t.classList.contains('handle')){
        e.preventDefault();
        S.sel=parseInt(t.dataset.pi,10); drag={i:S.sel}; renderCanvas(S); return;
      }
      if(t.classList && t.classList.contains('elbow')) return;   /* géré au dblclick */
      var st=S.project.steps[S.current];
      var p=snap(S.toImg(e));
      if(S.tool==='draw'){
        if(!st){ toast('Créez d\'abord une étape.',true); return; }
        st.path.push({x:p.x,y:p.y,elbow:S.elbow});
        renderCanvas(S); renderFiche(S); autosave();
      }else if(S.tool==='mark'){
        var txt=prompt('Texte du repère (ex. X1, Wago A, Flexisoft M1) :','');
        if(txt){ S.project.marks.push({id:uid(),x:p.x,y:p.y,text:txt}); renderCanvas(S); autosave(); }
      }else{
        S.sel=-1; renderCanvas(S);
      }
    });
    window.addEventListener('mouseup',function(){
      if(drag){ drag=null; renderFiche(S); autosave(); }
    });

    svg.addEventListener('dblclick',function(e){
      var t=e.target, st=S.project.steps[S.current]; if(!st) return;
      if(t.classList && t.classList.contains('elbow')){
        var i=parseInt(t.dataset.ei,10);
        st.path[i].elbow = (st.path[i].elbow||'h')==='h' ? 'v':'h';
        renderCanvas(S); autosave();
      }
    });
    svg.addEventListener('contextmenu',function(e){
      var t=e.target, st=S.project.steps[S.current];
      if(t.classList && t.classList.contains('handle') && st){
        e.preventDefault();
        st.path.splice(parseInt(t.dataset.pi,10),1);
        S.sel=-1; renderCanvas(S); renderFiche(S); autosave(); return;
      }
      if(t.getAttribute && t.parentNode && t.parentNode.dataset && t.parentNode.dataset.mark){
        e.preventDefault();
        var id=t.parentNode.dataset.mark;
        if(confirm('Supprimer ce repère ?')){
          S.project.marks=S.project.marks.filter(function(m){ return m.id!==id; });
          renderCanvas(S); autosave();
        }
      }
    });

    window.addEventListener('keydown',function(e){
      var tag=e.target.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      var st=S.project.steps[S.current];
      if(e.key==='Tab'){ e.preventDefault(); S.elbow=S.elbow==='h'?'v':'h'; syncSeg(); renderCanvas(S); }
      if(e.key==='Escape'){ setTool('select'); }
      if(e.key==='Backspace' && S.tool==='draw' && st && st.path.length){
        e.preventDefault(); st.path.pop(); renderCanvas(S); renderFiche(S); autosave();
      }
      if(e.key==='Delete' && S.sel>=0 && st){
        st.path.splice(S.sel,1); S.sel=-1; renderCanvas(S); renderFiche(S); autosave();
      }
      if(e.key==='d'||e.key==='D'){ setTool('draw'); }
      if(e.key==='v'||e.key==='V'){ setTool('select'); }
      if(e.key==='n'||e.key==='N'){ addStep(); }
    });
  }

  /* ------------------------------------------------------------- schéma */
  function onImage(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        S.project.image=rd.result;
        S.project.imgW=img.naturalWidth; S.project.imgH=img.naturalHeight;
        fitView(S); S.render(); autosave();
        var m=q('.mask'); if(m) m.remove();
        toast('Schéma chargé ('+img.naturalWidth+' × '+img.naturalHeight+' px)');
      };
      img.onerror=function(){ toast('Image illisible.',true); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
    e.target.value='';
  }

  /* ------------------------------------------------------------ cartouche */
  function dlgDoc(){
    var P=S.project;
    var img = P.image ? (P.imgW+' × '+P.imgH+' px') : 'aucun schéma chargé';
    modal('Document',
      '<div class="field"><label>Schéma de fond</label>'+
        '<div class="sw-row"><span class="inp" style="display:flex;align-items:center;color:var(--tx-2)">'+esc(img)+'</span>'+
        '<button class="btn" id="d-img">'+(P.image?'Remplacer':'Charger')+'</button></div></div>'+
      '<div class="field"><label>Titre</label><input class="inp" id="i-title" value="'+esc(P.title)+'"></div>'+
      '<div class="row">'+
        '<div class="field"><label>Référence / affaire</label><input class="inp" id="i-ref" value="'+esc(P.ref)+'"></div>'+
        '<div class="field"><label>Indice</label><input class="inp" id="i-rev" value="'+esc(P.revision)+'"></div>'+
      '</div>'+
      '<div class="row">'+
        '<div class="field"><label>Auteur</label><input class="inp" id="i-auth" value="'+esc(P.author)+'"></div>'+
        '<div class="field"><label>Date</label><input class="inp" id="i-date" value="'+esc(P.date)+'" placeholder="JJ/MM/AAAA"></div>'+
      '</div>'+
      '<details class="acc" style="margin-top:4px"><summary>Réglages du tracé</summary><div class="accb">'+
        '<div class="row">'+
          '<div class="field"><label>Échelle (px / mm)</label><input class="inp" id="i-scale" value="'+esc(P.scale||'')+'" placeholder="0 = non défini"></div>'+
          '<div class="field"><label>Épaisseur pour 1,5 mm²</label><input class="inp" id="i-th" type="number" min="1" max="60" value="'+(P.settings.thickness||6)+'"></div>'+
        '</div>'+
        '<label class="check'+(P.settings.labels?' on':'')+'" style="margin-top:0"><input type="checkbox" id="i-lab"'+(P.settings.labels?' checked':'')+'> <span>Afficher le n° de fil sur le tracé</span></label>'+
      '</div></details>',
      function(){
        P.title=q('#i-title').value; P.ref=q('#i-ref').value; P.revision=q('#i-rev').value;
        P.author=q('#i-auth').value; P.date=q('#i-date').value;
        P.scale=parseFloat(String(q('#i-scale').value).replace(',','.'))||0;
        P.settings.thickness=clamp(parseInt(q('#i-th').value,10)||6,1,60);
        P.settings.labels=q('#i-lab').checked;
        S.render(); autosave();
      },
      function(m){ q('#d-img',m).addEventListener('click',function(){ q('#f-img').click(); }); });
  }
  function modal(title,body,ok,onOpen){
    var m=document.createElement('div');
    m.className='mask';
    m.innerHTML='<div class="modal"><header>'+esc(title)+'</header><div class="mbody">'+body+'</div>'+
      '<footer><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Valider</button></footer></div>';
    document.body.appendChild(m);
    function close(){ m.remove(); }
    m.addEventListener('click',function(e){ if(e.target===m) close(); });
    q('[data-x]',m).addEventListener('click',close);
    q('[data-ok]',m).addEventListener('click',function(){ ok&&ok(); close(); });
    if(onOpen) onOpen(m);
  }

  /* ------------------------------------------------------ fichiers projet */
  function download(name,content,mime){
    var b=new Blob([content],{type:mime||'application/octet-stream'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },500);
  }
  function slug(s){
    return String(s||'cheminement').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'cheminement';
  }
  function saveJson(){
    download(slug(S.project.ref||S.project.title)+'.json', JSON.stringify(S.project,null,1),'application/json');
    toast('Projet enregistré (.json)');
  }
  function onOpen(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(o.kind!=='cheminement-cables') throw new Error('format');
        S.project=migrate(o); S.current=0; S.done={}; fitView(S); S.render(); autosave();
        toast('Projet chargé : '+(o.title||''));
      }catch(x){ toast('Fichier projet invalide.',true); }
    };
    rd.readAsText(f); e.target.value='';
  }

  /* ---------------------------------------------------- export opérateur */
  function exportViewer(){
    var P=S.project;
    if(!P.steps.length){ toast('Aucune étape à exporter.',true); return; }
    var css=document.getElementById('app-css').textContent;
    var js=document.getElementById('viewer-js').textContent;
    var data=JSON.stringify(P).replace(/<\//g,'<\\/').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    var head=esc(P.title||'Cheminement de câbles')+(P.ref?' — '+esc(P.ref):'');
    var html='<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+head+'</title>\n'+
      '<!-- Document autonome : aucune connexion réseau requise. -->\n'+
      '<style>\n'+css+'\n</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script>\n'+js+'\n<\/script>\n'+
      '<script>bootViewer('+data+');<\/script>\n</body>\n</html>\n';
    download(slug(P.ref||P.title)+'-operateur.html', html, 'text/html;charset=utf-8');
    toast('Document opérateur exporté ('+Math.round(html.length/1024)+' Ko)');
  }

  /* démarrage */
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
</body>
</html>
