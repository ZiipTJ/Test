<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheminement de câbles — Éditeur & Doc opérateur</title>
<!--
  ============================================================================
  CHEMINEMENT DE CABLES
  Application 100% locale, un seul fichier, aucune dépendance réseau.
  Fonctionne en double-cliquant le fichier (protocole file://).
  ============================================================================
-->
<style id="app-css">
/* ------------------------------------------------------------------ base */
:root{
  /* thème clair (par défaut) */
  --bg:#e9eff8;
  --bg-2:#ffffff;
  --bg-3:#f3f7fd;
  --line:#d8e2f0;
  --line-2:#bacbe4;
  --tx:#10203a;
  --tx-2:#4b6183;
  --tx-3:#7e91ae;
  --acc:#1a63d6;
  --acc-2:#1450b4;
  --ok:#12915a;
  --warn:#b5751a;
  --danger:#cc3444;
  --hov:#e7effc;
  --head:#f0f5fc;
  --top-grad:#f4f8fe;
  --stage-top:#dfe8f6;
  --pop:rgba(255,255,255,.96);
  --mask:rgba(20,35,60,.42);
  --sw-bd:rgba(0,0,0,.18);
  --note-bg:#fdf5e6;
  --note-bd:#e8c489;
  --note-tx:#7a5312;
  --done-bg:#e4f6ec;
  --done-bd:#9dd7b8;
  --done-tx:#0e7a4b;
  --dgr-bg:#fdecee;
  --dgr-bd:#e9a8b0;
  --dgr-tx:#a52233;
  --r:10px;
  --sh:0 6px 20px rgba(20,40,80,.12);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.theme-dark{
  --bg:#081020;
  --bg-2:#0d1a33;
  --bg-3:#142748;
  --line:#1d3159;
  --line-2:#2b4a80;
  --tx:#e9effc;
  --tx-2:#9db4dd;
  --tx-3:#6a85b6;
  --acc:#3d8bfd;
  --acc-2:#1a5fd0;
  --ok:#35c47b;
  --warn:#f0a742;
  --danger:#ef5f6b;
  --hov:#132444;
  --head:#0b1832;
  --top-grad:#0a1428;
  --stage-top:#0f1d38;
  --pop:rgba(13,26,51,.95);
  --mask:rgba(4,9,20,.74);
  --sw-bd:rgba(255,255,255,.3);
  --note-bg:rgba(240,167,66,.1);
  --note-bd:rgba(240,167,66,.34);
  --note-tx:#f7d9a8;
  --done-bg:#123a2e;
  --done-bd:#1f6b52;
  --done-tx:#7fe0aa;
  --dgr-bg:#3a1f2c;
  --dgr-bd:#7a3a52;
  --dgr-tx:#ffc9cf;
  --sh:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- layout */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 14px;height:52px;flex:0 0 52px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-2) 60%,var(--top-grad));
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(135deg,var(--acc),#7b5cff);
  display:grid;place-items:center;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 40%,transparent)
}
.logo svg{width:16px;height:16px}
.brand-txt{min-width:0}
.brand-title{font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}

.body{display:flex;flex:1;min-height:0}
.left{
  width:288px;flex:0 0 288px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.right{
  width:330px;flex:0 0 330px;background:var(--bg-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:
  radial-gradient(1200px 600px at 50% -10%,var(--stage-top),var(--bg))}
.panel-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;flex:0 0 auto;
  font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--tx-3);
  border-bottom:1px solid var(--line);font-weight:650
}
.panel-head .count{margin-left:auto;color:var(--tx-3);font-size:11px;letter-spacing:0}
.scroll{overflow:auto;flex:1;min-height:0}

/* ---------------------------------------------------------------- boutons */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx);cursor:pointer;
  white-space:nowrap;transition:background .12s,border-color .12s,transform .06s
}
.btn:hover{background:var(--hov);border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc-2));border-color:#1a5fd0;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--tx)}
.btn.danger:hover{background:var(--dgr-bg);border-color:var(--dgr-bd);color:var(--dgr-tx)}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px;border-radius:7px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.icon.sm{width:26px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 15px}
.seg{display:inline-flex;background:var(--bg-3);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{
  height:30px;padding:0 10px;background:transparent;border:0;color:var(--tx-2);cursor:pointer;
  border-right:1px solid var(--line-2);font-size:12.5px
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc-2);color:#fff;font-weight:600}
.seg button:hover:not(.on){background:var(--hov);color:var(--tx)}

/* --------------------------------------------------------------- étapes */
.grp{border-bottom:1px solid var(--line)}
.grp-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  background:var(--head);color:var(--tx-2);font-size:11.5px;font-weight:650;letter-spacing:.5px;
  position:sticky;top:0;z-index:2
}
.grp-head:hover{color:var(--tx)}
.grp-head .chev{transition:transform .15s;flex:0 0 auto;opacity:.7}
.grp.collapsed .chev{transform:rotate(-90deg)}
.grp.collapsed .grp-body{display:none}
.grp-head .n{margin-left:auto;font-weight:500;color:var(--tx-3)}

.step{
  display:flex;align-items:center;gap:9px;padding:8px 12px 8px 10px;cursor:pointer;
  border-left:3px solid transparent;position:relative
}
.step:hover{background:var(--hov)}
.step.on{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 13%,transparent),transparent);border-left-color:var(--acc)}
.step.done .idx{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.step .idx{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  background:var(--bg-3);border:1px solid var(--line-2);font-size:11.5px;font-family:var(--mono);color:var(--tx-2)
}
.step.on .idx{background:var(--acc-2);border-color:var(--acc);color:#fff;font-weight:600}
.step .txt{min-width:0;flex:1}
.step .t1{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .t2{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.step.on .t2{color:var(--tx-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;border:1px solid var(--sw-bd);box-shadow:0 0 0 2px rgba(0,0,0,.25) inset}
.step .grab{opacity:0;color:var(--tx-3);cursor:grab;flex:0 0 auto}
.step:hover .grab{opacity:.8}
.step.dragging{opacity:.45}
.step.drop-before{box-shadow:inset 0 2px 0 var(--acc)}
.step.drop-after{box-shadow:inset 0 -2px 0 var(--acc)}
.empty{padding:22px 16px;color:var(--tx-3);text-align:center;font-size:12.5px;line-height:1.6}

/* ---------------------------------------------------------------- stage */
.stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;background:transparent}
#svg.pan{cursor:grab}
#svg.panning{cursor:grabbing}
#svg.draw{cursor:crosshair}
.stage-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-top:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap
}
.stage-bar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx-3);font-weight:650}
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
  background:var(--pop);border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;backdrop-filter:blur(3px);
  font-size:12.5px;color:var(--tx-2);box-shadow:var(--sh);pointer-events:none;max-width:90%;text-align:center
}
.hint b{color:var(--tx)}
.hint kbd{
  font-family:var(--mono);font-size:11px;background:var(--bg-3);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--tx);margin:0 1px
}
.stepper{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--pop);border:1px solid var(--line-2);border-radius:11px;padding:6px 8px;box-shadow:var(--sh);backdrop-filter:blur(3px)
}
.stepper .pos{font-family:var(--mono);font-size:12.5px;color:var(--tx-2);min-width:74px;text-align:center}
.stepper .pos b{color:var(--tx);font-size:14px}

/* --------------------------------------------------------------- fiche */
.fiche{padding:14px}
.fiche h2{margin:0 0 3px;font-size:17px;font-weight:650;letter-spacing:.2px}
.fiche .sub{color:var(--tx-3);font-size:12px;margin-bottom:14px;font-family:var(--mono)}
.wire-head{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);margin-bottom:12px
}
.wire-swatch{
  width:42px;height:42px;border-radius:11px;flex:0 0 42px;border:1px solid var(--sw-bd);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)
}
.wire-head .wn{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.5px}
.wire-head .wc{font-size:12px;color:var(--tx-2)}
.route{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.node{
  display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:var(--bg-3);
  border:1px solid var(--line);border-radius:var(--r)
}
.node .pin{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#04101f
}
.node.from .pin{background:var(--ok)}
.node.to .pin{background:var(--acc)}
.node .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.node .v{font-size:19px;font-weight:650;font-family:var(--mono);word-break:break-word;letter-spacing:.4px}
.route .arrow{height:14px;margin-left:25px;border-left:2px dashed var(--line-2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cell{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650}
.cell .v{font-size:15px;font-weight:600;font-family:var(--mono)}
.cell .v small{font-size:11px;color:var(--tx-3);font-weight:400;font-family:var(--sans)}
.note{
  background:var(--note-bg);border:1px solid var(--note-bd);border-left-width:3px;
  border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--note-tx);white-space:pre-wrap
}
.note .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--warn);font-weight:650;margin-bottom:2px}
.check{
  display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;border-radius:var(--r);
  background:var(--bg-3);border:1px solid var(--line);cursor:pointer;user-select:none
}
.check:hover{border-color:var(--line-2)}
.check input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.check.on{background:var(--done-bg);border-color:var(--done-bd)}

/* --------------------------------------------------------- carte câble */
.cab{
  display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:7px;
  background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;transition:border-color .12s,background .12s
}
.cab:hover{border-color:var(--line-2)}
.cab.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 18%,transparent)}
.cab.done{background:var(--done-bg);border-color:var(--done-bd)}
.cab-tick{
  width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:grid;place-items:center;
  border:1.5px solid var(--line-2);background:var(--bg);font-size:13px;font-weight:800;color:var(--done-tx)
}
.cab.done .cab-tick{background:var(--ok);border-color:var(--ok);color:#fff}
.cab-sw{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1px solid var(--sw-bd);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)
}
.cab-txt{flex:1;min-width:0}
.cab-t1{font-family:var(--mono);font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-t2{
  display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;
  color:var(--tx-2);min-width:0
}
.cab-t2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.cab-t2 i{font-style:normal;color:var(--acc);flex:0 0 auto;font-weight:700}
.cab-n{
  font-family:var(--mono);font-size:11px;color:var(--tx-3);flex:0 0 auto;
  border:1px solid var(--line);border-radius:20px;padding:1px 7px
}
.cab-n.vide{color:var(--warn);border-color:var(--note-bd);background:var(--note-bg)}
.cabs-head{
  display:flex;align-items:center;margin:14px 0 7px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.9px;color:var(--tx-3);font-weight:650
}
.cabs-head button{margin-left:auto}
.dots{display:flex;gap:3px;flex:0 0 auto}

/* ------------------------------------------------------------ menu contextuel */
.ctx{
  position:fixed;z-index:90;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:var(--sh);padding:4px;min-width:170px
}
.ctx button{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:none;border:0;
  border-radius:6px;text-align:left;cursor:pointer;font-size:13px;color:var(--tx)
}
.ctx button:hover{background:var(--hov)}
.ctx button.danger:hover{background:var(--dgr-bg);color:var(--dgr-tx)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ------------------------------------------------------------ accordéon */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-3);margin-bottom:9px;overflow:hidden}
.acc>summary{
  list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx-2);font-weight:650;user-select:none
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{color:var(--tx)}
.acc>summary::after{
  content:'';width:7px;height:7px;flex:0 0 7px;margin-left:auto;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .16s
}
.acc[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.acc>summary .peek{
  margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--tx-3);
  text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.acc>summary .peek~::after{margin-left:8px}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc[open]>summary .peek{display:none}
.accb{padding:12px}
.accb .kv,.accb .field:last-child{margin-bottom:0}

/* ------------------------------------------------------- liste des plans */
.imglist{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.imgrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.imgrow:last-child{border-bottom:0}
.imgrow img{
  width:56px;height:40px;flex:0 0 56px;object-fit:cover;border-radius:6px;
  border:1px solid var(--line-2);background:var(--bg-3)
}
.imgrow .txt{flex:1;min-width:0}
.imgrow .nm{height:28px}
.imgrow .mt{font-size:11px;color:var(--tx-3);font-family:var(--mono);margin-top:2px}

/* --------------------------------------------------------------- formes */
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx-3);font-weight:650;margin-bottom:4px}
.inp{
  width:100%;height:32px;padding:0 9px;background:var(--bg);border:1px solid var(--line-2);
  border-radius:8px;outline:none;transition:border-color .12s,box-shadow .12s
}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;min-height:60px;font-family:inherit}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.inp{cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.sw-row{display:flex;align-items:center;gap:8px}
.sw-prev{width:32px;height:32px;border-radius:8px;flex:0 0 32px;border:1px solid var(--line-2)}

/* --------------------------------------------------------------- modale */
.mask{position:fixed;inset:0;background:var(--mask);z-index:60;display:grid;place-items:center;padding:20px}
.modal{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh);
  width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column
}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center;gap:8px}
.modal .mbody{padding:16px;overflow:auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toasts{position:fixed;top:64px;left:302px;z-index:80;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{
  position:relative;
  background:var(--bg-3);border:1px solid var(--line-2);border-left:3px solid var(--ok);
  padding:10px 16px;border-radius:10px;box-shadow:var(--sh);font-size:13px;
  animation:pop .18s ease-out
}
.toast.err{border-left-color:var(--danger)}
.toast.work{border-left-color:var(--acc);display:flex;align-items:center;gap:9px}
.spin{
  width:13px;height:13px;flex:0 0 13px;border-radius:50%;
  border:2px solid var(--line-2);border-top-color:var(--acc);animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tag{
  display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-2)
}
.tag.warn{background:var(--note-bg);border-color:var(--note-bd);color:var(--note-tx)}
.tag.ok{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}

/* -------------------------------------------------------------- viewer */
body.viewer .editor-only{display:none !important}
body.viewer .left{width:300px;flex-basis:300px}

/* ------------------------------------------------------------ impression */
#print-head{display:none}
@media print{
  #print-head{display:block;margin:0 0 10px;border-bottom:2px solid #000;padding-bottom:6px}
  #print-head h1{margin:0;font-size:17px}
