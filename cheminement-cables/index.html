<!-- =====================================================================
     MOTEUR + VUE OPERATEUR
     Ce bloc est relu tel quel au moment de l'export : il constitue à lui
     seul le fichier autonome remis à l'opérateur. Ne pas y mettre de code
     d'édition.
     ================================================================== -->
<script id="viewer-js">
/* ----------------------------------------------------------- constantes */
var WIRE_COLORS = [
  {id:'noir',    name:'Noir',       hex:'#20262e'},
  {id:'marron',  name:'Marron',     hex:'#7b4b26'},
  {id:'rouge',   name:'Rouge',      hex:'#e03040'},
  {id:'orange',  name:'Orange',     hex:'#f2811d'},
  {id:'jaune',   name:'Jaune',      hex:'#f2c832'},
  {id:'vert',    name:'Vert',       hex:'#31b45e'},
  {id:'bleu',    name:'Bleu',       hex:'#2f86e8'},
  {id:'violet',  name:'Violet',     hex:'#9163d8'},
  {id:'gris',    name:'Gris',       hex:'#9aa4b2'},
  {id:'blanc',   name:'Blanc',      hex:'#eef2f7'},
  {id:'rose',    name:'Rose',       hex:'#ee7fb0'},
  {id:'turq',    name:'Turquoise',  hex:'#2ec7c0'},
  {id:'vj',      name:'Vert/Jaune', hex:'#31b45e', hex2:'#f2c832'},
  {id:'bb',      name:'Bleu clair', hex:'#79c0ff'}
];
function colorOf(id){
  for(var i=0;i<WIRE_COLORS.length;i++){ if(WIRE_COLORS[i].id===id) return WIRE_COLORS[i]; }
  return WIRE_COLORS[0];
}
var DEF_W = 1600, DEF_H = 1000;

/* Épaisseur du tracé, en unités du schéma. */
function wireWidth(P){ return P.settings.thickness||6; }
/* Unité de dessin liée au schéma, jamais au zoom : repères et étiquettes
   conservent donc leur taille par rapport au plan quand on zoome. */
function docUnit(im){ return Math.max(10,((im&&im.w)||DEF_W)/100); }
/* ------------------------------------------------- collection de plans ---
   Un projet porte plusieurs plans ; chaque étape désigne celui sur lequel
   son fil est tracé. Les repères appartiennent eux aussi à un plan. */
function imageById(P,id){
  var L=P.images||[];
  for(var i=0;i<L.length;i++){ if(L[i].id===id) return L[i]; }
  return null;
}
function stepImage(P,st){
  return (st && imageById(P,st.img)) || (P.images && P.images[0]) || null;
}
function curImage(S){ return stepImage(S.project, S.project.steps[S.current]); }
function imgDims(im){ return { w:(im&&im.w)||DEF_W, h:(im&&im.h)||DEF_H }; }
/* Couleurs du dessin selon le thème. */
function ink(P){
  return (P.settings.theme==='sombre')
   ? {grid:'#1b2f57',frame:'#1d3159',vd:'#0a1730',vdTx:'#3d5480',
      lblBg:'#081020',lblTx:'#e9effc',halo:'#03080f',haloOp:'.75',markBg:'#0d1a33'}
   : {grid:'#ccd9ec',frame:'#b3c6e0',vd:'#eef3fa',vdTx:'#9fb0c8',
      lblBg:'#ffffff',lblTx:'#10203a',halo:'#ffffff',haloOp:'.85',markBg:'#ffffff'};
}

/* --------------------------------------------------------------- utils */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function q(sel,ctx){ return (ctx||document).querySelector(sel); }
function qa(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function uid(){ return 's'+Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(n,d){ var f=Math.pow(10,d==null?1:d); return Math.round(n*f)/f; }

function emptyProject(){
  return {
    version:1, kind:'cheminement-cables',
    title:'Cheminement de câbles', ref:'', revision:'', author:'', date:'',
    images:[],               /* collection de plans réutilisables */
    release:{ trigram:'', hard:'', date:'' },   /* cartouche de la version remise */
    steps:[], marks:[],
    settings:{ ghost:'prev', labels:true, thickness:6, thickAuto:true, theme:'clair' }
  };
}
/* Un câble : son repère, sa couleur, son origine, son extrémité, son tracé. */
function emptyCable(){
  return { id:uid(), num:'', color:'noir', from:'', to:'', path:[] };
}
/* Une étape rassemble les câbles à brancher d'un même tenant, typiquement
   un connecteur. */
function emptyStep(n){
  return { id:uid(), group:'', name:'Étape '+n, img:'', cables:[emptyCable()] };
}
function curStep(S){ return S.project.steps[S.current]||null; }
function curCable(S){
  var st=curStep(S); if(!st||!st.cables.length) return null;
  var i=(S.cable>=0)?S.cable:0;
  return st.cables[clamp(i,0,st.cables.length-1)];
}
function cableLabel(c,i){ return c && c.num ? 'Câble '+c.num : 'Câble '+(i+1); }

/* ------------------------------------------------- géométrie orthogonale */
/* Chaque point porte un coude (elbow) : 'h' = on part à l'horizontale,
   'v' = on part à la verticale. Le tracé rendu est donc toujours composé
   de segments strictement horizontaux ou verticaux. */
function routePoints(path){
  var out=[];
  if(!path || !path.length) return out;
  out.push({x:path[0].x,y:path[0].y});
  for(var i=1;i<path.length;i++){
    var a=path[i-1], b=path[i];
    if(a.x!==b.x && a.y!==b.y){
      if((b.elbow||'h')==='h') out.push({x:b.x,y:a.y});
      else out.push({x:a.x,y:b.y});
    }
    out.push({x:b.x,y:b.y});
  }
  return out;
}
function pathD(path){
  var p=routePoints(path); if(!p.length) return '';
  var d='M '+fmt(p[0].x,2)+' '+fmt(p[0].y,2);
  for(var i=1;i<p.length;i++) d+=' L '+fmt(p[i].x,2)+' '+fmt(p[i].y,2);
  return d;
}
function pathLen(path){
  var p=routePoints(path), L=0;
  for(var i=1;i<p.length;i++) L+=Math.abs(p[i].x-p[i-1].x)+Math.abs(p[i].y-p[i-1].y);
  return L;
}

/* ------------------------------------------------------------- squelette */
function buildLayout(root){
  root.innerHTML =
  '<div class="app">'+
    '<header class="topbar">'+
      '<div class="brand">'+
        '<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M4 4v9a3 3 0 0 0 3 3h6"/><circle cx="4" cy="4" r="1.6" fill="#fff"/><circle cx="19" cy="16" r="2.4"/>'+
        '</svg></div>'+
        '<div class="brand-txt"><div class="brand-title" id="hd-title">—</div><div class="brand-sub" id="hd-sub"></div></div>'+
      '</div>'+
      '<div class="spacer"></div>'+
      '<div class="top-actions" id="top-actions"></div>'+
    '</header>'+
    '<div id="print-head"></div>'+
    '<div class="body">'+
      '<aside class="left">'+
        '<div class="panel-head"><span>Connecteurs / étapes</span><span class="count" id="step-count"></span></div>'+
        '<div class="scroll" id="step-list"></div>'+
        '<div id="left-foot"></div>'+
      '</aside>'+
      '<section class="stage">'+
        '<div class="stage-wrap" id="stage-wrap">'+
          '<svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>'+
          '<div class="stepper">'+
            '<button class="btn icon sm" id="nav-prev" title="Étape précédente (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'+
            '<div class="pos" id="nav-pos">—</div>'+
            '<button class="btn icon sm" id="nav-next" title="Étape suivante (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'+
          '</div>'+
          '<div class="hint" id="hint" style="display:none"></div>'+
        '</div>'+
        '<div class="stage-bar" id="stage-bar"></div>'+
      '</section>'+
      '<aside class="right"><div class="scroll" id="fiche"></div></aside>'+
    '</div>'+
  '</div>';
}

/* ------------------------------------------------------------- rendu SVG */
/* ---------------------------------------------------------------- rendu ---
   Le dessin est réparti en trois couches indépendantes :
     #g-bg    le plan, reconstruit seulement quand on change de plan ;
     #g-wires les fils, les marqueurs et les repères ;
     #g-over  le calque d'édition (poignées, segment en cours).
   Un plan en 8K pèse plusieurs dizaines de mégaoctets : reconstruire sa
   balise <image> à chaque mouvement de souris obligeait le navigateur à la
   redécoder, ce qui saccadait tout. Le fond reste donc en place, et comme
   plus aucune cote ne dépend du zoom, déplacer ou zoomer ne touche même
   que l'attribut viewBox. */
function applyView(S){
  var svg=q('#svg'), v=S.view; if(!svg||!v) return;
  svg.setAttribute('viewBox', fmt(v.x,2)+' '+fmt(v.y,2)+' '+fmt(v.w,2)+' '+fmt(v.h,2));
}
/* Les plans déjà affichés restent en place, simplement masqués : revenir sur
   l'un d'eux est alors immédiat, là où reconstruire sa balise <image> impose
   au navigateur de redécoder plusieurs dizaines de mégaoctets. On en garde
   trois, un 8K décodé occupant beaucoup de mémoire. */
var BG_CACHE = 3;
function setBackground(S,im){
  var g=q('#g-bg'); if(!g) return;
  var nodes=qa('image',g);
  nodes.forEach(function(n){ n.style.display='none'; });
  if(!im) return;
  var node=null;
  for(var i=0;i<nodes.length;i++){ if(nodes[i].getAttribute('data-img')===im.id) node=nodes[i]; }
  if(!node){
    node=document.createElementNS('http://www.w3.org/2000/svg','image');
    node.setAttribute('data-img',im.id);
    node.setAttribute('href',im.data);
    node.setAttributeNS('http://www.w3.org/1999/xlink','href',im.data);
    node.setAttribute('x','0'); node.setAttribute('y','0');
    node.setAttribute('width',im.w); node.setAttribute('height',im.h);
    g.appendChild(node);
    while(g.childNodes.length>BG_CACHE) g.removeChild(g.firstChild);
  }else{
    g.appendChild(node);            /* le plus récemment vu passe en queue */
  }
  node.style.display='';
}
function renderOverlay(S){
  var g=q('#g-over'); if(g) g.innerHTML = S.overlay ? S.overlay(S) : '';
}
function renderCanvas(S){
  var P=S.project, svg=q('#svg');
  var im=curImage(S), dim=imgDims(im), W=dim.w, H=dim.h;
  /* changement de plan : on recadre, l'ancien zoom n'a plus de sens */
  if(!S.view || S.viewImg!==(im?im.id:'')){ S.viewImg=(im?im.id:''); S.view={x:0,y:0,w:W,h:H}; }
  if(!q('#g-bg')){
    svg.innerHTML='<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">'+
      '<path d="M40 0H0V40" fill="none" stroke="#8899bb" stroke-opacity=".35" stroke-width="1"/></pattern></defs>'+
      '<g id="g-bg"></g><g id="g-frame"></g><g id="g-wires"></g><g id="g-over"></g>';
    S.bgKey=null;
  }
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  applyView(S);

  var C = ink(P), u = docUnit(im);

  /* ------------------------------------------------------------- le plan */
  setBackground(S,im);
  var frameKey=(im?im.id:'none')+'|'+P.settings.theme;
  if(S.frameKey!==frameKey){
    S.frameKey=frameKey;
    var fr='';
    if(!im){
      fr+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+C.vd+'"/>'+
          '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#grid)"/>'+
          '<text x="'+(W/2)+'" y="'+(H/2)+'" fill="'+C.vdTx+'" font-size="'+(u*2)+'" text-anchor="middle" font-family="system-ui">Aucun plan chargé</text>';
    }
    fr+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none" stroke="'+C.frame+'" stroke-width="'+(u*.09)+'"/>';
    q('#g-frame').innerHTML=fr;
  }

  /* ------------------------------------------------------------- les fils */
  var s='';
  var cur=S.current, steps=P.steps, ghost=P.settings.ghost;
  var W2=wireWidth(P);

  function drawCable(c,fade){
    if(!c.path || c.path.length<2) return '';
    var col=colorOf(c.color), d=pathD(c.path), o='';
    var op = fade ? ' stroke-opacity=".45"' : '';
    o+='<path d="'+d+'" fill="none" stroke="'+C.halo+'" stroke-opacity="'+(fade?'.45':C.haloOp)+'" stroke-width="'+(W2+u*(fade?.12:.22))+'" stroke-linecap="round" stroke-linejoin="round"/>';
    o+='<path d="'+d+'" fill="none" stroke="'+col.hex+'"'+op+' stroke-width="'+W2+'" stroke-linecap="round" stroke-linejoin="round"/>';
    if(col.hex2) o+='<path d="'+d+'" fill="none" stroke="'+col.hex2+'"'+op+' stroke-width="'+W2+'" stroke-dasharray="'+(W2*2.2)+' '+(W2*2.2)+'" stroke-linecap="butt"/>';
    return o;
  }

  /* étapes précédentes, en transparence */
  var lo = ghost==='all' ? 0 : (ghost==='prev' ? Math.max(0,cur-1) : cur);
  if(ghost!=='none'){
    for(var i=lo;i<cur;i++){
      var st=steps[i]; if(!st) continue;
      if(stepImage(P,st)!==im) continue;   /* autre plan : sans objet ici */
      st.cables.forEach(function(c){ s+=drawCable(c,true); });
    }
  }

  /* l'étape courante : tous ses câbles */
  var st2 = steps[cur];
  if(st2){
    st2.cables.forEach(function(c,ci){
      s+=drawCable(c,false);
      if(!c.path.length) return;
      var a=c.path[0], b=c.path[c.path.length-1];
      var r=Math.max(W2*1.6, u*.55);
      s+=marker(a.x,a.y,r,'#12915a','O',C);
      if(c.path.length>1) s+=marker(b.x,b.y,r,'#1a63d6','E',C);
      /* repère du câble, au milieu du parcours */
      if(P.settings.labels && c.num && c.path.length>1){
        var col=colorOf(c.color);
        var rp=routePoints(c.path), mid=rp[Math.floor(rp.length/2)];
        var fs=Math.max(W2*2.2,u*.9), tw=String(c.num).length*fs*.66+fs;
        s+='<g><rect x="'+(mid.x-tw/2)+'" y="'+(mid.y-r-fs*1.55)+'" rx="'+(fs*.42)+'" width="'+tw+'" height="'+(fs*1.45)+'" fill="'+C.lblBg+'" fill-opacity=".94" stroke="'+col.hex+'" stroke-width="'+(fs*.11)+'"/>'+
           '<text x="'+mid.x+'" y="'+(mid.y-r-fs*.42)+'" fill="'+C.lblTx+'" font-size="'+fs+'" font-family="ui-monospace,monospace" text-anchor="middle">'+esc(c.num)+'</text></g>';
      }
    });
  }

  (P.marks||[]).filter(function(m){ return !im || !m.img || m.img===im.id; }).forEach(function(m){
    var mf=u*1.15, w=String(m.text||'').length*mf*.62+mf*1.3, h=mf*1.85;
    s+='<g class="mark" data-mark="'+m.id+'">'+
       '<rect x="'+(m.x-w/2)+'" y="'+(m.y-h/2)+'" rx="'+(mf*.42)+'" width="'+w+'" height="'+h+'" fill="'+C.markBg+'" fill-opacity=".94" stroke="#1a63d6" stroke-width="'+(mf*.1)+'"/>'+
       '<text x="'+m.x+'" y="'+(m.y+mf*.36)+'" fill="'+C.lblTx+'" font-size="'+mf+'" font-weight="600" font-family="system-ui" text-anchor="middle">'+esc(m.text)+'</text>'+
       '</g>';
  });
  q('#g-wires').innerHTML=s;
  renderOverlay(S);
}
function marker(x,y,r,col,txt,C){
  return '<g>'+
    '<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.28)+'" fill="'+C.halo+'" fill-opacity="'+C.haloOp+'"/>'+
    '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'" stroke="#fff" stroke-width="'+(r*.18)+'"/>'+
    '<text x="'+x+'" y="'+(y+r*.42)+'" font-size="'+(r*1.15)+'" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="system-ui">'+txt+'</text>'+
    '</g>';
}

/* ------------------------------------------------------- liste de gauche */
function renderSteps(S){
  var P=S.project, host=q('#step-list');
  q('#step-count').textContent = P.steps.length ? (S.current+1)+' / '+P.steps.length : '0';
  if(!P.steps.length){
    host.innerHTML='<div class="empty">Aucune étape.<br>'+(S.edit?'Cliquez sur <b>+ Étape</b> pour commencer.':'')+'</div>';
    return;
  }
  /* regroupement par connecteur, ordre d'apparition conservé */
  var groups=[], map={};
  P.steps.forEach(function(st,i){
    var g=(st.group||'').trim() || '—';
    if(!map[g]){ map[g]={name:g,items:[]}; groups.push(map[g]); }
    map[g].items.push({st:st,i:i});
  });
  var html='';
  groups.forEach(function(g){
    var collapsed = S.collapsed[g.name] ? ' collapsed':'';
    var single = groups.length===1 && g.name==='—';
    html+='<div class="grp'+collapsed+'" data-grp="'+esc(g.name)+'">';
    if(!single){
      html+='<div class="grp-head"><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
            '<span>'+esc(g.name)+'</span><span class="n">'+g.items.length+'</span></div>';
    }
    html+='<div class="grp-body">';
    g.items.forEach(function(o){
      var st=o.st, i=o.i;
      var done = st.cables.length>0 && st.cables.every(function(c){ return S.done[c.id]; });
      var dots = st.cables.slice(0,4).map(function(c){
        var k=colorOf(c.color);
        return '<span class="dot" style="'+(k.hex2?'background:linear-gradient(135deg,'+k.hex+' 50%,'+k.hex2+' 50%)':'background:'+k.hex)+'"></span>';
      }).join('');
      var nums = st.cables.map(function(c,ci){ return c.num||'—'; }).join(' · ');
      html+='<div class="step'+(i===S.current?' on':'')+(done?' done':'')+'" data-i="'+i+'"'+(S.edit?' draggable="true"':'')+'>'+
        '<div class="idx">'+(done?'✓':(i+1))+'</div>'+
        '<div class="dots">'+dots+'</div>'+
        '<div class="txt"><div class="t1">'+esc(st.name||('Étape '+(i+1)))+'</div>'+
          '<div class="t2">'+st.cables.length+' câble'+(st.cables.length>1?'s':'')+' · '+esc(nums)+'</div></div>'+
        (S.edit?'<span class="grab" title="Glisser pour réordonner">⠿</span>':'')+
      '</div>';
    });
    html+='</div></div>';
  });
  host.innerHTML=html;

  qa('.step',host).forEach(function(elm){
    elm.addEventListener('click',function(){ S.go(parseInt(elm.dataset.i,10)); });
  });
  qa('.grp-head',host).forEach(function(h){
    h.addEventListener('click',function(e){
      e.stopPropagation();
      var name=h.parentNode.dataset.grp;
      S.collapsed[name]=!S.collapsed[name];
      renderSteps(S);
    });
  });
  if(S.onStepsRendered) S.onStepsRendered(S);
  var on=q('.step.on',host); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}

/* ------------------------------------------------------- fiche de droite */
function renderFiche(S){
  if(S.edit && window.editorFiche) return window.editorFiche(S);
  var P=S.project, st=P.steps[S.current], host=q('#fiche');
  if(!st){ host.innerHTML='<div class="empty">Sélectionnez une étape à gauche.</div>'; return; }
  var h='<div class="fiche">'+
    '<h2>'+esc(st.name||('Étape '+(S.current+1)))+'</h2>'+
    '<div class="sub">Étape '+(S.current+1)+' / '+P.steps.length+(st.group?' · '+esc(st.group):'')+
      ((P.images||[]).length>1 ? ' · plan '+esc((stepImage(P,st)||{}).name||'—') : '')+'</div>'+
    st.cables.map(function(c,i){ return cableCard(c,i,{done:!!S.done[c.id],check:true}); }).join('')+
  '</div>';
  host.innerHTML=h;
  qa('.cab',host).forEach(function(el){
    el.addEventListener('click',function(){
      var c=st.cables[parseInt(el.dataset.ci,10)];
      S.done[c.id]=!S.done[c.id];
      renderSteps(S); renderFiche(S);
    });
  });
}
/* Carte d'un câble : repère, couleur, origine et extrémité. Volontairement
   compacte et de hauteur constante, pour qu'une étape puisse en aligner
   plusieurs sans que la fiche devienne illisible. */
function cableCard(c,i,o){
  o=o||{};
  var k=colorOf(c.color);
  var sw = k.hex2 ? 'background:linear-gradient(135deg,'+k.hex+' 50%,'+k.hex2+' 50%)' : 'background:'+k.hex;
  return '<div class="cab'+(o.done?' done':'')+(o.sel?' on':'')+'" data-ci="'+i+'">'+
    (o.check?'<span class="cab-tick">'+(o.done?'✓':'')+'</span>':'')+
    '<span class="cab-sw" style="'+sw+'" title="'+esc(k.name)+'"></span>'+
    '<div class="cab-txt">'+
      '<div class="cab-t1">'+esc(cableLabel(c,i))+'</div>'+
      '<div class="cab-t2"><span>'+esc(c.from||'—')+'</span><i>→</i><span>'+esc(c.to||'—')+'</span></div>'+
    '</div>'+
    (o.right||'')+
  '</div>';
}
/* Mémorise l'état déplié d'un bloc, dès le clic. */
function bindAcc(det,key,S){
  var sum=det.querySelector('summary'); if(!sum) return;
  sum.addEventListener('click',function(){ S.open[key]=!det.open; });
}
/* --------------------------------------------------- navigation / clavier */
function makeState(project, edit){
  var S={ project:project, current:0, cable:0, editCable:-1, edit:!!edit,
          collapsed:{}, done:{}, open:{det:false,etp:false}, view:null, overlay:null };
  S.go=function(i){
    if(!S.project.steps.length){ S.current=0; }
    else S.current=clamp(i,0,S.project.steps.length-1);
    S.cable=0; S.editCable=-1; S.sel=-1;
    S.render();
  };
  S.render=function(){ renderSteps(S); renderFiche(S); renderCanvas(S); renderNav(S); if(S.afterRender) S.afterRender(S); };
  return S;
}
function renderNav(S){
  var n=S.project.steps.length;
  q('#nav-pos').innerHTML = n? '<b>'+(S.current+1)+'</b> / '+n : '—';
  q('#nav-prev').disabled = S.current<=0;
  q('#nav-next').disabled = S.current>=n-1;
  var t=S.project.title||'Cheminement de câbles';
  q('#hd-title').textContent=t;
  var P=S.project, r=P.release||{};
  var bits=[]; if(P.ref) bits.push(P.ref);
  if(P.revision) bits.push('Ind. '+P.revision);
  if(r.hard) bits.push('Version Hard '+r.hard);
  if(r.trigram) bits.push(r.trigram);
  if(r.date||P.date) bits.push(r.date||P.date);
  if(P.author) bits.push(P.author);
  q('#hd-sub').textContent=bits.join('  ·  ');
  var ph=q('#print-head');
  if(ph) ph.innerHTML='<h1>'+esc(t)+'</h1><div>'+esc(bits.join('  ·  '))+'</div>';
  document.title = t + (S.project.ref? ' — '+S.project.ref : '');
}
function fitView(S){
  var d=imgDims(curImage(S));
  S.view={x:0,y:0,w:d.w,h:d.h};
  applyView(S);
}
function bindViewport(S){
  var svg=q('#svg'), wrap=q('#stage-wrap');
  function toImg(ev){
    var r=svg.getBoundingClientRect();
    var vb=S.view, sc=Math.min(r.width/vb.w, r.height/vb.h);
    var ox=(r.width - vb.w*sc)/2, oy=(r.height - vb.h*sc)/2;
    return { x: (ev.clientX-r.left-ox)/sc + vb.x, y: (ev.clientY-r.top-oy)/sc + vb.y };
  }
  S.toImg=toImg;
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var p=toImg(e), f=e.deltaY>0?1.15:1/1.15;
    var nw=clamp(S.view.w*f, 40, imgDims(curImage(S)).w*6);
    var ratio=nw/S.view.w;
    S.view={ x:p.x-(p.x-S.view.x)*ratio, y:p.y-(p.y-S.view.y)*ratio, w:nw, h:S.view.h*ratio };
    applyView(S);
  },{passive:false});
  var pan=null;
  svg.addEventListener('mousedown',function(e){
    var wantPan = e.button===1 || (e.button===0 && (e.shiftKey||S.spaceDown||S.tool==='pan'));
    if(!wantPan) return;
    e.preventDefault(); svg.classList.add('panning');
    pan={sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};
  });
  window.addEventListener('mousemove',function(e){
    if(!pan) return;
    var r=svg.getBoundingClientRect(), sc=Math.min(r.width/S.view.w,r.height/S.view.h);
    S.view.x=pan.vx-(e.clientX-pan.sx)/sc; S.view.y=pan.vy-(e.clientY-pan.sy)/sc;
    applyView(S);
  });
  window.addEventListener('mouseup',function(){ pan=null; svg.classList.remove('panning'); });
  window.addEventListener('resize',function(){ applyView(S); });
  q('#nav-prev').addEventListener('click',function(){ S.go(S.current-1); });
  q('#nav-next').addEventListener('click',function(){ S.go(S.current+1); });
  window.addEventListener('keydown',function(e){
    var t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
    if(e.code==='Space'){ S.spaceDown=true; svg.classList.add('pan'); }
    if(e.key==='ArrowLeft'){ S.go(S.current-1); }
    if(e.key==='ArrowRight'){ S.go(S.current+1); }
    if(e.key==='0'){ fitView(S); }
    if(e.key==='+'||e.key==='='){ zoomBy(S,1/1.25); }
    if(e.key==='-'){ zoomBy(S,1.25); }
    if(e.key==='g'||e.key==='G'){ cycleGhost(S); }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space'){ S.spaceDown=false; svg.classList.remove('pan'); }
  });
}
function zoomBy(S,f){
  var cx=S.view.x+S.view.w/2, cy=S.view.y+S.view.h/2;
  var nw=clamp(S.view.w*f,40,imgDims(curImage(S)).w*6), r=nw/S.view.w;
  S.view={x:cx-S.view.w*r/2, y:cy-S.view.h*r/2, w:nw, h:S.view.h*r};
  applyView(S);
}
function cycleGhost(S){
  var o=['none','prev','all'], i=o.indexOf(S.project.settings.ghost);
  S.project.settings.ghost=o[(i+1)%3];
  qa('#ghost-seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.g===S.project.settings.ghost); });
  renderCanvas(S);
}
function ghostSeg(S){
  return '<span class="lbl">Étapes précédentes</span>'+
    '<span class="seg" id="ghost-seg">'+
      '<button data-g="none"'+(S.project.settings.ghost==='none'?' class="on"':'')+'>Masquées</button>'+
      '<button data-g="prev"'+(S.project.settings.ghost==='prev'?' class="on"':'')+'>Précédente</button>'+
      '<button data-g="all"'+(S.project.settings.ghost==='all'?' class="on"':'')+'>Toutes</button>'+
    '</span>';
}
function bindGhostSeg(S){
  qa('#ghost-seg button').forEach(function(b){
    b.addEventListener('click',function(){
      S.project.settings.ghost=b.dataset.g;
      qa('#ghost-seg button').forEach(function(x){ x.classList.toggle('on',x===b); });
      renderCanvas(S);
    });
  });
}
function zoomBtns(){
  return '<button class="btn sm" id="z-fit" title="Ajuster la vue (0)">Ajuster</button>';
}
function bindZoomBtns(S){
  var b=q('#z-fit');
  if(b) b.addEventListener('click',function(){ fitView(S); });
}
function applyTheme(P){
  document.body.classList.toggle('theme-dark', P.settings.theme==='sombre');
}
function themeBtn(){
  return '<button class="btn icon" id="t-theme" title="Fond clair / fond sombre">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>';
}
function bindThemeBtn(S,after){
  var b=q('#t-theme'); if(!b) return;
  b.addEventListener('click',function(){
    S.project.settings.theme = S.project.settings.theme==='sombre' ? 'clair' : 'sombre';
    applyTheme(S.project); renderCanvas(S); if(after) after();
  });
}
/* Bandeau d'attente : lire et décoder un plan en 8K prend plusieurs secondes,
   il faut le dire. Renvoie la fonction qui le retire. */
function toastHost(){
  var h=q('.toasts');
  if(!h){ h=document.createElement('div'); h.className='toasts'; document.body.appendChild(h); }
  return h;
}
function working(msg){
  var t=document.createElement('div');
  t.className='toast work';
  t.innerHTML='<span class="spin"></span>'+esc(msg);
  toastHost().appendChild(t);
  return function(){ t.remove(); };
}
function toast(msg,err){
  var t=document.createElement('div');
  t.className='toast'+(err?' err':''); t.textContent=msg;
  toastHost().appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); },320); },2200);
}

/* ------------------------------------------------------- boot opérateur */
function bootViewer(project){
  document.body.classList.add('viewer');
  var S=makeState(project,false);
  window.S=S;
  buildLayout(q('#root'));
  applyTheme(project);
  q('#top-actions').innerHTML= themeBtn()+
    '<button class="btn" id="op-print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg> Imprimer</button>'+
    '<button class="btn" id="op-reset" title="Décocher toutes les étapes">Réinitialiser le suivi</button>';
  q('#stage-bar').innerHTML = '<div style="flex:1"></div>'+ghostSeg(S)+
    '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+zoomBtns();
  bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindThemeBtn(S);

  /* Le suivi de câblage ne vit que le temps de la session : rien n'est
     écrit sur le poste. La fermeture est donc confirmée si des cases
     ont été cochées. */
  S.done={};
  S.saveDone=function(){};
  window.addEventListener('beforeunload',function(e){
    for(var k in S.done){ if(S.done[k]){ e.preventDefault(); e.returnValue=''; return ''; } }
  });
  q('#op-print').addEventListener('click',function(){ window.print(); });
  q('#op-reset').addEventListener('click',function(){
    if(confirm('Décocher toutes les étapes ?')){ S.done={}; S.render(); }
  });
  fitView(S); S.go(0);
}
</script>

<!-- =====================================================================
     EDITEUR (jamais exporté)
     ================================================================== -->
<script id="editor-js">
(function(){
  var S=null;
  var dirty=false;          /* modifications non enregistrées */

  /* ------------------------------------------------------------- démarrage */
  function boot(){
    var p=emptyProject();
    S=makeState(p,true);
    window.S=S;
    S.tool='select'; S.sel=-1; S.cable=0; S.editCable=-1;
    S.elbow='h'; S.snap=10; S.magnet=true;   /* aimantation et grille toujours actives */
    applyTheme(S.project);
    buildLayout(q('#root'));
    topbar(); stagebar(); leftfoot();
    bindGhostSeg(S); bindZoomBtns(S); bindViewport(S); bindStage();
    S.overlay=overlay;
    S.onStepsRendered=bindDnd;
    S.afterRender=function(){ hint(); };
    fitView(S);
    if(!S.project.steps.length) addStep();
    else S.render();
  }
  function migrate(o){
    var d=emptyProject();
    o.settings=Object.assign({},d.settings,o.settings||{});
    o.marks=o.marks||[]; o.steps=o.steps||[]; o.images=o.images||[];
    o.release=Object.assign({trigram:'',hard:'',date:''},o.release||{});
    /* projets antérieurs à la collection de plans : un seul schéma */
    if(o.image){
      o.images=[{id:uid(),name:'Schéma',data:o.image,w:o.imgW||DEF_W,h:o.imgH||DEF_H}];
      delete o.image; delete o.imgW; delete o.imgH;
    }
    var first=o.images[0]?o.images[0].id:'';
    o.steps.forEach(function(st){
      st.id=st.id||uid(); st.group=st.group||'';
      /* projets antérieurs : une étape portait un seul fil */
      if(!st.cables){
        var w=st.wire||{};
        st.cables=[{ id:uid(), num:w.num||'', color:w.color||'noir',
                     from:w.from||'', to:w.to||'', path:st.path||[] }];
      }
      delete st.wire; delete st.path;
      st.cables.forEach(function(c){
        c.id=c.id||uid(); c.path=c.path||[]; c.color=c.color||'noir';
        delete c.section; delete c.length; delete c.comment;
      });
      if(!st.cables.length) st.cables=[emptyCable()];
      if(!imageById(o,st.img)) st.img=first;
    });
    o.marks.forEach(function(m){ if(!imageById(o,m.img)) m.img=first; });
    return Object.assign(d,o);
  }

  /* ------------------------------------------------------------------------
     Rien n'est écrit sur le poste : l'enregistrement du projet est un geste
     explicite. On se contente de signaler l'état et de confirmer la sortie. */
  function touch(){
    if(!dirty){ dirty=true; flagDirty(); }
  }
  function clean(){ dirty=false; flagDirty(); }
  function flagDirty(){
    var f=q('#dirty'); if(!f) return;
    f.style.display = dirty ? 'inline-flex' : 'none';
    var b=q('#t-save'); if(b) b.classList.toggle('primary', dirty);
  }
  window.addEventListener('beforeunload',function(e){
    if(dirty){ e.preventDefault(); e.returnValue=''; return ''; }
  });

  /* ---------------------------------------------------------- barre haute */
  function topbar(){
    q('#top-actions').innerHTML=
      '<span id="dirty" class="tag warn" style="display:none">● non enregistré</span>'+themeBtn()+
      '<button class="btn icon" id="t-doc" title="Plans et réglages du tracé"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg></button>'+
      '<button class="btn" id="t-open">Ouvrir</button>'+
      '<button class="btn" id="t-save">Enregistrer</button>'+
      '<button class="btn primary" id="t-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 20h16"/></svg> Exporter pour l\'opérateur</button>'+
      '<input type="file" id="f-img" accept="image/*" multiple hidden><input type="file" id="f-json" accept=".json,application/json" hidden>';
    bindThemeBtn(S,touch);
    flagDirty();
    q('#f-img').addEventListener('change',onImage);
    q('#f-json').addEventListener('change',onOpen);
    q('#t-doc').addEventListener('click',dlgDoc);
    q('#t-open').addEventListener('click',function(){ q('#f-json').click(); });
    q('#t-save').addEventListener('click',saveJson);
    q('#t-export').addEventListener('click',dlgExport);
  }

  /* ---------------------------------------------------------- barre basse */
  function stagebar(){
    q('#stage-bar').innerHTML=
      '<span class="seg" id="tool-seg">'+
        '<button data-t="draw">Tracer le fil</button>'+
        '<button data-t="select">Modifier</button>'+
        '<button data-t="mark">Repère</button>'+
      '</span>'+
      '<div style="flex:1"></div>'+
      ghostSeg(S)+
      '<span style="width:1px;height:22px;background:var(--line-2);margin:0 6px"></span>'+
      '<button class="btn sm" id="z-fit">Ajuster</button>';
    qa('#tool-seg button').forEach(function(b){
      b.addEventListener('click',function(){ setTool(b.dataset.t); });
    });
    syncSeg();
  }

  function syncSeg(){
    qa('#tool-seg button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===S.tool); });
  }
  function setTool(t){
    S.tool=t; S.sel=-1; syncSeg();
    var svg=q('#svg');
    svg.classList.toggle('draw', t==='draw'||t==='mark');
    svg.classList.toggle('pan', t==='pan');
    hint(); renderCanvas(S);
  }
  function hint(){
    var h=q('#hint');
    var txt='';
    if(S.tool==='draw'){
      var c0=curCable(S);
      txt='Tracé de <b>'+esc(c0?cableLabel(c0,S.cable):'—')+'</b> · <b>Clic</b> = poser un point · '+
          '<kbd>Tab</kbd> inverser le coude · <kbd>Retour arr.</kbd> annuler le dernier · <kbd>Échap</kbd> tout effacer';
    }else if(S.tool==='mark'){
      txt='<b>Clic</b> = poser un repère (X1, Wago A, Flexisoft…) · <kbd>Échap</kbd> pour sortir';
    }else if(S.tool==='select'){
      var c1=curCable(S);
      if(c1 && c1.path.length) txt='<b>Glisser</b> un point pour le déplacer · <b>Clic droit</b> = supprimer · <b>Double-clic</b> sur un coude = inverser';
    }
    h.innerHTML=txt; h.style.display= txt?'block':'none';
  }

  /* --------------------------------------------------------- bas de liste */
  function leftfoot(){
    q('#left-foot').innerHTML=
      '<div style="padding:9px;border-top:1px solid var(--line);display:flex;gap:6px">'+
        '<button class="btn primary sm" id="s-add" style="flex:1">+ Étape</button>'+
        '<button class="btn sm" id="s-dup" title="Dupliquer l\'étape">⧉</button>'+
        '<button class="btn sm danger" id="s-del" title="Supprimer l\'étape">🗑</button>'+
      '</div>';
    q('#s-add').addEventListener('click',function(){ addStep(); });
    q('#s-dup').addEventListener('click',dupStep);
    q('#s-del').addEventListener('click',delStep);
  }
  function addStep(){
    var P=S.project, prev=P.steps[P.steps.length-1];
    var st=emptyStep(P.steps.length+1);
    if(prev && prev.cables.length){ st.group=prev.group; st.cables[0].color=prev.cables[prev.cables.length-1].color; }
    P.steps.push(st); touch(); S.go(P.steps.length-1); setTool('draw');
  }
  function dupStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    var c=JSON.parse(JSON.stringify(st)); c.id=uid(); c.name=st.name+' (copie)';
    P.steps.splice(S.current+1,0,c); touch(); S.go(S.current+1);
  }
  function delStep(){
    var P=S.project, st=P.steps[S.current]; if(!st) return;
    if(!confirm('Supprimer « '+(st.name||'cette étape')+' » ?')) return;
    P.steps.splice(S.current,1); touch(); S.go(Math.min(S.current,P.steps.length-1));
  }

  /* ------------------------------------------------ réordonnancement (DnD) */
  function bindDnd(){
    var dragI=-1;
    qa('#step-list .step').forEach(function(elm){
      elm.addEventListener('dragstart',function(e){
        dragI=parseInt(elm.dataset.i,10); elm.classList.add('dragging');
        e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(dragI)); }catch(x){}
      });
      elm.addEventListener('dragend',function(){
        elm.classList.remove('dragging');
        qa('#step-list .step').forEach(function(x){ x.classList.remove('drop-before','drop-after'); });
      });
      elm.addEventListener('dragover',function(e){
        e.preventDefault();
        var r=elm.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
        elm.classList.toggle('drop-after',after); elm.classList.toggle('drop-before',!after);
      });
      elm.addEventListener('dragleave',function(){ elm.classList.remove('drop-before','drop-after'); });
      elm.addEventListener('drop',function(e){
        e.preventDefault();
        var to=parseInt(elm.dataset.i,10);
        var r=elm.getBoundingClientRect(); if((e.clientY-r.top)>r.height/2) to++;
        if(dragI<0||dragI===to) return;
        var P=S.project, moved=P.steps[dragI];
        P.steps.splice(dragI,1);
        if(dragI<to) to--;
        P.steps.splice(to,0,moved); touch();
        S.go(P.steps.indexOf(moved));
      });
    });
  }

  /* ----------------------------------------------------- fiche éditable */
  window.editorFiche=function(S){
    var P=S.project, st=P.steps[S.current], host=q('#fiche');
    if(!st){ host.innerHTML='<div class="empty">Aucune étape.<br>Cliquez sur <b>+ Étape</b>.</div>'; return; }
    if(!(S.cable>=0)) S.cable=0;
    S.cable=clamp(S.cable,0,Math.max(0,st.cables.length-1));

    var cards = st.cables.map(function(c,i){
      if(i===S.editCable) return cableForm(c,i);
      return cableCard(c,i,{ sel:i===S.cable,
        right:'<span class="cab-n'+(c.path.length<2?' vide':'')+'">'+
              (c.path.length<2?'à tracer':c.path.length+' pts')+'</span>' });
    }).join('');

    host.innerHTML=
    '<div class="fiche">'+
      '<div class="cabs-head"><span>Câbles de l\'étape</span>'+
        '<button class="btn sm" id="c-add">+ Câble</button></div>'+
      cards+
      '<div style="font-size:11.5px;color:var(--tx-3);margin:2px 2px 0">'+
        'Clic = sélectionner · clic droit = modifier, retracer, supprimer</div>'+

      '<details class="acc" data-acc="etp"'+(S.open.etp?' open':'')+' style="margin-top:14px"><summary>Étape'+
        '<span class="peek">'+esc(st.name||'—')+'</span></summary><div class="accb">'+
        '<div class="field"><label>Intitulé</label><input class="inp" id="e-name" value="'+esc(st.name)+'"></div>'+
        '<div class="field"><label>Connecteur / groupe</label><input class="inp" id="e-group" list="grp-list" value="'+esc(st.group)+'" placeholder="X1 — Flexisoft"><datalist id="grp-list">'+groupOpts()+'</datalist></div>'+
        '<div class="field"><label>Plan</label><div class="sw-row">'+
          '<select class="inp" id="e-img">'+(P.images||[]).map(function(im){
            return '<option value="'+im.id+'"'+(im.id===st.img?' selected':'')+'>'+esc(im.name)+'</option>';
          }).join('')+(P.images.length?'':'<option value="">aucun plan</option>')+'</select>'+
          '<button class="btn" id="e-img-add" title="Importer un plan et l\'affecter à cette étape">+</button>'+
        '</div>'+
        (P.steps.length>1 ? '<div class="sw-row" style="margin-top:6px;gap:6px">'+
          '<span style="font-size:11.5px;color:var(--tx-3)">Appliquer à</span>'+
          (st.group?'<button class="btn sm" id="e-img-grp">ce groupe</button>':'')+
          '<button class="btn sm" id="e-img-all">toutes les étapes</button>'+
        '</div>' : '')+
        '</div>'+
      '</div></details>'+
    '</div>';

    qa('.acc[data-acc]',host).forEach(function(a){ bindAcc(a,a.dataset.acc,S); });

    /* --- cartes : sélection, clic droit, édition en place --- */
    qa('.cab',host).forEach(function(el){
      if(el.dataset.form!==undefined) return;   /* carte en cours d'édition */
      var i=parseInt(el.dataset.ci,10);
      el.addEventListener('click',function(){ S.cable=i; S.editCable=-1; renderFiche(S); renderCanvas(S); });
      el.addEventListener('contextmenu',function(e){
        e.preventDefault(); S.cable=i; cableMenu(e.clientX,e.clientY,i);
      });
    });
    qa('[data-editdone]',host).forEach(function(b){
      b.addEventListener('click',function(){ S.editCable=-1; renderFiche(S); });
    });
    bindCableForm(st);

    q('#c-add').addEventListener('click',function(){
      var c=emptyCable(), prev=st.cables[st.cables.length-1];
      if(prev) c.color=prev.color;
      st.cables.push(c); S.cable=st.cables.length-1; S.editCable=S.cable;
      touch(); renderFiche(S); renderSteps(S);
    });

    function bindF(id,fn){
      var e=q(id); if(!e) return;
      e.addEventListener('input',function(){ fn(e.value); touch(); renderSteps(S); renderCanvas(S); });
    }
    bindF('#e-name',function(v){ st.name=v; });
    bindF('#e-group',function(v){ st.group=v; });
    var ei=q('#e-img');
    if(ei) ei.addEventListener('change',function(){
      if(st.img===this.value) return;
      var traces=st.cables.filter(function(c){ return c.path.length; }).length;
      if(traces && !confirm('Changer de plan efface le tracé de '+traces+' câble(s). Continuer ?')){
        this.value=st.img; return;
      }
      st.img=this.value; st.cables.forEach(function(c){ c.path=[]; });
      touch(); S.viewImg=null; S.render();
    });
    var ea=q('#e-img-add');
    if(ea) ea.addEventListener('click',function(){ pickImage({assign:true}); });
    bindApply('#e-img-grp',function(o){ return o.group===st.group; });
    bindApply('#e-img-all',function(){ return true; });

    /* Affecte le plan de l'étape courante à un ensemble d'étapes. Seules
       celles qui changent effectivement de plan perdent leurs tracés. */
    function bindApply(sel,match){
      var b=q(sel); if(!b) return;
      b.addEventListener('click',function(){
        var cibles=P.steps.filter(function(o){ return o!==st && match(o) && o.img!==st.img; });
        if(!cibles.length){ toast('Ces étapes utilisent déjà ce plan.'); return; }
        var perdus=0;
        cibles.forEach(function(o){ o.cables.forEach(function(c){ if(c.path.length) perdus++; }); });
        if(!confirm(cibles.length+' étape(s) passeront sur le plan « '+
            ((imageById(P,st.img)||{}).name||'—')+' ».'+
            (perdus?'\n\n'+perdus+' tracé(s) seront effacés.':''))) return;
        cibles.forEach(function(o){ o.img=st.img; o.cables.forEach(function(c){ c.path=[]; }); });
        touch(); S.render();
        toast(cibles.length+' étape(s) rattachées à ce plan');
      });
    }
  };

  /* Carte dépliée en formulaire : repère, couleur, origine, extrémité. */
  function cableForm(c,i){
    var opts=WIRE_COLORS.map(function(o){
      return '<option value="'+o.id+'"'+(o.id===c.color?' selected':'')+'>'+o.name+'</option>';
    }).join('');
    return '<div class="cab on" style="display:block;cursor:default" data-form="'+i+'">'+
      '<div class="row" style="margin-bottom:8px">'+
        '<div class="field" style="margin:0"><label>N° de fil</label><input class="inp" id="f-num" value="'+esc(c.num)+'" placeholder="142"></div>'+
        '<div class="field" style="margin:0"><label>Couleur</label><select class="inp" id="f-col">'+opts+'</select></div>'+
      '</div>'+
      '<div class="row" style="margin-bottom:8px">'+
        '<div class="field" style="margin:0"><label>Origine</label><input class="inp" id="f-from" value="'+esc(c.from)+'" placeholder="X1:3"></div>'+
        '<div class="field" style="margin:0"><label>Extrémité</label><input class="inp" id="f-to" value="'+esc(c.to)+'" placeholder="Wago A:2"></div>'+
      '</div>'+
      '<div class="sw-row" style="justify-content:flex-end"><button class="btn sm primary" data-editdone="1">Terminé</button></div>'+
    '</div>';
  }
  function bindCableForm(st){
    var c=st.cables[S.editCable]; if(!c) return;
    function bind(id,fn){
      var e=q(id); if(!e) return;
      e.addEventListener('input',function(){ fn(e.value); touch(); renderSteps(S); renderCanvas(S); });
    }
    bind('#f-num',function(v){ c.num=v; });
    bind('#f-from',function(v){ c.from=v; });
    bind('#f-to',function(v){ c.to=v; });
    var col=q('#f-col');
    if(col) col.addEventListener('change',function(){
      c.color=this.value; touch(); renderSteps(S); renderCanvas(S); renderFiche(S);
    });
  }

  /* Menu contextuel d'un câble. */
  function cableMenu(x,y,i){
    var st=curStep(S); if(!st) return;
    var c=st.cables[i];
    menu(x,y,[
      { t:'Modifier', f:function(){ S.editCable=i; renderFiche(S); } },
      { t:(c.path.length?'Retracer':'Tracer'), f:function(){
          c.path=[]; S.cable=i; S.editCable=-1; touch(); renderFiche(S); setTool('draw'); } },
      { t:'Dupliquer', f:function(){
          var d=JSON.parse(JSON.stringify(c)); d.id=uid(); d.path=[];
          st.cables.splice(i+1,0,d); S.cable=i+1; S.editCable=i+1;
          touch(); renderFiche(S); renderSteps(S); } },
      null,
      { t:'Supprimer', danger:true, f:function(){
          if(st.cables.length<2){ toast('Une étape garde au moins un câble.',true); return; }
          st.cables.splice(i,1); S.cable=Math.max(0,i-1); S.editCable=-1;
          touch(); S.render(); } }
    ]);
  }
  function menu(x,y,items){
    var old=q('.ctx'); if(old) old.remove();
    var m=document.createElement('div');
    m.className='ctx';
    m.innerHTML=items.map(function(it){
      return it ? '<button'+(it.danger?' class="danger"':'')+'>'+esc(it.t)+'</button>' : '<hr>';
    }).join('');
    document.body.appendChild(m);
    var r=m.getBoundingClientRect();
    m.style.left=Math.min(x,innerWidth-r.width-8)+'px';
    m.style.top=Math.min(y,innerHeight-r.height-8)+'px';
    var bs=qa('button',m), k=0;
    items.forEach(function(it){ if(it){ bs[k++].addEventListener('click',function(){ m.remove(); it.f(); }); } });
    /* Le mousedown sur une entrée précède son click : ignorer ceux qui
       viennent du menu, sinon il disparaît avant d'avoir agi. */
    setTimeout(function(){
      window.addEventListener('mousedown',function h(e){
        if(m.contains(e.target)) return;
        m.remove(); window.removeEventListener('mousedown',h);
      });
    },0);
  }

  function groupOpts(){
    var seen={}, o='';
    S.project.steps.forEach(function(s){ if(s.group && !seen[s.group]){ seen[s.group]=1; o+='<option value="'+esc(s.group)+'">'; } });
    return o;
  }

  /* ------------------------------------------------------- calque d'édition */
  /* Le calque d'édition n'est pas du dessin : ses poignées gardent une taille
     constante à l'écran, sinon elles deviennent énormes dès qu'on zoome. */
  function screenUnit(S){
    var svg=q('#svg'); if(!svg||!S.view) return 1;
    var cw=svg.clientWidth||1000, ch=svg.clientHeight||700;
    return 1/Math.min(cw/S.view.w, ch/S.view.h);
  }
  function overlay(S){
    var c=curCable(S); if(!c) return '';
    var k=screenUnit(S), r=6*k;          /* ≈ 6 px à l'écran, quel que soit le zoom */
    var col=colorOf(c.color), s='';

    /* aperçu du prochain segment */
    if(S.tool==='draw' && c.path.length && S.mouse){
      var a=c.path[c.path.length-1], b={x:S.mouse.x,y:S.mouse.y,elbow:S.elbow};
      s+='<path d="'+pathD([a,b])+'" fill="none" stroke="'+col.hex+'" stroke-opacity=".55" stroke-width="'+wireWidth(S.project)+'" stroke-dasharray="'+(9*k)+' '+(7*k)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="'+(r*.9)+'" fill="none" stroke="'+ink(S.project).lblTx+'" stroke-opacity=".8" stroke-width="'+(1.5*k)+'"/>';
    }
    if(S.tool==='select'||S.tool==='draw'){
      c.path.forEach(function(p,i){
        var sel = i===S.sel;
        s+='<circle class="handle" data-pi="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" '+
           'fill="'+(sel?'#1a63d6':ink(S.project).lblBg)+'" stroke="'+ink(S.project).lblTx+'" stroke-width="'+(1.5*k)+'" style="cursor:move"/>';
      });
      for(var i=1;i<c.path.length;i++){
        var A=c.path[i-1], B=c.path[i];
        if(A.x!==B.x && A.y!==B.y){
          var e=(B.elbow||'h')==='h'?{x:B.x,y:A.y}:{x:A.x,y:B.y};
          s+='<rect class="elbow" data-ei="'+i+'" x="'+(e.x-r*.72)+'" y="'+(e.y-r*.72)+'" width="'+(r*1.44)+'" height="'+(r*1.44)+'" rx="'+(r*.3)+'" fill="'+ink(S.project).markBg+'" stroke="#1a63d6" stroke-width="'+(1.4*k)+'" style="cursor:pointer"/>';
        }
      }
    }
    return s;
  }

  /* ------------------------------------------------------ interactions SVG */
  function bindStage(){
    var svg=q('#svg');
    var drag=null;

    function snap(p){
      var P=S.project, dim=imgDims(curImage(S));
      p.x=clamp(p.x,0,dim.w); p.y=clamp(p.y,0,dim.h);
      if(S.magnet){
        var best=null,bd=14*(S.view.w/(svg.clientWidth||1000));
        var im=curImage(S);
        P.steps.forEach(function(st){
          if(stepImage(P,st)!==im) return;
          st.cables.forEach(function(c){
            c.path.forEach(function(q2){
              var d=Math.hypot(q2.x-p.x,q2.y-p.y);
              if(d<bd){ bd=d; best={x:q2.x,y:q2.y}; }
            });
          });
        });
        if(best) return best;
      }
      if(S.snap>0){
        var g=Math.max(2,Math.round(docUnit(curImage(S))/2));
        p.x=Math.round(p.x/g)*g; p.y=Math.round(p.y/g)*g;
      }
      return p;
    }

    svg.addEventListener('mousemove',function(e){
      S.mouse=snap(S.toImg(e));
      if(drag){
        var c=curCable(S);
        if(c){ c.path[drag.i].x=S.mouse.x; c.path[drag.i].y=S.mouse.y; renderCanvas(S); }
        return;
      }
      if(S.tool==='draw') renderOverlay(S);
    });
    svg.addEventListener('mouseleave',function(){ S.mouse=null; if(S.tool==='draw') renderOverlay(S); });

    svg.addEventListener('mousedown',function(e){
      if(e.button!==0 || e.shiftKey || S.spaceDown || S.tool==='pan') return;
      var t=e.target;
      if(t.classList && t.classList.contains('handle')){
        e.preventDefault();
        S.sel=parseInt(t.dataset.pi,10); drag={i:S.sel}; renderCanvas(S); return;
      }
      if(t.classList && t.classList.contains('elbow')) return;   /* géré au dblclick */
      var c=curCable(S);
      var p=snap(S.toImg(e));
      if(S.tool==='draw'){
        if(!c){ toast('Créez d\'abord une étape.',true); return; }
        c.path.push({x:p.x,y:p.y,elbow:S.elbow});
        renderCanvas(S); renderFiche(S); touch();
      }else if(S.tool==='mark'){
        var txt=prompt('Texte du repère (ex. X1, Wago A, Flexisoft M1) :','');
        if(txt){
          var im=curImage(S);
          S.project.marks.push({id:uid(),img:im?im.id:'',x:p.x,y:p.y,text:txt});
          renderCanvas(S); touch();
        }
      }else{
        S.sel=-1; renderCanvas(S);
      }
    });
    window.addEventListener('mouseup',function(){
      if(drag){ drag=null; renderFiche(S); touch(); }
    });

    svg.addEventListener('dblclick',function(e){
      var t=e.target, c=curCable(S); if(!c) return;
      if(t.classList && t.classList.contains('elbow')){
        var i=parseInt(t.dataset.ei,10);
        c.path[i].elbow = (c.path[i].elbow||'h')==='h' ? 'v':'h';
        renderCanvas(S); touch();
      }
    });
    svg.addEventListener('contextmenu',function(e){
      var t=e.target, c=curCable(S);
      if(t.classList && t.classList.contains('handle') && c){
        e.preventDefault();
        c.path.splice(parseInt(t.dataset.pi,10),1);
        S.sel=-1; renderCanvas(S); renderFiche(S); touch(); return;
      }
      if(t.getAttribute && t.parentNode && t.parentNode.dataset && t.parentNode.dataset.mark){
        e.preventDefault();
        var id=t.parentNode.dataset.mark;
        if(confirm('Supprimer ce repère ?')){
          S.project.marks=S.project.marks.filter(function(m){ return m.id!==id; });
          renderCanvas(S); touch();
        }
      }
    });

    window.addEventListener('keydown',function(e){
      var tag=e.target.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      var c=curCable(S);
      if(e.key==='Tab'){ e.preventDefault(); S.elbow=S.elbow==='h'?'v':'h'; syncSeg(); renderOverlay(S); }
      if(e.key==='Escape'){
        /* on repart de zéro sur ce câble */
        if(c && c.path.length){ c.path=[]; S.sel=-1; touch(); renderCanvas(S); renderFiche(S); }
        else setTool('select');
      }
      if(e.key==='Backspace' && S.tool==='draw' && c && c.path.length){
        e.preventDefault(); c.path.pop(); renderCanvas(S); renderFiche(S); touch();
      }
      if(e.key==='Delete' && S.sel>=0 && c){
        c.path.splice(S.sel,1); S.sel=-1; renderCanvas(S); renderFiche(S); touch();
      }
      if(e.key==='d'||e.key==='D'){ setTool('draw'); }
      if(e.key==='v'||e.key==='V'){ setTool('select'); }
      if(e.key==='n'||e.key==='N'){ addStep(); }
    });
  }

  /* ------------------------------------------------------------- schéma */
  /* Un plan importé rejoint la bibliothèque sans rien demander. S'il est
     demandé depuis une étape, il lui est en plus affecté ; au tout premier
     import, les étapes encore sans plan l'adoptent. */
  function onImage(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    var assign = e.target.dataset.assign==='1', back = e.target.dataset.back==='1';
    e.target.dataset.assign=''; e.target.dataset.back=''; e.target.value='';
    if(!files.length) return;
    var busy=working('Chargement '+(files.length>1?'de '+files.length+' plans':'du plan')+'…');
    var added=[];
    (function next(){
      var f=files.shift();
      if(!f) return done();
      readImage(f,function(im){
        if(!im) return next();
        var P=S.project, first=!P.images.length;
        P.images.push(im); added.push(im);
        /* L'épaisseur est exprimée en unités du schéma : sur un plan en 8K,
           la valeur par défaut serait un cheveu. On la cale sur la taille du
           premier plan, tant que l'utilisateur n'y a pas touché. */
        if(first && P.settings.thickAuto) P.settings.thickness=Math.max(3,Math.round(im.w/200));
        if(assign && P.steps[S.current]) P.steps[S.current].img=im.id;
        if(first) P.steps.forEach(function(st){ if(!st.img) st.img=im.id; });
        next();
      });
    })();
    function done(){
      busy();
      if(!added.length) return;
      touch(); S.render();
      var m=q('.mask'); if(m){ m.remove(); if(back) dlgDoc(); }
      var last=added[added.length-1];
      toast(added.length===1
        ? 'Plan « '+last.name+' » ajouté ('+last.w+' × '+last.h+' px)'
        : added.length+' plans ajoutés');
    }
  }
  /* Le fichier est repris tel quel : un plan en 8K est chargé sans être
     réduit ni ré-encodé, sa définition étant précisément ce qui permet de
     zoomer sur un bornier. */
  function readImage(f,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        cb({ id:uid(), name:cleanName(f.name), data:rd.result,
             w:img.naturalWidth, h:img.naturalHeight });
      };
      img.onerror=function(){ toast('« '+f.name+' » : image illisible.',true); cb(null); };
      img.src=rd.result;
    };
    rd.onerror=function(){ cb(null); };
    rd.readAsDataURL(f);
  }
  function koMo(n){
    n=n*0.75;   /* le base64 pèse un tiers de plus que les octets */
    return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' Mo'
                     : Math.round(n/1024)+' Ko';
  }
  function cleanName(n){
    return String(n||'Plan').replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').slice(0,40) || 'Plan';
  }
  function pickImage(opt){
    var i=q('#f-img');
    i.dataset.assign = (opt&&opt.assign)?'1':'';
    i.dataset.back   = (opt&&opt.back)?'1':'';
    i.click();
  }
  function imageUsage(P,id){
    var n=0; P.steps.forEach(function(st){ if(st.img===id) n++; }); return n;
  }

  /* ------------------------------------------------------------ cartouche */
  function dlgDoc(){
    var P=S.project;
    var list = (P.images||[]).map(function(im){
      var used=imageUsage(P,im.id);
      return '<div class="imgrow" data-img="'+im.id+'">'+
        '<img src="'+im.data+'" alt="">'+
        '<div class="txt"><input class="inp nm" value="'+esc(im.name)+'" data-nm="'+im.id+'">'+
          '<div class="mt">'+im.w+' × '+im.h+' px · '+(used?used+' étape'+(used>1?'s':''):'inutilisé')+'</div></div>'+
        '<button class="btn icon sm danger" data-del="'+im.id+'" title="Retirer ce plan">🗑</button></div>';
    }).join('') || '<div class="empty" style="padding:14px">Aucun plan pour l\'instant.</div>';
    modal('Plans et réglages',
      '<div class="field"><label>Plans du projet</label>'+
        '<div class="imglist">'+list+'</div>'+
        '<button class="btn" id="d-img" style="margin-top:8px">+ Ajouter un plan</button></div>'+
      '<div class="field" style="margin-top:14px"><label>Épaisseur du tracé</label>'+
        '<input class="inp" id="i-th" type="number" min="1" max="400" value="'+(P.settings.thickness||6)+'"></div>'+
      '<label class="check'+(P.settings.labels?' on':'')+'" style="margin-top:0"><input type="checkbox" id="i-lab"'+(P.settings.labels?' checked':'')+'> <span>Afficher le n° de fil sur le tracé</span></label>',
      function(){
        P.settings.thickness=clamp(parseInt(q('#i-th').value,10)||6,1,400);
        P.settings.thickAuto=false;
        P.settings.labels=q('#i-lab').checked;
        touch(); S.render();
      },
      function(m){
        q('#d-img',m).addEventListener('click',function(){ pickImage({back:true}); });
        qa('[data-nm]',m).forEach(function(inp){
          inp.addEventListener('input',function(){
            var im=imageById(P,inp.dataset.nm); if(im){ im.name=inp.value; touch(); }
          });
        });
        qa('[data-del]',m).forEach(function(b){
          b.addEventListener('click',function(){
            var id=b.dataset.del, used=imageUsage(P,id), im=imageById(P,id);
            if(!confirm('Retirer le plan « '+(im?im.name:'')+' » ?'+
               (used?'\n\n'+used+' étape(s) l\'utilisent : leur tracé sera perdu.':''))) return;
            P.images=P.images.filter(function(x){ return x.id!==id; });
            P.marks=P.marks.filter(function(x){ return x.img!==id; });
            var fb=P.images[0]?P.images[0].id:'';
            P.steps.forEach(function(st){
              if(st.img===id){ st.img=fb; st.cables.forEach(function(c){ c.path=[]; }); }
            });
            touch(); S.viewImg=null; S.bgKey=null; S.render(); m.remove(); dlgDoc();
          });
        });
      });
  }
  function modal(title,body,ok,onOpen){
    var m=document.createElement('div');
    m.className='mask';
    m.innerHTML='<div class="modal"><header>'+esc(title)+'</header><div class="mbody">'+body+'</div>'+
      '<footer><button class="btn" data-x>Annuler</button><button class="btn primary" data-ok>Valider</button></footer></div>';
    document.body.appendChild(m);
    function close(){ m.remove(); }
    m.addEventListener('click',function(e){ if(e.target===m) close(); });
    q('[data-x]',m).addEventListener('click',close);
    q('[data-ok]',m).addEventListener('click',function(){
      if(ok && ok()===false) return;   /* refus : on garde la saisie à l'écran */
      close();
    });
    if(onOpen) onOpen(m);
  }

  /* ------------------------------------------------------ fichiers projet */
  function download(name,content,mime){
    var b=new Blob([content],{type:mime||'application/octet-stream'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },500);
  }
  function slug(s){
    return String(s||'cheminement').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'cheminement';
  }
  function saveJson(){
    download(slug(S.project.ref||S.project.title)+'.json', JSON.stringify(S.project,null,1),'application/json');
    clean();
    toast('Projet enregistré (.json)');
  }
  function onOpen(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(o.kind!=='cheminement-cables') throw new Error('format');
        S.project=migrate(o); S.current=0; S.done={}; S.viewImg=null; fitView(S); S.render(); clean();
        toast('Projet chargé : '+(o.title||''));
      }catch(x){ toast('Fichier projet invalide.',true); }
    };
    rd.readAsText(f); e.target.value='';
  }

  /* ---------------------------------------------------- export opérateur */
  /* L'export est la remise d'un document daté et identifié : on renseigne
     son cartouche avant de le produire. */
  function dlgExport(){
    var P=S.project;
    if(!P.steps.length){ toast('Aucune étape à exporter.',true); return; }
    var r=P.release||(P.release={trigram:'',hard:'',date:''});
    modal('Exporter pour l\'opérateur',
      '<div class="field"><label>Titre du document</label><input class="inp" id="x-title" value="'+esc(P.title)+'"></div>'+
      '<div class="field"><label>Référence / affaire</label><input class="inp" id="x-ref" value="'+esc(P.ref)+'" placeholder="facultatif"></div>'+
      '<div class="row">'+
        '<div class="field"><label>Trigramme</label><input class="inp" id="x-trg" value="'+esc(r.trigram)+'" maxlength="8" placeholder="ABC"></div>'+
        '<div class="field"><label>Version Hard</label><input class="inp" id="x-hard" value="'+esc(r.hard)+'" placeholder="B2"></div>'+
      '</div>'+
      '<div class="field"><label>Date</label><input class="inp" id="x-date" value="'+esc(r.date||today())+'" placeholder="JJ/MM/AAAA"></div>'+
      '<div class="note" style="margin-top:4px"><div class="k">Cartouche</div>'+
        'Ces informations sont celles que l\'opérateur verra en tête du document, à l\'écran comme à l\'impression.'+
        '<br><br>Poids estimé du fichier : <b>'+koMo(weightEstimate(P))+'</b>.</div>',
      function(){
        P.title=q('#x-title').value.trim()||'Cheminement de câbles';
        P.ref=q('#x-ref').value.trim();
        r.trigram=q('#x-trg').value.trim();
        r.hard=q('#x-hard').value.trim();
        r.date=q('#x-date').value.trim()||today();
        if(!r.trigram || !r.hard){ toast('Trigramme et version Hard sont nécessaires.',true); return false; }
        touch(); renderNav(S); exportViewer();
      });
  }
  /* Les plans sont embarqués en base64 : leur poids fait celui du document. */
  function weightEstimate(P){
    var n=60*1024;
    (P.images||[]).forEach(function(im){ n+=im.data.length; });
    return n;
  }
  function today(){
    var d=new Date(), p2=function(n){ return (n<10?'0':'')+n; };
    return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
  }
  function exportViewer(){
    var P=S.project;
    if(!P.steps.length){ toast('Aucune étape à exporter.',true); return; }
    var css=document.getElementById('app-css').textContent;
    var js=document.getElementById('viewer-js').textContent;
    var data=JSON.stringify(P).replace(/<\//g,'<\\/').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    var head=esc(P.title||'Cheminement de câbles')+(P.ref?' — '+esc(P.ref):'');
    var html='<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+head+'</title>\n'+
      '<!-- Document autonome : aucune connexion réseau requise. -->\n'+
      '<style>\n'+css+'\n</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script>\n'+js+'\n<\/script>\n'+
      '<script>bootViewer('+data+');<\/script>\n</body>\n</html>\n';
    var r=P.release||{};
    var nom=slug(P.ref||P.title)+'-operateur'+(r.hard?'-'+slug(r.hard):'')+(r.trigram?'-'+slug(r.trigram):'');
    download(nom+'.html', html, 'text/html;charset=utf-8');
    toast('Document opérateur exporté ('+koMo(html.length)+')');
  }

  /* démarrage */
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
</body>
</html>
